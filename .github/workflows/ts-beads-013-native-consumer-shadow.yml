name: TS Beads 013 isolated native Product consumer shadow
on:
  push:
    branches: [experiment/beads-consumer-shadow-20261014-012]
    paths: [.github/workflows/ts-beads-013-native-consumer-shadow.yml]
permissions:
  contents: read
jobs:
  native-shadow:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe pinned Product and native Beads without remote writes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(('x-access-token:'+$env:GITHUB_TOKEN)))
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$auth
          $remote='https://github.com/mauedgar/ts-execution-lab.git'
          $nativeRef='refs/dolt/data'
          $expectedNative='1f72d68797114170a97fee27641858f2e55a4571'
          $product='https://github.com/mauedgar/tecnotron-ai.git'
          $expectedProduct='2a42a1bbda6e9fecccb28c42c9c2dd294b3b1c89'
          $expectedTree='04e57337ac129bd40774d48cf2cfee041f904cfa'
          $taskcycle='TASKCYCLE-TECNOTRON-RECIPE-KERNEL-DECOUPLING-001'
          $native=((& git ls-remote $remote $nativeRef|Out-String).Trim() -split "`t")[0]
          if($LASTEXITCODE -ne 0 -or $native -cne $expectedNative){throw ('SHADOW_BLOCKED_NATIVE_REMOTE_DRIFT='+$native)}
          $productHead=((& git ls-remote $product 'refs/heads/tools'|Out-String).Trim() -split "`t")[0]
          if($LASTEXITCODE -ne 0 -or $productHead -cne $expectedProduct){throw ('SHADOW_BLOCKED_PRODUCT_REF_DRIFT='+$productHead)}
          $commit=(& gh api ('repos/mauedgar/tecnotron-ai/git/commits/'+$expectedProduct)|Out-String)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or [string]$commit.tree.sha -cne $expectedTree){throw 'SHADOW_BLOCKED_PRODUCT_TREE_DRIFT'}
          $file=(& gh api 'repos/mauedgar/tecnotron-ai/contents/docs/current-state.md?ref=tools'|Out-String)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'PRODUCT_SOT_READ_FAILED'}
          $source=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(([string]$file.content -replace '\\s','')))
          if(-not $source.Contains($taskcycle) -or -not $source.Contains('terminal_disposition: CLOSED_PASS') -or -not $source.Contains('canonical_commit: 34ab96c00ca5f8c9c87d69a31371d275eeb5f6d9')){throw 'PRODUCT_SUBJECT_SOT_IDENTITY_MISMATCH'}
          $root=Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) ('bds13'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'SHADOW_WORKDIR_ALREADY_EXISTS'}
          New-Item -ItemType Directory $root|Out-Null
          $archive=Join-Path $root 'bd.zip'
          Invoke-WebRequest -Uri 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' -OutFile $archive
          if(((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()) -cne '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76'){throw 'BEADS_BINARY_SHA256_MISMATCH'}
          $bin=Join-Path $root 'bin'
          Expand-Archive -LiteralPath $archive -DestinationPath $bin
          $bd=Get-ChildItem -LiteralPath $bin -Recurse -File -Filter bd.exe|Select-Object -First 1 -ExpandProperty FullName
          if(-not $bd){throw 'BEADS_BINARY_MISSING'}
          $work=Join-Path $root 'lab'
          & git clone --quiet --no-tags --single-branch --branch experiment/beads-consumer-shadow-20261014-012 $remote $work
          if($LASTEXITCODE -ne 0){throw 'LAB_FRESH_CLONE_FAILED'}
          Push-Location $work
          try {
            $env:BEADS_DIR=Join-Path $work '.beads'
            if(Test-Path -LiteralPath $env:BEADS_DIR){throw 'NOT_A_FRESH_BEADS_CONSUMER'}
            & $bd bootstrap
            if($LASTEXITCODE -ne 0){throw 'BEADS_NATIVE_BOOTSTRAP_FAILED'}
            function JsonBd([string[]]$Args) {
              $raw=(& $bd @Args 2>&1|Out-String).Trim()
              if($LASTEXITCODE -ne 0){throw ('BEADS_READ_FAILED_'+($Args -join '_')+':'+$raw)}
              $found=[regex]::Match($raw,'(?s)(\[\s*\{.*\}\s*\]|\[\s*\])\s*
            }
            $all=@(JsonBd @('list','--all','--json','--limit','100'))
            $ready=@(JsonBd @('ready','--json'))
            if($all.Count -ne 4){throw ('PINNED_NATIVE_RECORD_COUNT_DRIFT='+$all.Count)}
            $ids=@($all|ForEach-Object {[string]$_.id})
            if(@($ids|Select-Object -Unique).Count -ne $ids.Count){throw 'DUPLICATE_NATIVE_ID'}
            $readyIds=@($ready|ForEach-Object {[string]$_.id})
            foreach($item in $ready){
              if([string]$item.status -cne 'open' -or $ids -notcontains [string]$item.id){throw 'NATIVE_READY_FRONTIER_INVALID'}
            }
            $original=@(JsonBd @('show','producer-avr','--json'))[0]
            if([string]$original.id -cne 'producer-avr' -or [string]$original.status -cne 'closed' -or -not ([string]$original.description).Contains('SOURCE_REF=test://TS-BEADS-CROSS-SURFACE-HANDOFF-20261013-010/ORIGIN@001')){throw 'ORIGINAL_SYNTHETIC_HANDOFF_IDENTITY_MISMATCH'}
            if($readyIds -contains 'producer-avr'){throw 'CLOSED_NATIVE_ISSUE_REENTERED_READY'}
            $receipt=[ordered]@{
              schema='ts-beads-consumer-shadow-013/v1'
              evidence='NATIVE_READ_GITHUB_ACTIONS'
              product_ref=$productHead
              product_tree=$expectedTree
              product_taskcycle=$taskcycle
              product_subject_state='CLOSED_PASS'
              product_authority='SOT_OUTSIDE_BEADS'
              beads_git_remote_ref=$native
              beads_version='v1.3.1'
              native_record_count=$all.Count
              native_ready_count=$ready.Count
              native_ready_ids=$readyIds
              native_closed_synthetic_handoff='producer-avr'
              Product_effect='NONE'
              Beads_remote_push_count=0
              new_TaskCycle_count=0
              Product_repository_writes=0
              comparison='CLOSED_PRODUCT_SUBJECT_IS_NOT_REOPENED_BY_NATIVE_BEADS_READY'
              remaining='LIFECYCLE_EFFECT_PARITY_NOT_PROVEN'
            }
            $receipt|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beads-013-native-shadow.json') -Encoding utf8
            Write-Output ('TS_BEADS013_NATIVE_SHADOW=PASS;product='+$productHead+';dolt='+$native+';records='+$all.Count+';ready='+$ready.Count+';closed_synthetic=producer-avr;Product_effect=NONE')
          } finally {Pop-Location}
          $after=((& git ls-remote $remote $nativeRef|Out-String).Trim() -split "`t")[0]
          if($LASTEXITCODE -ne 0 -or $after -cne $expectedNative){throw ('BEADS013_UNEXPECTED_REMOTE_REF_CHANGE='+$after)}
          Write-Output 'TS_BEADS013_REMOTE_UNCHANGED=PASS'
      - name: Export bounded read-only experimental receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads-013-native-shadow-receipt
          path: ${{ runner.temp }}/beads-013-native-shadow.json
          if-no-files-found: warn
          retention-days: 7
)
              if(-not $found.Success){throw ('BEADS_JSON_MISSING_'+($Args -join '_'))}
              try { return ($found.Groups[1].Value|ConvertFrom-Json -ErrorAction Stop) }
              catch { throw ('BEADS_JSON_PARSE_FAILED_'+($Args -join '_')+':'+$_.Exception.Message) }
            }
            $all=@(JsonBd @('list','--all','--json','--limit','100'))
            $ready=@(JsonBd @('ready','--json'))
            if($all.Count -ne 4){throw ('PINNED_NATIVE_RECORD_COUNT_DRIFT='+$all.Count)}
            $ids=@($all|ForEach-Object {[string]$_.id})
            if(@($ids|Select-Object -Unique).Count -ne $ids.Count){throw 'DUPLICATE_NATIVE_ID'}
            $readyIds=@($ready|ForEach-Object {[string]$_.id})
            foreach($item in $ready){
              if([string]$item.status -cne 'open' -or $ids -notcontains [string]$item.id){throw 'NATIVE_READY_FRONTIER_INVALID'}
            }
            $original=@(JsonBd @('show','producer-avr','--json'))[0]
            if([string]$original.id -cne 'producer-avr' -or [string]$original.status -cne 'closed' -or -not ([string]$original.description).Contains('SOURCE_REF=test://TS-BEADS-CROSS-SURFACE-HANDOFF-20261013-010/ORIGIN@001')){throw 'ORIGINAL_SYNTHETIC_HANDOFF_IDENTITY_MISMATCH'}
            if($readyIds -contains 'producer-avr'){throw 'CLOSED_NATIVE_ISSUE_REENTERED_READY'}
            $receipt=[ordered]@{
              schema='ts-beads-consumer-shadow-013/v1'
              evidence='NATIVE_READ_GITHUB_ACTIONS'
              product_ref=$productHead
              product_tree=$expectedTree
              product_taskcycle=$taskcycle
              product_subject_state='CLOSED_PASS'
              product_authority='SOT_OUTSIDE_BEADS'
              beads_git_remote_ref=$native
              beads_version='v1.3.1'
              native_record_count=$all.Count
              native_ready_count=$ready.Count
              native_ready_ids=$readyIds
              native_closed_synthetic_handoff='producer-avr'
              Product_effect='NONE'
              Beads_remote_push_count=0
              new_TaskCycle_count=0
              Product_repository_writes=0
              comparison='CLOSED_PRODUCT_SUBJECT_IS_NOT_REOPENED_BY_NATIVE_BEADS_READY'
              remaining='LIFECYCLE_EFFECT_PARITY_NOT_PROVEN'
            }
            $receipt|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beads-013-native-shadow.json') -Encoding utf8
            Write-Output ('TS_BEADS013_NATIVE_SHADOW=PASS;product='+$productHead+';dolt='+$native+';records='+$all.Count+';ready='+$ready.Count+';closed_synthetic=producer-avr;Product_effect=NONE')
          } finally {Pop-Location}
          $after=((& git ls-remote $remote $nativeRef|Out-String).Trim() -split "`t")[0]
          if($LASTEXITCODE -ne 0 -or $after -cne $expectedNative){throw ('BEADS013_UNEXPECTED_REMOTE_REF_CHANGE='+$after)}
          Write-Output 'TS_BEADS013_REMOTE_UNCHANGED=PASS'
      - name: Export bounded read-only experimental receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads-013-native-shadow-receipt
          path: ${{ runner.temp }}/beads-013-native-shadow.json
          if-no-files-found: warn
          retention-days: 7
