name: TS-BEADS 047B V6P3R2 F001 synthetic PID regression
on:
  push:
    branches:
      - experiment/ts-beads-047b-v6p3r2-pid-isolation-20261102-001
    paths:
      - .github/workflows/ts-beads047b-v6p3r2-f001-synthetic.yml
permissions:
  contents: read
jobs:
  f001_source_only:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Fix checkout LF and prevent credentials persistence
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ae7ea936f4d3a2a5bb59c2c178ec3c8e0af588c5
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and missing live launcher
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne 'ae7ea936f4d3a2a5bb59c2c178ec3c8e0af588c5') { throw 'F001_FROZEN_SHA_MISMATCH' }
          $candidate='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/OFFLINE-PRIVILEGE-FIXTURE-V6P3R2-20261102-001'
          $runner=Join-Path $candidate 'candidate/Invoke-047B-V6-Fixture.ps1'
          $blob=(git hash-object $runner).Trim()
          if ($blob -cne 'c483edd310756097027c2f6c17e483eac69c9fb7') { throw 'F001_RUNNER_HASH_MISMATCH' }
          if (Test-Path -LiteralPath (Join-Path $candidate 'candidate/Start-047B-V6.ps1')) { throw 'THIS_PARTIAL_CANDIDATE_MUST_NOT_BE_LAUNCHED' }
          if (Test-Path -LiteralPath (Join-Path $candidate 'MANIFEST.json')) { throw 'UNEXPECTED_DISPATCH_MANIFEST' }
          'TS047B_F001_PARTIAL_SOURCE_IDENTITY=PASS'
      - name: Execute bounded no-SQL synthetic stage transition
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/OFFLINE-PRIVILEGE-FIXTURE-V6P3R2-20261102-001/tests/Test-V6P3R2-StageIdentity-Synthetic.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'F001_SYNTHETIC_TEST_FAILED' }
          'TS047B_F001_SYNTHETIC_SOURCE_ONLY=PASS_NO_SQL'
