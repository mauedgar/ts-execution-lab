name: Tecnotron Python315 legacy three-pin wheel probe
on:
  push:
    branches: [experiment/python315-legacy-three-deps-20261102-001]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mauedgar/tecnotron-ai
          ref: bc9e60b9cad79037b40c298d5c9a84f17a33d909
          persist-credentials: false
      - name: Verify original Product baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bc9e60b9cad79037b40c298d5c9a84f17a33d909'
          test "$(git rev-parse HEAD:python/requirements.txt)" = 'b1a9f877be8b54618942e295e95bf43bda264e42'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Install pinned uv
        shell: bash
        run: python -m pip install uv==0.13.6
      - name: Derived three-pin wheel-only probe
        shell: bash
        run: |
          python - <<'PY'
          import json,os,sys,pathlib,platform,subprocess
          assert sys.version_info[:3] == (3,15,2)
          orig=pathlib.Path('python/requirements.txt').read_text(encoding='utf-8-sig').splitlines()
          replacements={'aiohttp==3.10.7':'aiohttp==3.14.5',
                        'yarl==1.24.5':'yarl==1.25.1',
                        'grpcio==1.83.0':'grpcio==1.85.1'}
          assert all(orig.count(k)==1 for k in replacements), 'SOURCE_MANIFEST_CHANGED'
          lines=[]
          for line in orig:
              line=replacements.get(line,line)
              if line.startswith(('pywin32==','win32_setctime==')):
                  line+=' ; sys_platform == "win32"'
              lines.append(line)
          pathlib.Path('derived-requirements.txt').write_text('\n'.join(lines)+'\n')
          result={'class':'ISOLATED_QUALIFICATION_NOT_PRODUCT_CHANGE','run_id':os.getenv('GITHUB_RUN_ID'),
                  'original_manifest_blob':'b1a9f877be8b54618942e295e95bf43bda264e42',
                  'original_product_commit':'bc9e60b9cad79037b40c298d5c9a84f17a33d909',
                  'python':sys.version,'platform':platform.platform(),
                  'replacements':replacements,'Product_effect':'NONE'}
          v=subprocess.run(['uv','venv','.venv-probe','--python',sys.executable],capture_output=True,text=True,timeout=90)
          if v.returncode:
              result.update(status='BLOCKED_VENV',exit=v.returncode,tail=v.stderr[-8000:])
          else:
              try:
                  p=subprocess.run(['uv','pip','install','--python','.venv-probe','--only-binary',':all:','-r','derived-requirements.txt'],capture_output=True,text=True,timeout=480)
                  result.update(status='PASS' if p.returncode==0 else 'BLOCKED_DEPENDENCIES',
                                exit=p.returncode,tail=(p.stdout+'\n'+p.stderr)[-12000:])
              except subprocess.TimeoutExpired:
                  result.update(status='TIMEOUT')
          pathlib.Path('qualification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python315-legacy-three-pin-${{ matrix.os }}
          path: qualification.json
          if-no-files-found: warn
