name: TS R3 A001 TLS strict secretless native qualification 006
on:
  push:
    branches:
      - ee/ts-r3-a001-tls-secretless-20261107-006
permissions:
  contents: read
concurrency:
  group: ts-r3-a001-tls-secretless-20261107-005
  cancel-in-progress: false
jobs:
  strict-tls-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
    steps:
      - name: Checkout experimental source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify full exact one-workflow manifest and frozen source before dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ca13ac32d789f1ef2a4f49c305e52298a1b32693"
          test "$(git show -s --format=%T HEAD^)" = "5d799b00a8af550f8cd0bb436df56ea838a0dd60"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = "$(printf 'A\t%s' '.github/workflows/ts-r3-a001-tls-secretless-20261107-006.yml')"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ts-r3-a001-tls-secretless-20261107-006.yml"
          test "$(git ls-tree HEAD -- '.github/workflows/ts-r3-a001-tls-secretless-20261107-006.yml' | cut -d' ' -f1)" = "100644"
          test "$(git hash-object experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/runners/neon_readonly_preflight.py)" = "0125eab356f5f108338f02da31fea0c065980359"
          test "$(git hash-object experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/tests/test_neon_readonly_preflight.py)" = "f29f4244fe4192544ee89d78ac65999640ff6bf0"
          test "$(git hash-object experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/pyproject.toml)" = "2fe9ee1733e71107eac5eb3c915642a3801e210f"
          test -z "$(git status --porcelain)"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo "BLOCKED_UNEXPECTED_SECRET_EXPOSURE"; exit 41; }
          echo A001_STRICT_TLS_FROZEN_SOURCE_PASS_NO_SECRET
      - name: Pin uv0.13.7 and Python3.15.2 in disposable runner
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Native pinned psycopg and eleven no-secret tests
        working-directory: experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001
        run: |
          set -euo pipefail
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo "BLOCKED_UNEXPECTED_SECRET_EXPOSURE"; exit 41; }
          uv_report="$(uv --version)"
          case "$uv_report" in
            "uv 0.13.7"|"uv 0.13.7 (x86_64-unknown-linux-gnu)") ;;
            *) echo "BLOCKED_UV_VERSION"; exit 31 ;;
          esac
          uv python install 3.15.2
          uv lock --no-config --python 3.15.2
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = "5f9d50047f5f55da1002c951e1f8f0da0d30f89bd7fdbd7359f7164d933b157d"
          uv lock --no-config --check --python 3.15.2
          uv sync --no-config --locked --python 3.15.2 --no-install-project
          .venv/bin/python -I -B -c 'import sys,psycopg,psycopg.pq; assert sys.version_info[:3] == (3,15,2); assert psycopg.__version__ == "3.3.8"; assert psycopg.pq.__impl__ == "binary"'
          .venv/bin/python -B runners/neon_readonly_preflight.py --self-test
          .venv/bin/python -B -m unittest discover -s tests -p 'test_neon_readonly_preflight.py' -v 2>&1 | tee "$RUNNER_TEMP/a001-nine-tests.log"
          grep -q '^Ran 11 tests in' "$RUNNER_TEMP/a001-nine-tests.log"
          grep -Fxq 'OK' "$RUNNER_TEMP/a001-nine-tests.log"
          set +e
          fail_out="$(.venv/bin/python -B runners/neon_readonly_preflight.py 2>&1)"
          fail_status=$?
          set -e
          test "$fail_status" -eq 2 || { echo "BLOCKED_NO_DSN_EXIT_MISMATCH"; exit 42; }
          .venv/bin/python -c 'import json,sys; out=json.loads(sys.argv[1]); assert out["status"] == "BLOCKED_PRECONDITION" and out["error_type"] == "BlockedPrecondition" and out["product_effect"] == "NONE"' "$fail_out"
          echo A001_PY315_TLS_SYSTEMROOTS_SECRETLESS_ELEVEN_TESTS_PASS_NO_DSN_NO_SQL
