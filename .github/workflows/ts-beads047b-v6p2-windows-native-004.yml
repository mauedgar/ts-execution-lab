name: TS-BEADS-047B V6P2 LF attributes original Windows native no-SQL 004
on:
  push:
    branches:
      - experiment/ts-beads-047b-v6p2-windows-native-20261102-004
    paths:
      - .github/workflows/ts-beads047b-v6p2-windows-native-004.yml
permissions:
  contents: read
jobs:
  v6p2_native_original_attempt_004:
    if: ${{ github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Pin Git raw checkout policy BEFORE source materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf true
          if($LASTEXITCODE -ne 0){throw 'CONFIG_AUTOCRLF_FAILED'}
          git config --global core.safecrlf true
          if($LASTEXITCODE -ne 0){throw 'CONFIG_SAFECRLF_FAILED'}
          git config --global core.eol lf
          if($LASTEXITCODE -ne 0){throw 'CONFIG_EOL_FAILED'}
          if((git config --global --get core.autocrlf) -cne 'true'){throw 'GIT_CONFIG_NOT_FROZEN'}
      - name: Checkout immutable V6P1 original source
        uses: actions/checkout@v4
        with:
          ref: ca8d467a8b8c4490db913bb76b20b59966d14acb
          path: source
          persist-credentials: false
      - name: Prove V6P2 LF attributes under Windows autocrlf true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git config --global --get core.autocrlf) -cne 'true'){throw 'AUTOCRLF_CHALLENGE_MISSING'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $file=Join-Path $source 'experiments\TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001\OFFLINE-PRIVILEGE-FIXTURE-V6P2-20261102-001\candidate\Security-047B-V6.psm1'
          $eol=(& git -C $source ls-files --eol -- $file) -join ' '
          if($LASTEXITCODE -ne 0 -or $eol -notmatch 'i/lf\s+w/lf'){throw 'GITATTRIBUTES_NOT_ENFORCING_LF'}
          if([Array]::IndexOf([IO.File]::ReadAllBytes($file),[byte]13) -ge 0){throw 'CR_PRESENT_AFTER_WINDOWS_CHECKOUT'}
          Write-Output 'TS047B_V6P2_ATTRS=PASS_AUTOCRLF_TRUE_I_LF_W_LF'
          git config --global core.autocrlf false
          if($LASTEXITCODE -ne 0){throw 'GATE_CHECKOUT_CONFIG_FAILED'}
      - name: Checkout immutable runner from original workflow event
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: gate
          persist-credentials: false
      - name: Select Python for real native source contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner binding and enforce raw LF from original Git index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'RETRY_NOT_AUTHORIZED'}
          if($env:GITHUB_REF_NAME -cne 'experiment/ts-beads-047b-v6p2-windows-native-20261102-004'){throw 'BRANCH_NOT_EXPECTED'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $gate=Join-Path $env:GITHUB_WORKSPACE 'gate'
          $runner=Join-Path $gate 'experiments\TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001\WINDOWS-NOSQL-V6P2-NATIVE-20261102-004\Invoke-WindowsV6P2NativeNoSql.ps1'
          $original=(& git -C $source rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $original -cne 'ca8d467a8b8c4490db913bb76b20b59966d14acb') {throw 'NOT_ORIGINAL_SOURCE'}
          $actualBlob=(& git -C $gate -c core.autocrlf=false hash-object --no-filters $runner).Trim()
          if($LASTEXITCODE -ne 0 -or $actualBlob -cne '4dbe6e8c8d8ded05e81edc2795fb40cf1b1cf5e3') {throw 'RUNNER_BLOB_NOT_PINNED'}
          & git -C $source -c core.autocrlf=false -c core.safecrlf=true checkout-index --force --all
          if($LASTEXITCODE -ne 0){throw 'RAW_INDEX_MATERIALIZATION_FAILED'}
          $example=Join-Path $source 'experiments\TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001\OFFLINE-PRIVILEGE-FIXTURE-V6P1-20261102-001\candidate\Security-047B-V6.psm1'
          $eol=(& git -C $source ls-files --eol -- $example) -join ' '
          if($LASTEXITCODE -ne 0 -or $eol -notmatch 'i/lf\s+w/lf'){throw 'SOURCE_LF_INDEX_WORKTREE_NOT_EQUAL'}
          Write-Output 'TS047B_LF_CHECKOUT=i/lf,w/lf;source=PINNED;execution=NO_SQL'
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File $runner -SourceCheckoutRoot $source
          if($LASTEXITCODE -ne 0){throw 'NATIVE_LF_TEST_REPORTED_FAILURE'}
          Write-Output 'TS047B_WINDOWS_NATIVE004=PASS_UNPATCHED_SOURCE_LF_AND_NATIVE_NO_SQL_GITHUB_HOST_ONLY'
      - name: Publish original result once, even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads047b-windows-native004-${{ github.run_id }}
          path: ${{ runner.temp }}/TS_BEADS_047B_V6P2_WINDOWS_NATIVE_004_RESULT.json
          if-no-files-found: warn
          retention-days: 30
