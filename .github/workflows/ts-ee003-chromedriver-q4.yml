name: TS EE 003 ChromeDriver Q4 synthetic four-viewport browser
on:
  push:
    branches:
      - experiment/ts-ee003-chromedriver-q4-20261121
permissions:
  contents: read
concurrency:
  group: ts-ee003-chromedriver-q4
  cancel-in-progress: false
jobs:
  browser:
    name: q4-viewport-${{ matrix.width }}
    strategy:
      fail-fast: false
      matrix:
        width: [320, 375, 768, 1440]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22.23.3
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
      - name: Native source, versions and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse 'HEAD^{tree}'
          echo "ImageVersion=${ImageVersion:-UNAVAILABLE}"
          node --version
          command -v google-chrome
          command -v chromedriver
          google-chrome --version
          chromedriver --version
          sha256sum "$(readlink -f "$(command -v google-chrome)")" "$(readlink -f "$(command -v chromedriver)")"
          node --check experiments/TS-EE-CHROMEDRIVER-20261121-001/browser_synthetic_q4.mjs
          node --check experiments/TS-EE-CHROMEDRIVER-20261121-001/q4_receipt_gate.mjs
      - name: One ChromeDriver session with real synthetic local browser QA
        env:
          TS_EE_Q4_WIDTH: ${{ matrix.width }}
          TS_EE_Q4_OUTPUT_DIR: q4-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/browser_synthetic_q4.mjs
      - name: Verify actual 11 browser checks, screenshot hash and seven negative receipt vectors
        env:
          TS_EE_Q4_OUTPUT_DIR: q4-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/q4_receipt_gate.mjs
      - name: Upload bounded actual synthetic screenshot and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee003-q4-${{ matrix.width }}
          path: |
            q4-evidence/Q4_REPORT.json
            q4-evidence/q4-*.png
          retention-days: 5
          if-no-files-found: error
