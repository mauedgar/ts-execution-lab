name: TS R3 E1 Product bridge FakeConn prior-hash repair V3
on:
  push:
    branches:
      - ee/ts-r3-e1-bridge-byte-parity-20261107-003
permissions:
  contents: read
concurrency:
  group: ts-r3-e1-bridge-byte-parity-20261107-002
  cancel-in-progress: false
jobs:
  product-bridge-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
    steps:
      - name: Checkout precise experimental candidate without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen two-file A-M repair and canonical Product Python sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f802baa4328fb7ae7b9e20da70ba01a1cf408fd1"
          test "$(git show -s --format=%T HEAD^)" = "3cc800d099f06c54852b7ae034ee0a1fdd67fcd9"
          expected="$(printf '%s\n' '.github/workflows/ts-r3-e1-bridge-byte-parity-20261107-003.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_bridge.py')"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected"
          expected_status="$(printf 'A\t%s\nM\t%s\n' '.github/workflows/ts-r3-e1-bridge-byte-parity-20261107-003.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_bridge.py')"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = "$expected_status"
          check_frozen() {
            local file="$1" sha="$2"
            test "$(git rev-parse "HEAD:$file")" = "$sha"
            test "$(git ls-tree HEAD -- "$file")" = "$(printf '100644 blob %s\t%s' "$sha" "$file")"
            test "$(git hash-object "$file")" = "$sha"
          }
          test "$(git ls-tree HEAD -- '.github/workflows/ts-r3-e1-bridge-byte-parity-20261107-003.yml' | cut -d' ' -f1)" = "100644"
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/capture.cjs' 'a476c8f0ca39793494bc0551ca53dae05e241a62'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_bridge.py' 'f203e79cc1fdb51420800cfcdbba75198b1fef35'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' '5d2d3a8a24ebc17339675e0c801595956e0cd353'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' '0219b92e5f546407a6060a6dc449865c14c7f144'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' 'f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/bridge.py' '61be5ce70662a31118f9ffe442d1a03a5e9f195d'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/legacy_v0.py' '1e39566fdd8cfb0a8de2726c613fb99fd1faa808'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/tests/test_bridge.py' '8cbb11fbf906329db57b6d5d1a6967e67a6c739b'
          test -z "$(git status --porcelain)"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_UNEXPECTED_DSN; exit 40; }
          echo E1_BRIDGE_V3_REPAIRED_SOURCES_FROZEN_NO_DSN_PASS
      - name: Install pinned Node22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Install pinned uv0.13.7 Python3.15.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Capture 20 real Product generations then verify bridge exact bytes under FakeConn
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "22.16.0"
          test "$(uv --version | cut -d' ' -f1-2)" = "uv 0.13.7"
          uv python install 3.15.2
          py315="$(uv python find 3.15.2)"
          "$py315" -B -c 'import sys; assert sys.version_info[:3] == (3,15,2)'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir "$workdir/clean-home"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/capture.cjs' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' "$workdir/"
          env -i PATH="$PATH" HOME="$workdir/clean-home" npm_config_cache="$workdir/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null npm ci --prefix "$workdir" --ignore-scripts --no-audit --no-fund
          test "$(env -i PATH="$PATH" HOME="$workdir/clean-home" node -p "require('$workdir/node_modules/zod/package.json').version")" = "4.6.7"
          env -i PATH="$PATH" HOME="$workdir/clean-home" node "$workdir/capture.cjs" "$workdir" "$workdir/product-generations.json"
          env -i PATH="$PATH" HOME="$workdir/clean-home" PYTHONPATH="$PWD/experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/:$PWD/experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/tests" PYTHONDONTWRITEBYTECODE=1 \
            "$py315" -B 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_bridge.py' "$workdir/product-generations.json" | tee "$workdir/parity-result.json"
          "$py315" -c 'import json,sys; obj=json.load(open(sys.argv[1])); assert obj["status"] == "PRODUCT_JS_NATIVE_19_EVENTS_BRIDGE_FAKECONN_BYTE_PARITY_PASS" and obj["product_events"] == 19 and obj["bridge_receipts"] == 19 and obj["sql_effect"] == "NONE" and obj["product_effect"] == "NONE"' "$workdir/parity-result.json"
          echo E1_V3_PRODUCT_19_EVENTS_PY315_BRIDGE_BYTE_PARITY_PASS_FAKECONN_NO_SQL
