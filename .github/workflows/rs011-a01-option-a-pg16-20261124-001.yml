name: TS RS011 A01 Option A isolated PG16 authority serialization CI001
on:
  push:
    branches:
      - rs011/a01-option-a-pg16-20261124-001
    paths:
      - .github/workflows/rs011-a01-option-a-pg16-20261124-001.yml
permissions:
  contents: read
jobs:
  a01-option-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_CONFIG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TS_RS011_A01_DISPOSABLE: 'yes'
    services:
      pg16:
        image: postgres@sha256:5983db9a9c6ad225a48a46cfe2e03e6680b1826662befd0465eb05b34cb1c64e
        env:
          POSTGRES_PASSWORD: 'a01-disposable-admin'
          POSTGRES_DB: postgres
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch, frozen subject and exact additive write-set
        shell: bash
        run: |
          set -euo pipefail
          base=a0e1d8c06255d908c481c6ccf8099ec99b67b64c
          root=experiments/TS-RS011-A01-OPTION-A-PG16-20261124-001
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/rs011/a01-option-a-pg16-20261124-001
          test "$(git rev-parse HEAD^)" = 52ad0c997c0ff9827715642f6710b1d29a23ab
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "HEAD:$root/schema.sql")" = 1a5027709214092a4cabb21c63a53ca4f262c09c
          test "$(git rev-parse "HEAD:$root/probe.py")" = 0f55982a783782bc04df581615c9f6052e12b92e
          test "$(git rev-parse "HEAD:$root/README.md")" = 08de519f9e2432e98855fad448aa9d9501d0c7b4
          test "$(git diff --name-only "$base" HEAD | wc -l)" -eq 4
          while IFS= read -r f; do
            case "$f" in
              "$root/schema.sql"|"$root/probe.py"|"$root/README.md"|.github/workflows/rs011-a01-option-a-pg16-20261124-001.yml) ;;
              *) echo UNEXPECTED_WRITESET >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo A01_NONPRODUCT_EXACT_SOURCE_FROZEN
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'
      - name: Prepare standalone Python and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          /usr/bin/psql --version
          uv python install 3.15.2
      - name: Execute one disposable eight-vector experiment
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.15.2 python -B experiments/TS-RS011-A01-OPTION-A-PG16-20261124-001/probe.py
          echo A01_CI001_LIMITED_PASS_NO_PRODUCT_AUTHORITY_TRANSFER
