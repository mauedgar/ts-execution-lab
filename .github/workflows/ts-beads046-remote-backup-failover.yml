name: TS Beads 046 two-host nonterminal native backup recovery
on:
  push:
    branches:
      - experiment/beads-046-native-backup-failover-20261031-001
    paths:
      - .github/workflows/ts-beads046-remote-backup-failover.yml
permissions:
  contents: read
  actions: read
jobs:
  host_A_producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen identity and original 045 witness; prepare binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = experiment/beads-046-native-backup-failover-20261031-001
          root=experiments/TS-BEADS-046-NATIVE-BACKUP-FAILOVER-20261031-001
          test "$(git hash-object "$root/native046.py")" = 47921fceae8ad93760b912224afd8c4d9cf70a99
          test "$(git hash-object "$root/DOD.md")" = 1eeb45cd800be02b980c9eda0de0a1331689bf5f
          python3 -m py_compile "$root/native046.py"
          witness="$(gh api repos/mauedgar/ts-execution-lab/actions/runs/41177022889)"
          test "$(jq -r .status <<< "$witness")" = completed
          test "$(jq -r .conclusion <<< "$witness")" = success
          test "$(jq -r .head_sha <<< "$witness")" = aae4dabd9c2b6d37a24bba896d2eaa2199533287
          art="$(gh api repos/mauedgar/ts-execution-lab/actions/artifacts/13032823741)"
          test "$(jq -r .digest <<< "$art")" = sha256:07b70ea4902d4bfec9efdda08e939b3d753287a2d2b74c6a7e4fe93f38ee33f4
          test "$(jq -r .expired <<< "$art")" = false
          scratch="$RUNNER_TEMP/ts-beads046-$GITHUB_RUN_ID-A"
          test ! -e "$scratch"
          mkdir -p "$scratch/bin" "$scratch/original"
          curl -fsSL -o "$scratch/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $scratch/beads.tar.gz" | sha256sum -c -
          tar -xzf "$scratch/beads.tar.gz" -C "$scratch/bin"
          bd_bin="$(find "$scratch/bin" -type f -name bd -print -quit)"
          test -n "$bd_bin"
          chmod +x "$bd_bin"
          echo "BD_BIN=$bd_bin" >> "$GITHUB_ENV"
          echo "TS046_ROOT=$scratch/work" >> "$GITHUB_ENV"
          echo "TS046_ART=$scratch/original" >> "$GITHUB_ENV"
          echo "TS046_ROLE=producer" >> "$GITHUB_ENV"
          echo "TS046_PROVIDER_VERIFIED=yes" >> "$GITHUB_ENV"
      - name: Create nonterminal Beads state and native Dolt backup for separate host
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-BEADS-046-NATIVE-BACKUP-FAILOVER-20261031-001
          python3 "$root/native046.py"
          test "$(jq -r .status "$TS046_ART/RESULT046_A.json")" = PASS_NATIVE_BACKUP_PUBLISHED_FROM_NONTERMINAL_HOST_A
          test "$(jq -r .execution_attempt "$TS046_ART/RESULT046_A.json")" = TS-BEADS-046-A-ATTEMPT-001
          test -s "$TS046_ART/BACKUP046.tar.gz"
          (cd "$TS046_ART" && sha256sum -c BACKUP_SHA256.txt && sha256sum RESULT046_A.json BACKUP046.tar.gz BACKUP_SHA256.txt > ORIGINAL_A_SHA256.txt)
          echo "TS_BEADS046_HOST_A=PASS;remote_artifact_pending_upload;Product=NONE"
      - name: Publish original host-A backup before host disposal
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-beads046-producer-${{ github.run_id }}
          path: ${{ runner.temp }}/ts-beads046-${{ github.run_id }}-A/original/
          if-no-files-found: warn
          retention-days: 30
  host_B_recover:
    needs: host_A_producer
    if: ${{ needs.host_A_producer.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ts-beads046-producer-${{ github.run_id }}
          path: ${{ runner.temp }}/ts-beads046-producer-original
      - name: Verify immutable source, original remote backup and original witness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          root=experiments/TS-BEADS-046-NATIVE-BACKUP-FAILOVER-20261031-001
          test "$(git hash-object "$root/native046.py")" = 47921fceae8ad93760b912224afd8c4d9cf70a99
          test "$(git hash-object "$root/DOD.md")" = 1eeb45cd800be02b980c9eda0de0a1331689bf5f
          python3 -m py_compile "$root/native046.py"
          witness="$(gh api repos/mauedgar/ts-execution-lab/actions/runs/41177022889)"
          test "$(jq -r .conclusion <<< "$witness")" = success
          test "$(jq -r .head_sha <<< "$witness")" = aae4dabd9c2b6d37a24bba896d2eaa2199533287
          art="$(gh api repos/mauedgar/ts-execution-lab/actions/artifacts/13032823741)"
          test "$(jq -r .digest <<< "$art")" = sha256:07b70ea4902d4bfec9efdda08e939b3d753287a2d2b74c6a7e4fe93f38ee33f4
          scratch="$RUNNER_TEMP/ts-beads046-$GITHUB_RUN_ID-B"
          test ! -e "$scratch"
          mkdir -p "$scratch/bin" "$scratch/original"
          curl -fsSL -o "$scratch/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $scratch/beads.tar.gz" | sha256sum -c -
          tar -xzf "$scratch/beads.tar.gz" -C "$scratch/bin"
          bd_bin="$(find "$scratch/bin" -type f -name bd -print -quit)"
          test -n "$bd_bin"
          chmod +x "$bd_bin"
          echo "BD_BIN=$bd_bin" >> "$GITHUB_ENV"
          echo "TS046_ROOT=$scratch/work" >> "$GITHUB_ENV"
          echo "TS046_ART=$scratch/original" >> "$GITHUB_ENV"
          echo "TS046_ROLE=consumer" >> "$GITHUB_ENV"
          echo "TS046_PROVIDER_VERIFIED=yes" >> "$GITHUB_ENV"
          echo "TS046_PRODUCER_ART=$RUNNER_TEMP/ts-beads046-producer-original" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/ts-beads046-producer-original" && sha256sum -c ORIGINAL_A_SHA256.txt && sha256sum -c BACKUP_SHA256.txt)
      - name: Recover without original host and complete native graph
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/TS-BEADS-046-NATIVE-BACKUP-FAILOVER-20261031-001/native046.py
          test "$(jq -r .status "$TS046_ART/RESULT046_B.json")" = PASS_REMOTE_NATIVE_BACKUP_NONTERMINAL_HOST_FAILOVER_WITH_LIMITATIONS
          test "$(jq -r .execution_attempt "$TS046_ART/RESULT046_B.json")" = TS-BEADS-046-B-ATTEMPT-001
          (cd "$TS046_ART" && sha256sum RESULT046_B.json > ORIGINAL_B_SHA256.txt)
          echo "TS_BEADS046_HOST_B=PASS_REMOTE_DURABLE_NONTERMINAL_RECOVERY;SQL_LIVE=NOT_TESTED;Product=NONE"
      - name: Publish independent original host-B final receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-beads046-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/ts-beads046-${{ github.run_id }}-B/original/
          if-no-files-found: warn
          retention-days: 30
