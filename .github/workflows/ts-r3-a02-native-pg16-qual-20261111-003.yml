name: TS R3 A02 native PG16 golden DDL qualifier 003

on:
  push:
    branches:
      - ee/ts-r3-a02-native-pg16-qual-20261111-003
    paths:
      - .github/workflows/ts-r3-a02-native-pg16-qual-20261111-003.yml

permissions:
  contents: read

concurrency:
  group: ts-r3-a02-native-pg16-qual-20261111-001
  cancel-in-progress: false

jobs:
  native-pg16-qualification:
    name: Native PostgreSQL16 synthetic catalog, role, ACL and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
      TS_CI_NATIVE_SYNTHETIC_ONLY: '1'
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-ephemeral-postgres-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout immutable nonProduct experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze source, exact three-file write set, and original attempt
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/ee/ts-r3-a02-native-pg16-qual-20261111-003
          git merge-base --is-ancestor 7bfc538bd2f3bb1a314700e565d3608ef6df7de9 HEAD
          test "$(git rev-parse "HEAD:$root/schema.sql")" = 3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0
          test "$(git rev-parse "HEAD:$root/a02_lan/role_boundary.py")" = 26110b845ae98f3590f6d7580b779ff968b40390
          test "$(git rev-parse "HEAD:$root/a02_lan/native_pg16_ci_qual_003.py")" = 5aac1d747b207b8226741848e7f4e3b3a9f44821
          test "$(git rev-parse "HEAD:$root/a02_lan/NATIVE_PG16_CI_QUAL_INTENT_003.md")" = 0f58780d8c0ee9fd777a40c3c35b93cd439d2db6
          test "$(git diff --name-only 7bfc538bd2f3bb1a314700e565d3608ef6df7de9 HEAD | wc -l)" -eq 3
          while IFS= read -r item; do
            case "$item" in
              ".github/workflows/ts-r3-a02-native-pg16-qual-20261111-003.yml"|\
              "$root/a02_lan/native_pg16_ci_qual_003.py"|\
              "$root/a02_lan/NATIVE_PG16_CI_QUAL_INTENT_003.md") ;;
              *) echo UNAUTHORIZED_WORKSET >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 7bfc538bd2f3bb1a314700e565d3608ef6df7de9 HEAD)
          printf 'NATIVE_PG16_ORIGINAL_PRECONDITION_PASS attempt=TS-R3-A02-NATIVE-PG16-CI-QUAL-20261111-001-A003 sha=%s\n' "$GITHUB_SHA"

      - name: Pin uv tool 0.13.7
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: Execute original native PostgreSQL16 positive and negative checks
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 --with 'psycopg[binary]==3.3.8' \
            python -B "$root/a02_lan/native_pg16_ci_qual_003.py" |
            tee "$RUNNER_TEMP/ts-r3-native-pg16-original.json"
          python3 - "$RUNNER_TEMP/ts-r3-native-pg16-original.json" <<'PY'
          import json,sys
          rows=open(sys.argv[1], encoding='utf-8').read().splitlines()
          assert len(rows)==1
          data=json.loads(rows[0])
          assert data["status"]=="NATIVE_PG16_CI_GOLDEN_DDL_DEFINITION_PASS"
          assert data["execution_attempt"]=="TS-R3-A02-NATIVE-PG16-CI-QUAL-20261111-001-A003"
          assert data["negative_guard_scenarios"]==5
          assert data["same_count_definition_negatives"]==3
          assert data["native_golden_separate_database"]=="postgres"
          assert data["native_golden_full_definitions_match"] is True
          assert data["golden_schema_inventory_sha256"]==data["schema_inventory_sha256"]
          assert data["postgres_image_manifest_sha256"]=="aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139"
          assert data["pg_major"]==16
          assert data["table_count"]==3 and data["column_count"]==19
          assert data["constraint_count"]==18 and data["index_count"]==5
          assert data["expected_source_constraint_gap_confirmed"] is True
          assert data["native_extra_constraint_attestation_rejects"] is True
          assert data["physical_a02"]=="NO_GO" and data["product_effect"]=="NONE"
          print("NATIVE_PG16_A003_ORIGINAL_5_ROLE_AND_3_DEFINITION_NEGATIVES_PASS")
          PY

      - name: Preserve CI native qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$TS_CI_NATIVE_SYNTHETIC_ONLY" = 1
          echo "NATIVE_PG16_CI_EPHEMERAL_DATABASE_ONLY_NO_NEON_NO_PRODUCT_EFFECT"
          echo "NATIVE_PG16_NO_TWO_HOSTS_NO_TCP_LOST_ACK_NO_PRODUCT_KERNEL_MIGRATION"
