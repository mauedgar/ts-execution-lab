name: TS-BEADS 047B F001 logger failure synthetic followup
on:
  push:
    branches:
      - experiment/ts-beads-047b-v6p3r2-pid-isolation-20261102-001
    paths:
      - .github/workflows/ts-beads047b-v6p3r2-f001-logger.yml
permissions:
  contents: read
jobs:
  logger_fail_synthetic:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Force LF before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: 86052f30d662feae6384c54f4fd9046805207cae
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact frozen subject and source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne '86052f30d662feae6384c54f4fd9046805207cae') { throw 'WRONG_F001_SOURCE' }
          $r='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/OFFLINE-PRIVILEGE-FIXTURE-V6P3R2-20261102-001/candidate/Invoke-047B-V6-Fixture.ps1'
          if ((git hash-object $r).Trim() -cne 'c483edd310756097027c2f6c17e483eac69c9fb7') { throw 'F001_SOURCE_DRIFT' }
      - name: Run source-extracted logger-failure negative without SQL
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/OFFLINE-PRIVILEGE-FIXTURE-V6P3R2-20261102-001/tests/Test-V6P3R2-LoggerFailure-Synthetic.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'F001_LOGGER_NEGATIVE_FAILED' }
          'TS047B_F001_LOGGER_NEGATIVE=PASS_NO_SQL'
