name: TS Beads 031 B-First Audit and UNKNOWN Boundary Evidence
on:
  push:
    branches: [experiment/beads-031-native-history-provider-unknown-20261029-001]
    paths: [.github/workflows/ts-beads-031-source-audit.yml]
permissions:
  contents: write
  actions: read
jobs:
  source-and-historical-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original Kernel history versus native Dolt explicit commits and previous causal evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=experiment/beads-031-native-history-provider-unknown-20261029-001
          product=d4154bd43f26515c39a41be974e462a0c7406a2d
          tree=cbfb71ad8632047e8e64fe2665d8614d835a2c8b
          shared=1f72d68797114170a97fee27641858f2e55a4571
          test "$(git branch --show-current)" = "$branch"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          scratch="$RUNNER_TEMP/ts-beads-031-$GITHUB_RUN_ID"
          test ! -e "$scratch"
          mkdir -p "$scratch"
          export EXPERIMENT_SCRATCH="$scratch"
          export PRODUCT_ROOT="$scratch/product"
          git clone -q --no-checkout https://github.com/mauedgar/tecnotron-ai.git "$PRODUCT_ROOT"
          git -C "$PRODUCT_ROOT" checkout -q --detach "$product"
          test "$(git -C "$PRODUCT_ROOT" rev-parse HEAD)" = "$product"
          test "$(git -C "$PRODUCT_ROOT" rev-parse 'HEAD^{tree}')" = "$tree"
          test "$(git -C "$PRODUCT_ROOT" hash-object docs/SOURCE_OF_TRUTH.md)" = dd8d34a7e3ef3094805d014f9e59741d2c553957
          test "$(git -C "$PRODUCT_ROOT" hash-object docs/current-state.md)" = 0d8a6426f51020d51d74bfb50dc8702a07f02837
          export KERNEL_SOURCE="$PRODUCT_ROOT/src/state-kernel-v0/store.js"
          test "$(git -C "$PRODUCT_ROOT" hash-object src/state-kernel-v0/store.js)" = f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a
          export DOLT_PROCEDURE_SOURCE="$scratch/dolt_commit.go"
          curl --fail --location --silent --show-error \
           https://raw.githubusercontent.com/dolthub/dolt/v2.2.0/go/libraries/doltcore/sqle/dprocedures/dolt_commit.go \
           --output "$DOLT_PROCEDURE_SOURCE"
          test "$(git hash-object "$DOLT_PROCEDURE_SOURCE")" = 00d064481f34feb33dfb240d8056df3ecad83e04
          git fetch -q --no-tags origin refs/heads/experiment/beads-028-failclosed-route-inventory-20261028-001
          git fetch -q --no-tags origin refs/heads/experiment/beads-030-b-first-consumer-parity-20261029-001
          git cat-file -e '9e8016004ef5d3ca74abd67914d8e1a03ffcd851^{commit}'
          git cat-file -e '11934b997c5c466dd480e914df535f928a7b12d1^{commit}'
          git show 9e8016004ef5d3ca74abd67914d8e1a03ffcd851:transport/TS-BEADS-028-FAILCLOSED-20261028-001/EVIDENCE_CARRIER.txt > "$scratch/028.txt"
          git show 11934b997c5c466dd480e914df535f928a7b12d1:transport/TS-BEADS-030-PARITY-20261029-001/EVIDENCE_CARRIER.txt > "$scratch/030.txt"
          test "$(git hash-object "$scratch/028.txt")" = 7c96a1886eebeb693f5f0c7de6d2f117c39b9111
          test "$(git hash-object "$scratch/030.txt")" = 7a249a61fb16026ae507b7a702778a6656db916e
          tool="$PRODUCT_ROOT/scripts/review_txt_carrier.py"
          for n in 028 030; do
             python3 "$tool" verify "$scratch/$n.txt" --report "$scratch/verify-$n.json"
             python3 "$tool" extract "$scratch/$n.txt" --out "$scratch/$n" --report "$scratch/extract-$n.json"
             python3 - "$scratch/verify-$n.json" "$scratch/extract-$n.json" <<'PY'
          import json,sys
          for x in sys.argv[1:]:
             j=json.load(open(x))
             assert j["status"]=="PASS" and j["member_payload_equivalence"]=="PASS"
          PY
          done
          export RESULT_PATH="$scratch/original-031.json"
          python3 -m py_compile experiments/TS-BEADS-031-B-FIRST-HISTORY-20261029-001/audit031.py
          python3 experiments/TS-BEADS-031-B-FIRST-HISTORY-20261029-001/audit031.py
          python3 experiments/TS-BEADS-031-B-FIRST-HISTORY-20261029-001/materialize031.py
          out=transport/TS-BEADS-031-B-FIRST-HISTORY-20261029-001/EVIDENCE_CARRIER.txt
          test -f "$out"
          git add -- "$out"
          test "$(git diff --cached --name-only)" = "$out"
          git -c user.name=ts-beads-experimental -c user.email=ts-beads-experimental@users.noreply.github.com commit -m "research(beads 031): history UNKNOWN and causal writer bounded source audit TXT"
          git push origin "HEAD:refs/heads/$branch"
          echo "TS_BEADS031_PUBLISHED_COMMIT=$(git rev-parse HEAD)"
          echo "TS_BEADS031_TXT_BLOB=$(git rev-parse HEAD:$out)"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          echo "TS_BEADS031_NO_PRODUCT_EFFECT=PASS;provider_new_effect=NONE;shared_dolt=$shared"
