name: TS remote state DBOS and PostgreSQL contract mechanics V4
on:
  push:
    branches: [experiment/ts-remote-state-contract-mechanics-v4-20261104-001]
    paths:
      - .github/workflows/ts-remote-state-contract-mechanics-v4-20261104.yml
      - experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/contract_mechanics_v4.py
      - experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/CONTRACT_MECHANICS_V4.md
permissions: {contents: read}
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:synthetic_ci_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.15.2'}
      - name: Verify Python 3.15.2
        run: python -c "import sys; assert sys.version_info[:3] == (3,15,2), sys.version"
      - name: Install pinned DBOS
        run: python -m pip install --disable-pip-version-check dbos==3.4.0 'psycopg[binary]'
      - name: DBOS process 1 durable workflow
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/dbos_smoke.py first
      - name: DBOS process 2 same workflow ID
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/dbos_smoke.py second
      - name: Boot four synthetic aggregates and audit
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/contract_mechanics_v4.py boot
      - name: Concurrent cross-aggregate CAS
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/contract_mechanics_v4.py race
      - name: UNKNOWN fence and transaction rollback
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/contract_mechanics_v4.py unknown
      - name: Replay events into clean table
        run: python experiments/TS-REMOTE-STATE-DBOS-RESTATE-20261104-001/contract_mechanics_v4.py restore
