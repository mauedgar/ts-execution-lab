name: TS Beads 016 native batch close and local event journal
on:
  push:
    branches: [experiment/beads-journal-batch-parity-20261014-016]
    paths: [.github/workflows/ts-beads-016-journal-batch.yml]
permissions:
  contents: read
jobs:
  native-batch-journal:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated native journal and multi-issue close parity 016
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $product='1ecce07708a5760c99d7faf55f2344f2eabbc119'
          $tree='025ce7524d1b8bf1753cfc4af964ee554d3b0977'
          $shared='1f72d68797114170a97fee27641858f2e55a4571'
          $head=((& git ls-remote 'https://github.com/mauedgar/tecnotron-ai.git' refs/heads/tools|Out-String).Trim() -split ([char]9))[0]
          if($LASTEXITCODE -ne 0 -or $head -cne $product){throw ('PRODUCT_IDENTITY_CHANGED='+$head)}
          $commit=(& gh api ('repos/mauedgar/tecnotron-ai/git/commits/'+$product)|Out-String)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or [string]$commit.tree.sha -cne $tree){throw 'PRODUCT_TREE_CHANGED'}
          $sot=(& gh api 'repos/mauedgar/tecnotron-ai/contents/docs/SOURCE_OF_TRUTH.md?ref=tools'|Out-String)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $sot.sha -cne 'dd8d34a7e3ef3094805d014f9e59741d2c553957'){throw 'PRODUCT_SOT_BLOB_CHANGED'}
          $remote='https://github.com/mauedgar/ts-execution-lab.git'
          $observed=((& git ls-remote $remote refs/dolt/data|Out-String).Trim() -split ([char]9))[0]
          if($LASTEXITCODE -ne 0 -or $observed -cne $shared){throw ('SHARED_DOLT_DRIFT='+$observed)}
          $folder=Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) ('bj16'+$env:GITHUB_RUN_ID)
          if(Test-Path $folder){throw 'DISPOSABLE_PATH_EXISTS'}
          New-Item -ItemType Directory $folder|Out-Null
          $zip=Join-Path $folder 'beads.zip'
          Invoke-WebRequest -Uri 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' -OutFile $zip
          if(((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) -cne '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76'){throw 'BEADS_BINARY_PIN_FAIL'}
          $bin=Join-Path $folder 'bin'
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          $env:BD_BIN=Get-ChildItem -LiteralPath $bin -Recurse -Filter bd.exe -File|Select-Object -First 1 -ExpandProperty FullName
          if(-not $env:BD_BIN){throw 'BEADS_BINARY_MISSING'}
          $doltArchive=Join-Path $folder 'dolt.zip'
          Invoke-WebRequest -Uri 'https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-windows-amd64.zip' -OutFile $doltArchive
          if(((Get-FileHash $doltArchive -Algorithm SHA256).Hash.ToLowerInvariant()) -cne '7a4be662d5548bc63ae4ab6d8d93daa2a6681f3e076817908ac4a08d782eb6f6'){throw 'DOLT_BINARY_PIN_FAIL'}
          $doltUnpacked=Join-Path $folder 'dolt'
          Expand-Archive -LiteralPath $doltArchive -DestinationPath $doltUnpacked
          $doltExe=Get-ChildItem -LiteralPath $doltUnpacked -Recurse -File -Filter dolt.exe|Select-Object -First 1 -ExpandProperty FullName
          if(-not $doltExe){throw 'DOLT_BINARY_MISSING'}
          $sqlRoot=Join-Path $folder 'sql'
          New-Item -ItemType Directory $sqlRoot|Out-Null
          $env:BEADS_DOLT_SERVER_MODE='1'
          $env:BEADS_DOLT_SERVER_HOST='127.0.0.1'
          $env:BEADS_DOLT_SERVER_PORT=[string](34000+([long]$env:GITHUB_RUN_ID%19000))
          $server=Start-Process -FilePath $doltExe -WorkingDirectory $sqlRoot -ArgumentList @('sql-server','--port',$env:BEADS_DOLT_SERVER_PORT) -PassThru -RedirectStandardOutput (Join-Path $folder 'sql-stdout.log') -RedirectStandardError (Join-Path $folder 'sql-stderr.log') -WindowStyle Hidden
          Write-Output ('TS_BEADS016_DISPOSABLE_DOLT_SERVER_PID='+$server.Id)
          Start-Sleep -Seconds 3
          if($server.HasExited){throw ('DISPOSABLE_DOLT_SERVER_FAILED='+$server.ExitCode)}
          $lab=Join-Path $folder 'lab'
          New-Item -ItemType Directory $lab|Out-Null
          & git -C $lab init -q
          if($LASTEXITCODE -ne 0 -or ((& git -C $lab remote|Out-String).Trim()) -ne ''){throw 'LAB_HAS_REMOTE'}
          $env:LAB_ROOT=$lab
          $env:RESULT_PATH=Join-Path $env:RUNNER_TEMP 'beads016-journal-batch-result.json'
          $script=Join-Path $env:GITHUB_WORKSPACE 'experiments/TS-BEADS-JOURNAL-BATCH-PARITY-20261014-016/native016.mjs'
          & node --check $script
          if($LASTEXITCODE -ne 0){throw 'NODE_SYNTAX_FAIL'}
          & node $script
          if($LASTEXITCODE -ne 0){throw ('NATIVE_CAS_SCRIPT_EXIT='+$LASTEXITCODE)}
          $receipt=Get-Content -Raw $env:RESULT_PATH|ConvertFrom-Json
          if($receipt.disposition -cne 'PASS_NATIVE_BATCH_ATOMICITY_AND_LOCAL_JOURNAL_WITH_LIMITS' -or $receipt.Product_effect -cne 'NONE' -or $receipt.checks.Count -lt 18){throw 'NATIVE_016_RESULT_IDENTITY_FAIL'}
          $afterDolt=((& git ls-remote $remote refs/dolt/data|Out-String).Trim() -split ([char]9))[0]
          $afterProduct=((& git ls-remote 'https://github.com/mauedgar/tecnotron-ai.git' refs/heads/tools|Out-String).Trim() -split ([char]9))[0]
          if($LASTEXITCODE -ne 0 -or $afterDolt -cne $shared -or $afterProduct -cne $product){throw 'PRODUCT_OR_SHARED_DOLT_CHANGED'}
          Write-Output ('TS_BEADS016_NO_EXTERNAL_EFFECT=PASS;product='+$afterProduct+';dolt='+$afterDolt)
      - name: Upload exact experimental batch/journal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads-016-native-journal-batch-receipt
          path: ${{ runner.temp }}/beads016-journal-batch-result.json
          if-no-files-found: warn
          retention-days: 7
