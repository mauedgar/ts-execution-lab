name: TS R3 A02 native PG16 disposable qualifier 001

on:
  push:
    branches:
      - ee/ts-r3-a02-native-pg16-qual-20261111-001
    paths:
      - .github/workflows/ts-r3-a02-native-pg16-qual-20261111-001.yml

permissions:
  contents: read

concurrency:
  group: ts-r3-a02-native-pg16-qual-20261111-001
  cancel-in-progress: false

jobs:
  native-pg16-qualification:
    name: Native PostgreSQL16 synthetic catalog, role, ACL and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
      TS_CI_NATIVE_SYNTHETIC_ONLY: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-ephemeral-postgres-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout immutable nonProduct experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze source, exact three-file write set, and original attempt
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ee/ts-r3-a02-native-pg16-qual-20261111-001
          git merge-base --is-ancestor 67941b33ee077ba8fc0dbcda0196232dbd7895eb HEAD
          test "$(git rev-parse "HEAD:$root/schema.sql")" = 3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0
          test "$(git rev-parse "HEAD:$root/a02_lan/role_boundary.py")" = 26110b845ae98f3590f6d7580b779ff968b40390
          test "$(git rev-parse "HEAD:$root/a02_lan/native_pg16_ci_qual.py")" = a11a5cdda6b5e9ff453b6b1ae72169d2f905d8db
          test "$(git rev-parse "HEAD:$root/a02_lan/NATIVE_PG16_CI_QUAL_INTENT.md")" = d934a46a71ebb1d4d628097a8c550b7503ef6a93
          test "$(git diff --name-only 67941b33ee077ba8fc0dbcda0196232dbd7895eb HEAD | wc -l)" -eq 3
          while IFS= read -r item; do
            case "$item" in
              ".github/workflows/ts-r3-a02-native-pg16-qual-20261111-001.yml"|\
              "$root/a02_lan/native_pg16_ci_qual.py"|\
              "$root/a02_lan/NATIVE_PG16_CI_QUAL_INTENT.md") ;;
              *) echo UNAUTHORIZED_WORKSET >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 67941b33ee077ba8fc0dbcda0196232dbd7895eb HEAD)
          printf 'NATIVE_PG16_ORIGINAL_PRECONDITION_PASS attempt=TS-R3-A02-NATIVE-PG16-CI-QUAL-20261111-001-A001 sha=%s\n' "$GITHUB_SHA"

      - name: Pin uv tool 0.13.7
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: Execute original native PostgreSQL16 positive and negative checks
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 --with 'psycopg[binary]==3.3.8' \
            python -B "$root/a02_lan/native_pg16_ci_qual.py" |
            tee "$RUNNER_TEMP/ts-r3-native-pg16-original.json"
          python3 - "$RUNNER_TEMP/ts-r3-native-pg16-original.json" <<'PY'
          import json,sys
          rows=open(sys.argv[1], encoding='utf-8').read().splitlines()
          assert len(rows)==1
          data=json.loads(rows[0])
          assert data["status"]=="NATIVE_PG16_CI_SOURCE_GUARD_AND_ATTESTATION_PASS"
          assert data["execution_attempt"]=="TS-R3-A02-NATIVE-PG16-CI-QUAL-20261111-001-A001"
          assert data["negative_guard_scenarios"]==5
          assert data["pg_major"]==16
          assert data["table_count"]==3 and data["column_count"]==19
          assert data["constraint_count"]==18 and data["index_count"]==5
          assert data["expected_source_constraint_gap_confirmed"] is True
          assert data["native_extra_constraint_attestation_rejects"] is True
          assert data["physical_a02"]=="NO_GO" and data["product_effect"]=="NONE"
          print("NATIVE_PG16_ORIGINAL_ONE_ATTEMPT_5_NEGATIVES_PASS")
          PY

      - name: Preserve CI native qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$TS_CI_NATIVE_SYNTHETIC_ONLY" = 1
          echo "NATIVE_PG16_CI_EPHEMERAL_DATABASE_ONLY_NO_NEON_NO_PRODUCT_EFFECT"
          echo "NATIVE_PG16_NO_TWO_HOSTS_NO_TCP_LOST_ACK_NO_PRODUCT_KERNEL_MIGRATION"
