name: TS EE 004 fresh native generic browser conformance (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-pr82-fresh-native-conformance-20261126
permissions:
  contents: read
concurrency:
  group: ts-ee004-pr82-fresh-native-conformance-20261126
  cancel-in-progress: false
jobs:
  fresh-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
      - name: Exact candidate and frozen caller contract before measurement
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mauedgar/ts-execution-lab"
          test "$GITHUB_REF" = "refs/heads/experiment/ts-ee004-pr82-fresh-native-conformance-20261126"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_q5b_producer.py')" = 'e7046188033cb65a25e2c86e2f3086bc53ccc2c7'
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_browser_consumer.py')" = 'b528a501aa771bf87900c2f6ec9226e9f417bc7a'
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py')" = '1f9d2303409e40b5f9e3b961d94dfb0cbaea1f09'
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py')" = '36c207326fff0da2231b731422323af186511a49'
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/q5b_to_common_v01.py')" = 'f13d76cdf3b1434d52d7be9894f721fa05619006'
          test "$(git hash-object 'experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/q5b_toolchain_capture.py')" = '14ef1c25793ab602d9a1154f6d7d332150c290eb'
          test "$(git hash-object 'experiments/TS-EE-CHROMEDRIVER-20261121-001/browser_synthetic_q5b.mjs')" = '71c2388d8469b66becbf44b333cbc992a4a33c83'
          test "$(git hash-object 'experiments/TS-EE-CHROMEDRIVER-20261121-001/q5b_receipt_gate.mjs')" = 'f43bc04725a69ab1ebd66efd3621d7e97e900d98'
          test ! -e q5b-evidence && test ! -L q5b-evidence
          umask 077
          mkdir -m 700 q5b-evidence
          python --version
          node --version
          google-chrome --version
          chromedriver --version
          python - <<'PY'
          import os, json, hashlib, subprocess
          from pathlib import Path
          matrix = {"viewport":["width","overflow","screenshot"],"routing":["deep_link"],"history":["history_back"],"deep_link_refresh":["deep_link_refresh"],"sku_negative":["sku_negative"],"keyboard_focus":["keyboard_tab","keyboard_enter"],"a11y_basic":["semantic_heading","button_label","keyboard_tab","keyboard_enter"],"console_http":["http_404","http_500","seeded_js_error"]}
          contract = {"schema":"ts-ee/generic-browser-consumer-contract/v1",
                      "profile":"GENERIC_BROWSER_V01",
                      "source":{"repository":"mauedgar/ts-execution-lab","commit":os.environ["GITHUB_SHA"],
                                "tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),"subject_kind":"SYNTHETIC"},
                      "attempt":"TS-EE-004-PR82-FRESH-NATIVE-CONFORMANCE-20261126-001-A001","run_id":os.environ["GITHUB_RUN_ID"],
                      "run_attempt":1,"engine":"CHROMEDRIVER_NODE","log_name":"generic-evidence.json",
                      "checks":{key:{str(w):checks for w in (320,375,768,1440)} for key,checks in matrix.items()}}
          raw=(json.dumps(contract,sort_keys=True,indent=2)+"\n").encode("utf-8")
          with open("q5b-evidence/CALLER_CONTRACT.json","xb") as f: f.write(raw)
          with open("q5b-evidence/CALLER_CONTRACT.sha256","x",encoding="ascii") as f: f.write(hashlib.sha256(raw).hexdigest()+"\n")
          print("CALLER_CONTRACT_SHA256="+hashlib.sha256(raw).hexdigest())
          PY
      - name: Capture actual host toolchain and four new synthetic ChromeDriver sessions
        shell: bash
        run: |
          set -euo pipefail
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/q5b_toolchain_capture.py q5b-evidence/TOOLCHAIN.json
          for w in 320 375 768 1440; do
            test ! -e "q5b-evidence/$w" && test ! -L "q5b-evidence/$w"
            TS_EE_Q5B_WIDTH="$w" TS_EE_Q5B_OUTPUT_DIR="q5b-evidence/$w" node experiments/TS-EE-CHROMEDRIVER-20261121-001/browser_synthetic_q5b.mjs
            TS_EE_Q5B_OUTPUT_DIR="q5b-evidence/$w" node experiments/TS-EE-CHROMEDRIVER-20261121-001/q5b_receipt_gate.mjs
          done
      - name: Convert actual same-run bytes and consume generic projection
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          TREE="$(git rev-parse 'HEAD^{tree}')"
          PIN="$(cat q5b-evidence/CALLER_CONTRACT.sha256)"
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/q5b_to_common_v01.py --evidence-root q5b-evidence --output-root q5b-evidence/common --repository mauedgar/ts-execution-lab --commit "$GITHUB_SHA" --tree "$TREE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --attempt TS-EE-004-PR82-FRESH-NATIVE-CONFORMANCE-20261126-001-A001
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_q5b_producer.py --raw-root q5b-evidence --common-root q5b-evidence/common --output-root q5b-evidence/generic --contract q5b-evidence/CALLER_CONTRACT.json --contract-sha256 "$PIN"
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_browser_consumer.py --root q5b-evidence/generic --receipt-name COMMON_RECEIPT_V01.json --contract q5b-evidence/CALLER_CONTRACT.json --contract-sha256 "$PIN" > q5b-evidence/GENERIC_VALIDATION.json
          python - <<'PY'
          import json
          r=json.load(open("q5b-evidence/GENERIC_VALIDATION.json",encoding="utf8"))
          assert r["status"]=="VALID_GENERIC_MAPPING_UNATTESTED",r
          assert r["functional_browser_status"]=="PASS",r
          assert r["terminal_result"]=="PASS_FUNCTIONAL_ONLY",r
          assert r["network_assurance_status"]=="OBSERVE_ONLY_UNATTESTED",r
          assert r["observed_scenario_count"]==8 and r["artifact_bytes_verified_locally"] is True,r
          assert r["provider_native_verified"] is False and r["Product_accepted"] is False,r
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Preserve original raw browser and derived evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-pr82-fresh-native-conformance
          path: q5b-evidence/
          retention-days: 5
          if-no-files-found: error
