name: TS EE 003 ChromeDriver B003 cross-field receipt and negative matrix
on:
  push:
    branches:
      - experiment/ts-ee003-chromedriver-b003-20261121
permissions:
  contents: read
concurrency:
  group: ts-ee003-chromedriver-b003
  cancel-in-progress: false
jobs:
  lifecycle:
    name: b003-session-${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
      - name: Native source, toolchain and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse 'HEAD^{tree}'
          echo "ImageVersion=${ImageVersion:-UNAVAILABLE}"
          node --version
          command -v google-chrome
          command -v chromedriver
          google-chrome --version
          chromedriver --version
          sha256sum "$(readlink -f "$(command -v google-chrome)")" "$(readlink -f "$(command -v chromedriver)")"
          node --check experiments/TS-EE-CHROMEDRIVER-20261121-001/real_session_probe.mjs
          node --check experiments/TS-EE-CHROMEDRIVER-20261121-001/fault_matrix.mjs
          node --check experiments/TS-EE-CHROMEDRIVER-20261121-001/positive_receipt_gate.mjs
      - name: Existing original W3C protocol fixtures as source tests
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/protocol_stubs.mjs
      - name: Four fail-closed runtime fixtures and sanitized receipts
        env:
          TS_EE_FAULT_OUTPUT: fault-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/fault_matrix.mjs
      - name: One actual ChromeDriver session, exact output and cleanup
        env:
          TS_EE_OUTPUT_DIR: chromedriver-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/real_session_probe.mjs
      - name: Validate actual positive receipt and reject seven contradictory fixtures
        env:
          TS_EE_OUTPUT_DIR: chromedriver-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/positive_receipt_gate.mjs
      - name: Upload bounded actual and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee003-b003-${{ matrix.trial }}
          path: |
            chromedriver-evidence/SESSION_REPORT.json
            fault-evidence/*/SESSION_REPORT.json
          retention-days: 5
          if-no-files-found: error
