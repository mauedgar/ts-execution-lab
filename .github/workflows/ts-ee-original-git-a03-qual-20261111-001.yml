name: TS EE original Git guard A03 source-only hardening qualification

on:
  push:
    branches:
      - ee/ts-ee-actions-git-guard-a03-20261111-001
    paths:
      - .github/ts-ee-original-dispatch/TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A001.json

permissions:
  contents: read

concurrency:
  group: ts-ee-a03-original-git-guard-qual-20261111-001
  cancel-in-progress: false

jobs:
  one-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
    steps:
      - name: Checkout original marker and frozen parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Hardened original Git identity guard BEFORE any dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts_ee_original_actions_binding.py \
            --root . \
            --marker .github/ts-ee-original-dispatch/TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A001.json \
            --attempt TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A001 \
            | tee "$RUNNER_TEMP/ts-ee-a03-original-guard.json"
          python3 - "$RUNNER_TEMP/ts-ee-a03-original-guard.json" <<'PY'
          import json,sys
          lines=open(sys.argv[1], encoding="utf-8").read().splitlines()
          assert len(lines)==1
          result=json.loads(lines[0])
          assert result["status"]=="TS_EE_ORIGINAL_GIT_TRANSITION_PASS"
          assert result["execution_attempt"]=="TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A001"
          assert result["run_attempt"]==1 and result["product_effect"]=="NONE"
          print("TS_EE_A03_HARDENED_ORIGINAL_GIT_IDENTITY_PASS")
          PY

      - name: Pin uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: CPython 3.15.2 original and A03 hardening source selftest
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 \
            python -B tools/selftest_ts_ee_original_actions_binding.py
          echo "TS_EE_A03_NONPRODUCT_NO_SQL_NO_HOST_NO_NEON_NO_PRODUCT"

      - name: Read-only effect boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "TS_EE_A03_SOURCE_QUALIFICATION_ONLY_NO_PRODUCTION_EFFECT"
