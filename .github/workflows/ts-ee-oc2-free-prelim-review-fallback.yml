name: TS EE OpenCode2 free reviewer - notebook-first Actions fallback (staged only)

# SOURCE-ONLY PREPARATION; this workflow NEVER starts a model or reviewer.
# Notebook remains primary. Native identity, process fencing, free model
# and permission enforcement are NOT qualified for Actions yet.
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Frozen experimental operation, not Product
        type: string
        required: true
      request_sha256:
        description: SHA-256 of frozen original request
        type: string
        required: true
      attempt_id:
        description: Distinct proposed Actions attempt ID, never notebook ID
        type: string
        required: true
      subject_base:
        description: Pinned synthetic TS EE lab base commit
        type: string
        required: true
      subject_head:
        description: Pinned synthetic TS EE lab candidate HEAD
        type: string
        required: true
      subject_tree:
        description: Pinned synthetic TS EE lab candidate tree
        type: string
        required: true
      notebook_receipt_commit:
        description: Immutable original notebook capacity receipt commit
        type: string
        required: true
      notebook_receipt_path:
        description: Original notebook receipt path in lab repository
        type: string
        required: true
      notebook_receipt_sha256:
        description: Exact SHA-256 of notebook capacity receipt
        type: string
        required: true

permissions:
  contents: read

# Only serializes Actions runs for a logical operation, never the notebook.
concurrency:
  group: ts-ee-oc2-prelim-staging-${{ inputs.operation_id }}
  cancel-in-progress: false

jobs:
  preflight-only:
    name: Not admitted - native notebook attestation required
    # The candidate is intentionally absent from main and not runnable here.
    # Promotion to main requires source IR 0F/0A and further Developer ruling.
    if: github.repository == 'mauedgar/ts-execution-lab' && github.ref == 'refs/heads/main' && github.actor == 'mauedgar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exactly the commit containing this workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: control
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed immutable preflight script
        shell: bash
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected='c82d6ca8ad7c1f9f70c82f4b23890debda909abc'
          actual="$(git -C "$GITHUB_WORKSPACE/control" hash-object -- tools/ts_ee_oc2_free_review_fallback_preflight.py)"
          test "$actual" = "$expected"
          test "$(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"

      - name: Checkout exact synthetic lab subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: subject
          ref: ${{ inputs.subject_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admission-only parser - must fail closed, without inference
        shell: bash
        env:
          CONTROL_ROOT: ${{ github.workspace }}/control
          SUBJECT_ROOT: ${{ github.workspace }}/subject
          BASE_SHA: ${{ inputs.subject_base }}
          HEAD_SHA: ${{ inputs.subject_head }}
          TREE_SHA: ${{ inputs.subject_tree }}
          RECEIPT_COMMIT: ${{ inputs.notebook_receipt_commit }}
          RECEIPT_PATH: ${{ inputs.notebook_receipt_path }}
          RECEIPT_SHA256: ${{ inputs.notebook_receipt_sha256 }}
          OPERATION_ID: ${{ inputs.operation_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REMOTE_ATTEMPT_ID: ${{ inputs.attempt_id }}
        run: |
          set -euo pipefail
          # BLOCKED even if all parsed preconditions pass: no native process
          # attestation, cross-host fencing, provider price or policy qualification.
          python3 "$CONTROL_ROOT/tools/ts_ee_oc2_free_review_fallback_preflight.py" \
            --control-root "$CONTROL_ROOT" \
            --subject-root "$SUBJECT_ROOT" \
            --subject-base "$BASE_SHA" --subject-head "$HEAD_SHA" \
            --subject-tree "$TREE_SHA" \
            --notebook-receipt-commit "$RECEIPT_COMMIT" \
            --notebook-receipt-path "$RECEIPT_PATH" \
            --notebook-receipt-sha256 "$RECEIPT_SHA256" \
            --operation-id "$OPERATION_ID" --request-sha256 "$REQUEST_SHA256" \
            --attempt-id "$REMOTE_ATTEMPT_ID"
          echo 'BLOCKED_UNEXPECTED_VALIDATOR_EXIT_0' >&2
          exit 89

# No model, secrets, npm install, untrusted diff forwarding, Actions artifact,
# pull_request, pull_request_target, push, cron, commit, comment, or Product write.
