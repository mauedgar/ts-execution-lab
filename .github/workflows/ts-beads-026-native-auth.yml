name: TS Beads 026 Native Auth Same-UID and Recovery Qualification
on:
  push:
    branches:
      - experiment/beads-026-native-auth-boundary-20261026-001
    paths:
      - .github/workflows/ts-beads-026-native-auth.yml
permissions:
  contents: write
  actions: read
jobs:
  native-effective-writer-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Native bearer route matrix, same-UID bypass and server recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          subject=7a7225940aeaf1fbd16ac46ecd1cb76fa527ff56
          tree=8caa56d36f3efeba359bbbf65b158ffb01a19da6
          shared=1f72d68797114170a97fee27641858f2e55a4571
          test "$(git branch --show-current)" = "experiment/beads-026-native-auth-boundary-20261026-001"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$subject"
          test "$(gh api repos/mauedgar/tecnotron-ai/git/commits/$subject --jq .tree.sha)" = "$tree"
          test "$(gh api 'repos/mauedgar/tecnotron-ai/contents/docs/SOURCE_OF_TRUTH.md?ref=tools' --jq .sha)" = "dd8d34a7e3ef3094805d014f9e59741d2c553957"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          scratch="$RUNNER_TEMP/ts-beads-026-$GITHUB_RUN_ID"
          test ! -e "$scratch"
          mkdir -m 755 "$scratch"
          curl --fail --location --silent --show-error --output "$scratch/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $scratch/beads.tar.gz" | sha256sum -c -
          curl --fail --location --silent --show-error --output "$scratch/dolt.tar.gz" https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-linux-amd64.tar.gz
          echo "1f7ad8c2622995789420a3fb0f2d16b4aa7430000a825dd91d5938f36480cbf6  $scratch/dolt.tar.gz" | sha256sum -c -
          mkdir -p "$scratch/beads" "$scratch/dolt" "$scratch/python"
          tar -xzf "$scratch/beads.tar.gz" -C "$scratch/beads"
          tar -xzf "$scratch/dolt.tar.gz" -C "$scratch/dolt"
          export BD_BIN="$(find "$scratch/beads" -type f -name bd -print -quit)"
          export DOLT_BIN="$(find "$scratch/dolt" -type f -name dolt -print -quit)"
          test -n "$BD_BIN" && test -n "$DOLT_BIN"
          chmod +x "$BD_BIN" "$DOLT_BIN"
          python3 -m pip install -q --disable-pip-version-check --target "$scratch/python" 'PyMySQL==1.1.1'
          chmod -R a+rX "$scratch/python"
          export PYTHONPATH="$scratch/python"
          export LAB_ROOT="$scratch/disposable-private-store"
          export RESULT_PATH="$scratch/original-026-result.json"
          export PRODUCT_ROOT="$scratch/product-qualified-tool"
          git clone -q --no-checkout https://github.com/mauedgar/tecnotron-ai.git "$PRODUCT_ROOT"
          git -C "$PRODUCT_ROOT" checkout -q --detach "$subject"
          test "$(git -C "$PRODUCT_ROOT" rev-parse HEAD)" = "$subject"
          test "$(git -C "$PRODUCT_ROOT" rev-parse 'HEAD^{tree}')" = "$tree"
          python3 -m py_compile experiments/TS-BEADS-026-NATIVE-AUTH-20261026-001/native026.py
          python3 experiments/TS-BEADS-026-NATIVE-AUTH-20261026-001/native026.py
          python3 -c 'import json,os; r=json.load(open(os.environ["RESULT_PATH"])); assert r["Product_effect"]=="NONE" and len(r["checks"])>=22 and r["status"] == "PASS_AUTH_BOUNDARY_WITH_SAME_UID_AND_TOKEN_LOSS_GAPS",r'
          python3 experiments/TS-BEADS-026-NATIVE-AUTH-20261026-001/materialize026.py
          out=transport/TS-BEADS-026-NATIVE-AUTH-20261026-001/EVIDENCE_CARRIER.txt
          test -f "$out"
          git add -- "$out"
          test "$(git diff --cached --name-only)" = "$out"
          git -c user.name=ts-beads-experimental -c user.email=ts-beads-experimental@users.noreply.github.com commit -m "research(beads 026): publish native bearer recovery original TXT envelope"
          git push origin HEAD:refs/heads/experiment/beads-026-native-auth-boundary-20261026-001
          echo "TS_BEADS026_TXT_PUBLISHED_COMMIT=$(git rev-parse HEAD)"
          echo "TS_BEADS026_TXT_BLOB=$(git rev-parse HEAD:$out)"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$subject"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          echo "TS_BEADS026_NO_PRODUCT_EFFECT=PASS;product=$subject;shared_dolt=$shared"
