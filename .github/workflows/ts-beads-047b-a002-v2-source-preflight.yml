name: TS-BEADS 047B A002 V2 source-only
on:
  push:
    branches:
      - experiment/ts-beads-047b-a002-atomic-cas-v2-control-20261102-001
    paths:
      - .github/workflows/ts-beads-047b-a002-v2-source-preflight.yml
permissions:
  contents: read
jobs:
  source_only:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Enforce LF
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: e26bbd4cd436be2e1eab6cad4933eca055971eba
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen subject and PowerShell syntax, no mutations
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne 'e26bbd4cd436be2e1eab6cad4933eca055971eba') { throw 'FROZEN_COMMIT_MISMATCH' }
          $file='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/A002-ATOMIC-CAS-V2-20261102-001/Invoke-A002-AtomicCas-V2.ps1'
          if ((git hash-object $file).Trim() -cne '789a22618303ae5cb618ece79210a5ad34d2ec25') { throw 'SOURCE_GIT_BLOB_MISMATCH' }
          $tok=$null; $err=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tok,[ref]$err)
          if (@($err).Count -gt 0) { throw ('POWERSHELL_PARSE_ERROR_'+(@($err) -join '|')) }
          $src=[IO.File]::ReadAllText((Resolve-Path $file))
          foreach($needle in @('beforeOid=$g0','afterOid=$After',"BETA_EXPLICIT_BEFOREOID_REJECTION","GRAPHQL_MUTATION_INTENT","GRAPHQL_PROVIDER_RESPONSE","GRAPHQL_HTTP_RESPONSE_METADATA","A002_NO_RERUN_ALLOWED")) {
            if (-not $src.Contains($needle)) { throw ('SOURCE_CONTRACT_MISSING_'+$needle) }
          }
          if ($src -match 'if\(\$e\.message\s*-match\s*''update') { throw 'GENERIC_PROVIDER_ERROR_ACCEPTED' }
          'TS047B_A002_V2=PASS_WINDOWS_PARSER_AND_SOURCE_ONLY_NO_MUTATION'
