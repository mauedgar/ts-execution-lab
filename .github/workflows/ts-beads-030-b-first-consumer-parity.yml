name: TS Beads 030 B First Same Product Recipe Parity Linux
on:
  push:
    branches: [experiment/beads-030-b-first-consumer-parity-20261029-001]
    paths: [.github/workflows/ts-beads-030-b-first-consumer-parity.yml]
permissions:
  contents: write
  actions: read
jobs:
  actual-kernel-versus-native-beads-same-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Attempt 2 actual Product Kernel and native Beads parity on identical Linux runner
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product=d4154bd43f26515c39a41be974e462a0c7406a2d
          tree=cbfb71ad8632047e8e64fe2665d8614d835a2c8b
          shared=1f72d68797114170a97fee27641858f2e55a4571
          branch=experiment/beads-030-b-first-consumer-parity-20261029-001
          test "$(git branch --show-current)" = "$branch"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          scratch="$RUNNER_TEMP/ts-beads-030-$GITHUB_RUN_ID"
          test ! -e "$scratch"
          mkdir -p "$scratch/bin" "$scratch/dolt" "$scratch/lab" "$scratch/dolt-server"
          curl --fail --location --silent --show-error --output "$scratch/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $scratch/beads.tar.gz" | sha256sum -c -
          curl --fail --location --silent --show-error --output "$scratch/dolt.tar.gz" https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-linux-amd64.tar.gz
          echo "1f7ad8c2622995789420a3fb0f2d16b4aa7430000a825dd91d5938f36480cbf6  $scratch/dolt.tar.gz" | sha256sum -c -
          tar -xzf "$scratch/beads.tar.gz" -C "$scratch/bin"
          tar -xzf "$scratch/dolt.tar.gz" -C "$scratch/dolt"
          export BD_BIN="$(find "$scratch/bin" -type f -name bd -print -quit)"
          export DOLT_BIN="$(find "$scratch/dolt" -type f -name dolt -print -quit)"
          test -n "$BD_BIN" && test -n "$DOLT_BIN"
          chmod +x "$BD_BIN" "$DOLT_BIN"
          export PATH="$(dirname "$DOLT_BIN"):$PATH"
          export BEADS_DOLT_SERVER_MODE=1
          export BEADS_DOLT_SERVER_HOST=127.0.0.1
          export BEADS_DOLT_SERVER_PORT="$((31000 + GITHUB_RUN_ID % 20000))"
          ( cd "$scratch/dolt-server" && "$DOLT_BIN" sql-server --host 127.0.0.1 --port "$BEADS_DOLT_SERVER_PORT" ) >"$scratch/dolt-server.log" 2>&1 &
          sql_pid=$!
          trap 'kill "$sql_pid" 2>/dev/null || true' EXIT
          # Bounded native startup health: explicitly fail if server exits.
          for i in $(seq 1 30); do
              if ! kill -0 "$sql_pid" 2>/dev/null; then
                  echo "DISPOSABLE_SQL_SERVER_EXIT"; tail -n 15 "$scratch/dolt-server.log"; exit 1
              fi
              if python3 - "$BEADS_DOLT_SERVER_PORT" <<'PY'
          import socket,sys
          try:
              s=socket.create_connection(("127.0.0.1",int(sys.argv[1])),.5)
              s.close()
          except OSError:sys.exit(1)
          PY
              then break; fi
              sleep .3
          done
          git -C "$scratch/lab" init -q
          test -z "$(git -C "$scratch/lab" remote)"
          export PRODUCT_ROOT="$scratch/product"
          git clone -q --no-checkout https://github.com/mauedgar/tecnotron-ai.git "$PRODUCT_ROOT"
          git -C "$PRODUCT_ROOT" checkout -q --detach "$product"
          test "$(git -C "$PRODUCT_ROOT" rev-parse HEAD)" = "$product"
          test "$(git -C "$PRODUCT_ROOT" rev-parse 'HEAD^{tree}')" = "$tree"
          test "$(git -C "$PRODUCT_ROOT" hash-object docs/SOURCE_OF_TRUTH.md)" = dd8d34a7e3ef3094805d014f9e59741d2c553957
          test "$(git -C "$PRODUCT_ROOT" hash-object docs/current-state.md)" = 0d8a6426f51020d51d74bfb50dc8702a07f02837
          test "$(git -C "$PRODUCT_ROOT" hash-object scripts/review_txt_carrier.py)" = 96971cf4a39a6bcb64e8b1982010b6d50a1f7ca4
          npm --prefix "$PRODUCT_ROOT" ci --ignore-scripts --no-audit --no-fund --silent
          export LAB_ROOT="$scratch/lab"
          export A_RESULT="$scratch/A-original.json"
          export B_RESULT="$scratch/B-original.json"
          export A_KERNEL_ROOT="$scratch/Kernel-A"
          export RESULT_PATH="$B_RESULT"
          node --check experiments/TS-BEADS-030-PARITY-20261029-001/consumer030-A.mjs
          node --check experiments/TS-BEADS-030-PARITY-20261029-001/consumer030-B.mjs
          node experiments/TS-BEADS-030-PARITY-20261029-001/consumer030-A.mjs
          node experiments/TS-BEADS-030-PARITY-20261029-001/consumer030-B.mjs
          export RESULT_PATH="$scratch/COMPARE-original.json"
          python3 experiments/TS-BEADS-030-PARITY-20261029-001/compare030.py
          python3 experiments/TS-BEADS-030-PARITY-20261029-001/materialize030.py
          carrier=transport/TS-BEADS-030-PARITY-20261029-001/EVIDENCE_CARRIER.txt
          test -f "$carrier"
          git add -- "$carrier"
          test "$(git diff --cached --name-only)" = "$carrier"
          git -c user.name=ts-beads-experimental -c user.email=ts-beads-experimental@users.noreply.github.com commit -m "research(beads 030): same Product Recipe actual Kernel A and B Beads native parity"
          git push origin "HEAD:refs/heads/$branch"
          echo "TS_BEADS030_PUBLISHED_COMMIT=$(git rev-parse HEAD)"
          echo "TS_BEADS030_TXT_BLOB=$(git rev-parse HEAD:$carrier)"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
          test "$(git ls-remote https://github.com/mauedgar/ts-execution-lab.git refs/dolt/data | cut -f1)" = "$shared"
          echo "TS_BEADS030_NO_PRODUCT_EFFECT=PASS;Product=$product;shared_Dolt=$shared"
