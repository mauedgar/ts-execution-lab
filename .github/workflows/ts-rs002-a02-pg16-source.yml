name: TS RS002 A02 PG16 source-only qualification
on:
  pull_request:
    paths:
      - 'experiments/TS-RS002-A02-PG16-PROVISION-20261113-001/**'
      - '.github/workflows/ts-rs002-a02-pg16-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Static integrity and negative controls (no Docker mutation)
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/TS-RS002-A02-PG16-PROVISION-20261113-001
          printf '%s  %s\n' '4299dfec98858b20e6d051a465ffcd3c6b33fa82eb45759002d5814b69a24598' provision_pg16.sh | sha256sum -c -
          printf '%s  %s\n' 'c1f8c85b911ef8b04585321448bc823c17c92f531cbdb7b62236082026b3b721' schema.sql | sha256sum -c -
          test "$(git hash-object schema.sql)" = '3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0'
          bash -n provision_pg16.sh
          bash -n negative_tests.sh
          test "$(git hash-object provision_pg16.sh)" = 'a8fb4f5597d3511239f5ffbd8bc91118aaea6ca0'
          test "$(git hash-object fault_injection_tests.sh)" = 'ed2da4a792578a175bf5916f591d55133a0f0a3f'
          bash -n fault_injection_tests.sh
          bash negative_tests.sh
          bash fault_injection_tests.sh
