name: TS RS002 A02 PG16 source-only qualification
on:
  pull_request:
    paths:
      - 'experiments/TS-RS002-A02-PG16-PROVISION-20261113-001/**'
      - '.github/workflows/ts-rs002-a02-pg16-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Static integrity and negative controls (no Docker mutation)
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/TS-RS002-A02-PG16-PROVISION-20261113-001
          printf '%s  %s\n' '093df43c9d83fb693304f41f5f2660f4997c13d8ab55e44e90c2008da9d800ee' provision_pg16.sh | sha256sum -c -
          printf '%s  %s\n' 'c1f8c85b911ef8b04585321448bc823c17c92f531cbdb7b62236082026b3b721' schema.sql | sha256sum -c -
          test "$(git hash-object schema.sql)" = '3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0'
          bash -n provision_pg16.sh
          bash -n negative_tests.sh
          test "$(git hash-object provision_pg16.sh)" = 'e73bfe94ee153d864b7efd0a7e06cafb9c94b7f1'
          test "$(git hash-object fault_injection_tests.sh)" = 'db13a63e16de09519399355e1e96fd2ec7c73a4a'
          printf '%s  %s\n' '890f66f58c836087d9c6099e4d9d150d0df1b28ab04ecd0547e8118fd3c37c47' image.lock | sha256sum -c -
          test "$(git hash-object image.lock)" = '82ab4fa25cf9a724903a183172bda166a780192d'
          test "$(grep -c '^EXPECTED_ADMISSION_SHA256=\x27UNBOUND_NO_DISPATCH\x27
          bash fault_injection_tests.sh
 provision_pg16.sh)" = 1
          bash -n fault_injection_tests.sh
          bash negative_tests.sh
          bash fault_injection_tests.sh
      - name: Inspect official pinned OCI registry manifest (read-only, no image pull)
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/TS-RS002-A02-PG16-PROVISION-20261113-001
          image="$(cat image.lock)"
          test "$image" = 'postgres@sha256:5983db9a9c6ad225a48a46cfe2e03e6680b1826662befd0465eb05b34cb1c64e'
          docker manifest inspect "$image" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schemaVersion"] == 2 and isinstance(x.get("config"),dict) and x["config"]["digest"].startswith("sha256:"); print("OFFICIAL_REGISTRY_MANIFEST_READABLE_SOURCE_ONLY")'
