name: TS Beads 023 independent source-native authority semantic guard qualification
on:
  push:
    branches: [experiment/beads-023-closure-authority-dependencies-provider-20261024]
    paths: [.github/workflows/ts-beads-023-authority-guard.yml]
permissions:
  contents: read
  actions: read
jobs:
  original-native-product-authority-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original Product State Kernel authority contrast and in-memory-only guard
        shell: bash
        run: |
          set -euo pipefail
          product=7a7225940aeaf1fbd16ac46ecd1cb76fa527ff56
          tree=8caa56d36f3efeba359bbbf65b158ffb01a19da6
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
          test "$(gh api repos/mauedgar/tecnotron-ai/git/commits/$product --jq .tree.sha)" = "$tree"
          lab="$RUNNER_TEMP/beads023-source-native-$GITHUB_RUN_ID"
          test ! -e "$lab"
          git clone -q --no-checkout https://github.com/mauedgar/tecnotron-ai.git "$lab"
          git -C "$lab" checkout -q --detach "$product"
          test "$(git -C "$lab" rev-parse HEAD)" = "$product"
          test "$(git -C "$lab" rev-parse 'HEAD^{tree}')" = "$tree"
          npm --prefix "$lab" ci --ignore-scripts --no-audit --no-fund
          export PRODUCT_ROOT="$lab"
          export RESULT_PATH="$RUNNER_TEMP/beads023-guard-native-result.json"
          node --check experiments/TS-BEADS-023-DEBT-QUALIFICATION-20261024/source-native-authority-guard.mjs
          node experiments/TS-BEADS-023-DEBT-QUALIFICATION-20261024/source-native-authority-guard.mjs
          node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync(process.env.RESULT_PATH,'utf8'));if(x.status!=='PASS_NATIVE_REACHABILITY_AND_IN_MEMORY_AUTHORITY_GUARD'||x.product_effect!=='NONE'||x.checks.length<11)process.exit(2)"
          test "$(git ls-remote https://github.com/mauedgar/tecnotron-ai.git refs/heads/tools | cut -f1)" = "$product"
      - name: Preserve source-native authority receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads-023-authority-guard-receipt
          path: ${{ runner.temp }}/beads023-guard-native-result.json
          if-no-files-found: warn
          retention-days: 7
