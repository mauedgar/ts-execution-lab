name: TS Beads Dolt 2.2.0 isolated server smoke
on:
  push:
    branches:
      - experiment/beads-multiwriter-binding-20261013-003
    paths:
      - .github/workflows/ts-beads-dolt-220-windows-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-smoke:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Pin binaries and smoke Dolt server with Beads (synthetic only)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $root=Join-Path $env:RUNNER_TEMP 'ts-beads-dolt220-nonproduct-001'
          if(Test-Path -LiteralPath $root){throw 'EXPERIMENT_DIR_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Path $root | Out-Null
          $server=$null
          function VerifiedArchive([string]$Url,[string]$Hex,[string]$Name){
            $archive=Join-Path $root ($Name+'.zip')
            Invoke-WebRequest -Uri $Url -OutFile $archive
            $got=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if($got -cne $Hex){throw ('ASSET_SHA256_MISMATCH_'+$Name)}
            $dest=Join-Path $root $Name
            Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
            Write-Host ('PINNED_ARCHIVE_OK_'+$Name+'='+$got)
            return $dest
          }
          try {
            $doltDir=VerifiedArchive 'https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-windows-amd64.zip' '7a4be662d5548bc63ae4ab6d8d93daa2a6681f3e076817908ac4a08d782eb6f6' 'dolt-2.2.0'
            $beadsDir=VerifiedArchive 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76' 'beads-1.3.1'
            $doltExe=Get-ChildItem -LiteralPath $doltDir -Recurse -File -Filter dolt.exe | Select-Object -First 1 -ExpandProperty FullName
            $bdExe=Get-ChildItem -LiteralPath $beadsDir -Recurse -File -Filter bd.exe | Select-Object -First 1 -ExpandProperty FullName
            if(-not $doltExe -or -not $bdExe){throw 'BINARIES_NOT_FOUND_IN_PINNED_ARCHIVES'}
            & $doltExe version
            if($LASTEXITCODE -ne 0){throw 'DOLT_VERSION_EXIT_NONZERO'}
            & $bdExe version
            if($LASTEXITCODE -ne 0){throw 'BEADS_VERSION_EXIT_NONZERO'}
            $serverRoot=Join-Path $root 'sql-server'
            New-Item -ItemType Directory $serverRoot | Out-Null
            $port='33473'
            $server=Start-Process -FilePath $doltExe -ArgumentList @('sql-server','--port',$port) -WorkingDirectory $serverRoot -PassThru -RedirectStandardOutput (Join-Path $root 'server-stdout.log') -RedirectStandardError (Join-Path $root 'server-stderr.log') -WindowStyle Hidden
            Start-Sleep -Seconds 3
            if($server.HasExited){throw ('DOLT_SERVER_TERMINATED_'+$server.ExitCode)}
            $env:BEADS_DOLT_SERVER_MODE='1'
            $env:BEADS_DOLT_SERVER_HOST='127.0.0.1'
            $env:BEADS_DOLT_SERVER_PORT=$port
            New-Item -ItemType Directory -Path (Join-Path $root 'client') | Out-Null
            $env:BEADS_DIR=Join-Path $root 'client\.beads'
            & $bdExe init --server --quiet --stealth
            if($LASTEXITCODE -ne 0){throw 'BEADS_SERVER_INIT_FAILED'}
            & $bdExe create 'Experimental server task A' --type task --json
            if($LASTEXITCODE -ne 0){throw 'BEADS_SERVER_CREATE_A_FAILED'}
            & $bdExe create 'Experimental server task B' --type task --json
            if($LASTEXITCODE -ne 0){throw 'BEADS_SERVER_CREATE_B_FAILED'}
            $raw=& $bdExe list --all --json
            if($LASTEXITCODE -ne 0){throw 'BEADS_SERVER_READ_FAILED'}
            $issues=@($raw|ConvertFrom-Json)
            if($issues.Count -ne 2){throw ('UNEXPECTED_ISSUE_COUNT_'+$issues.Count)}
            Write-Output 'TS_DOLT_SERVER_SMOKE=PASS_NONPRODUCT_SYNTHETIC_SINGLE_WRITER_CLIENT'
            function RunConcurrentCreate([string]$Scenario,[string]$SharedRef,[string]$ExplicitId='',[string]$PassExternal='no',[string]$AllowFailed='no') {
              $barrier=Join-Path $root ('barrier-'+$Scenario)
              New-Item -ItemType Directory $barrier | Out-Null
              $jobHandles=@()
              foreach($slot in @('A','B')) {
                $jobHandles+=Start-Job -ArgumentList @($bdExe,$env:BEADS_DIR,$port,$barrier,$Scenario,$slot,$SharedRef,$ExplicitId,$PassExternal) -ScriptBlock {
                  param([string]$Exe,[string]$BeadsStore,[string]$ServerPort,[string]$Gate,[string]$Case,[string]$Worker,[string]$Ref,[string]$Id,[string]$External)
                  $env:BEADS_DIR=$BeadsStore
                  $env:BEADS_DOLT_SERVER_MODE='1'
                  $env:BEADS_DOLT_SERVER_HOST='127.0.0.1'
                  $env:BEADS_DOLT_SERVER_PORT=$ServerPort
                  [System.IO.File]::WriteAllText((Join-Path $Gate ('ready-'+$Worker)),[string]$PID)
                  $watch=[System.Diagnostics.Stopwatch]::StartNew()
                  while(-not(Test-Path (Join-Path $Gate 'release'))) {
                    if($watch.Elapsed.TotalSeconds -gt 15){throw 'BARRIER_TIMEOUT'}
                    Start-Sleep -Milliseconds 100
                  }
                  $start=[DateTime]::UtcNow.ToString('o')
                  $argv=@('create',('Scenario '+$Case+' '+$Worker),'--description',('SOURCE_REF='+$Ref),'--type','task','--json')
                  if($Id){$argv+=@('--id',$Id)}
                  if($External -eq 'yes'){$argv+=@('--external-ref',$Ref)}
                  $output=(& $Exe @argv 2>&1 | Out-String).Trim()
                  $exit=$LASTEXITCODE
                  $end=[DateTime]::UtcNow.ToString('o')
                  [pscustomobject]@{scenario=$Case;slot=$Worker;pid=$PID;exit=$exit;start_utc=$start;end_utc=$end;output=$output}
                }
              }
              $clock=[System.Diagnostics.Stopwatch]::StartNew()
              while(-not ((Test-Path (Join-Path $barrier 'ready-A')) -and (Test-Path (Join-Path $barrier 'ready-B')))){
                if($clock.Elapsed.TotalSeconds -gt 18){throw ('START_BARRIER_TIMEOUT_'+$Scenario)}
                Start-Sleep -Milliseconds 100
              }
              [System.IO.File]::WriteAllText((Join-Path $barrier 'release'),'GO')
              $jobHandles|Wait-Job -Timeout 40|Out-Null
              if(@($jobHandles|Where-Object {$_.State -ne 'Completed'}).Count -gt 0){throw ('WRITERS_NOT_TERMINAL_'+$Scenario)}
              $out=@($jobHandles|Receive-Job)
              if($out.Count -ne 2){throw ('MISSING_WRITER_RECEIPT_'+$Scenario)}
              $overlap=([DateTime]$out[0].start_utc -le [DateTime]$out[1].end_utc -and [DateTime]$out[1].start_utc -le [DateTime]$out[0].end_utc)
              foreach($entry in $out){Write-Host ('TS_RACE_WORKER='+($entry|ConvertTo-Json -Compress -Depth 3))}
              if(-not $overlap){throw ('OPERATION_INTERVALS_DID_NOT_OVERLAP_'+$Scenario)}
              if($AllowFailed -ne 'yes' -and @($out|Where-Object {$_.exit -ne 0}).Count -ne 0){throw ('CONCURRENT_WRITER_EXIT_FAILURE_'+$Scenario)}
              Write-Host ('TS_RACE_OVERLAP_'+$Scenario+'=PASS')
              return $out
            }
            $disjointResults=@(RunConcurrentCreate 'DISJOINT' 'test://BEADS-SERVER-RACE/DISJOINT-A-B')
            $allAfter=@((& $bdExe list --all --json)|ConvertFrom-Json)
            if($LASTEXITCODE -ne 0 -or $allAfter.Count -ne 4){throw ('DISJOINT_RESULT_CARDINALITY_'+$allAfter.Count)}
            Write-Output 'TS_DOLT_SERVER_CONCURRENT_DISJOINT=PASS_NONPRODUCT_SYNTHETIC'
            $sameOrigin='test://BEADS-SERVER-RACE/SAME-ORIGIN-001'
            $sameOriginWriters=@(RunConcurrentCreate 'SAME_SOURCE' $sameOrigin)
            $sourceRows=@((& $bdExe list --all --desc-contains ('SOURCE_REF='+$sameOrigin) --json)|ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'SOURCE_REF_QUERY_FAILED'}
            $issueIds=@($sourceRows|ForEach-Object {[string]$_.id})
            if(@($issueIds|Select-Object -Unique).Count -ne $issueIds.Count){throw 'SAME_ID_MULTIPLE_RECORDS'}
            Write-Output ('TS_SAME_ORIGIN_RECORDS='+$sourceRows.Count)
            Write-Output ('TS_SAME_ORIGIN_IDS='+($issueIds -join ','))
            if($sourceRows.Count -eq 2){Write-Output 'TS_SEMANTIC_SOURCE_DEDUP=NOT_NATIVE_TWO_RECORDS'}
            elseif($sourceRows.Count -eq 1){Write-Output 'TS_SEMANTIC_SOURCE_DEDUP=SINGLE_ROW_OBSERVED_NOT_GENERAL_GUARANTEE'}
            else{throw ('UNEXPECTED_ORIGIN_CARDINALITY_'+$sourceRows.Count)}
            Write-Output 'TS_MULTIWRITER_DISJOINT_AND_ORIGIN_RACE=PASS_OBSERVED_SYNTHETIC'
            $externalMarker='test://BEADS-SERVER-RACE/EXTERNAL-REF-001'
            $externalResults=@(RunConcurrentCreate 'EXTERNAL_REF' $externalMarker '' 'yes' 'yes')
            $externalRows=@((& $bdExe list --all --desc-contains ('SOURCE_REF='+$externalMarker) --json)|ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'EXTERNAL_REF_QUERY_FAILED'}
            $externalSuccess=@($externalResults|Where-Object {$_.exit -eq 0}).Count
            Write-Output ('TS_EXTERNAL_REF_NATIVE_RESULTS='+$externalSuccess+'_SUCCESSES_'+$externalRows.Count+'_ROWS')
            if($externalSuccess -gt 0 -and $externalRows.Count -ge 1 -and $externalRows.Count -le 2){
              $nativeClass=if($externalRows.Count -eq 1){'SINGLE_ROW_OBSERVED'}else{'DUPLICATES_OBSERVED'}
              Write-Output ('TS_EXTERNAL_REF_NATIVE_CLASS='+$nativeClass)
            }else{
              Write-Output 'TS_EXTERNAL_REF_NATIVE_CLASS=UNQUALIFIED_OR_REJECTED'
            }
            $explicitMarker='test://BEADS-SERVER-RACE/EXPLICIT-ID-001'
            $explicitIssueId='ts-execution-lab-de7a6f3c'
            $idResults=@(RunConcurrentCreate 'EXPLICIT_ID' $explicitMarker $explicitIssueId 'no' 'yes')
            $explicitRows=@((& $bdExe list --all --desc-contains ('SOURCE_REF='+$explicitMarker) --json)|ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'EXPLICIT_ID_QUERY_FAILED'}
            $ids=@($explicitRows|ForEach-Object {[string]$_.id})
            $explicitSuccess=@($idResults|Where-Object {$_.exit -eq 0}).Count
            Write-Output ('TS_EXPLICIT_ID_NATIVE_RESULTS='+$explicitSuccess+'_SUCCESSES_'+$explicitRows.Count+'_ROWS')
            Write-Output ('TS_EXPLICIT_ID_NATIVE_IDS='+($ids -join ','))
            if($explicitSuccess -gt 0 -and $explicitRows.Count -eq 1 -and $ids[0] -ceq $explicitIssueId){
              Write-Output 'TS_EXPLICIT_ID_SOURCE_MAPPING=ONE_RECORD_OBSERVED_WITH_CONCURRENT_CLIENTS'
            }else{
              Write-Output 'TS_EXPLICIT_ID_SOURCE_MAPPING=NOT_QUALIFIED'
            }
          } finally {
            if($null -ne $server -and -not $server.HasExited){
              Stop-Process -Id $server.Id -ErrorAction Stop
            }
          }
