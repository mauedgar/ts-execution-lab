name: TS EE 004 generic browser scenario evidence join (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-generic-browser-evidence-20261124
permissions:
  contents: read
concurrency:
  group: ts-ee004-generic-browser-source
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pin unchanged validators and new source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py)" = "36c207326fff0da2231b731422323af186511a49"
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py)" = "1f9d2303409e40b5f9e3b961d94dfb0cbaea1f09"
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_browser_consumer.py)" = "b528a501aa771bf87900c2f6ec9226e9f417bc7a"
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests/test_generic_browser_consumer.py)" = "b11ae4c7ecc8c0776aae348a7069fff9faeb6727"
          python -m py_compile experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/generic_browser_consumer.py
      - name: Source regression only, no browser session or historical artifact replay
        run: |
          set -euo pipefail
          mkdir -m 700 generic-source-evidence
          python -m unittest discover -s experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests -p 'test_*.py' -v 2>&1 | tee generic-source-evidence/TESTS.txt
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result={"schema":"ts-ee/generic-source-only/v1","head":os.environ["GITHUB_SHA"],"tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"new_source_blob":"b528a501aa771bf87900c2f6ec9226e9f417bc7a","source_tests":"PASS","native_browser":"NOT_RUN","provider_native_verified":False,"Product_accepted":False,"Product_effect":"NONE","method_accepted":False}
          Path("generic-source-evidence/SOURCE_ONLY.json").write_text(json.dumps(result,sort_keys=True)+"\n")
          PY
      - name: Preserve source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-generic-browser-source-only
          path: generic-source-evidence/
          retention-days: 5
          if-no-files-found: warn
