name: TS047B IR001 source-only security repair
on:
  push:
    branches:
      - experiment/ts-beads-047b-ir001-source-repair-20261103-001
    paths:
      - 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/**'
      - '.github/workflows/ts-beads-047b-notebook-offline-bootstrap-source-20261103.yml'
permissions:
  contents: read
concurrency:
  group: ts047b-ir001-source-repair-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source_only_security:
    if: ${{ github.repository == 'mauedgar/ts-execution-lab' && github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Exact immutable checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source-only and DoD scope fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          if((git rev-parse HEAD).Trim() -cne '${{ github.sha }}'){ throw 'WRONG_HEAD' }
          if((git merge-base HEAD '404c358cb9717dd5446deae154afd576ede543ba').Trim() -cne '404c358cb9717dd5446deae154afd576ede543ba'){ throw 'ORIGINAL_NOT_ANCESTOR' }
          $base = 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/'
          $allow = @(
            ($base + 'Invoke-047B-NotebookOfflineBootstrap.ps1'),
            ($base + 'test_source_contract.py'),
            ($base + 'OPERATOR_AND_REVIEW_CONTRACT.md'),
            '.github/workflows/ts-beads-047b-notebook-offline-bootstrap-source-20261103.yml'
          )
          $changed = @(git diff --name-only '404c358cb9717dd5446deae154afd576ede543ba' HEAD)
          if($changed.Count -ne $allow.Count){ throw 'CHANGED_FILES_COUNT' }
          foreach($path in $changed){ if($path -cnotin $allow){ throw 'OUT_OF_SCOPE_CHANGE' } }
          $dod = 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/DOD.md'
          if((git rev-parse ('HEAD:'+$dod)).Trim() -cne '26388665fc0782fd10b24adca96a7dfa47c6a952'){ throw 'FROZEN_DOD_CHANGED' }
          'EXACT_HEAD_ORIGINAL_ANCESTOR_AND_GIT_BLOB_DOD_PASS'
      - name: PowerShell AST and non-effectful runner contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/Invoke-047B-NotebookOfflineBootstrap.ps1'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'PWSH_AST_PARSE_FAILED'}
          $sha=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if($sha -notmatch '^[0-9A-F]{64}$'){throw 'SOURCE_HASH_MISSING'}
          'PWSH_PARSER_PASS'
          'RUNNER_SHA256='+$sha
      - name: Behavioral negative tests on hosted Windows (NO SQL)
        shell: pwsh
        run: |
          python -m unittest discover -s 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001' -p 'test_source_contract.py' -v
          if($LASTEXITCODE -ne 0){throw 'SOURCE_NEGATIVE_TESTS_FAILED'}
          'SOURCE_ONLY_BEHAVIORAL_NEGATIVES_PASS'
          'SQL_EXECUTED=FALSE'
          'DPAPI_SECRET_CREATED=FALSE'
          'NATIVE_HOST_MUTATED=FALSE'
          'PRODUCT_WRITES=ZERO'
