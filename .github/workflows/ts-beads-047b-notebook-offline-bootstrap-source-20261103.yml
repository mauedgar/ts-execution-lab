name: TS047B IR002 preflight hardening source-only
on:
  push:
    branches:
      - experiment/ts-beads-047b-ir002-preflight-hardening-20261103-001
    paths:
      - 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/**'
      - '.github/workflows/ts-beads-047b-notebook-offline-bootstrap-source-20261103.yml'
permissions:
  contents: read
concurrency:
  group: ts047b-ir002-preflight-${{ github.sha }}
  cancel-in-progress: false
jobs:
  readonly_source_security:
    if: ${{ github.repository == 'mauedgar/ts-execution-lab' && github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Exact source checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact immutable scope DoD and predecessor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          if((git rev-parse HEAD).Trim() -cne '${{ github.sha }}'){throw 'WRONG_HEAD'}
          if((git rev-parse HEAD^).Trim() -cne '8f484644d9e28f5095a9b3c4cb2c99c18761e6a0'){throw 'WRONG_PARENT'}
          $root='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/'
          $allow=@(
            ($root+'Invoke-047B-NotebookOfflineBootstrap.ps1'),
            ($root+'test_source_contract.py'),
            ($root+'OPERATOR_AND_REVIEW_CONTRACT.md'),
            '.github/workflows/ts-beads-047b-notebook-offline-bootstrap-source-20261103.yml'
          )
          $changed=@(git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne $allow.Count){throw 'WRONG_SCOPE_COUNT'}
          foreach($p in $changed){if($p -cnotin $allow){throw 'OUT_OF_SCOPE_FILE'}}
          $dod='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/DOD.md'
          if((git rev-parse ('HEAD:'+$dod)).Trim() -cne '26388665fc0782fd10b24adca96a7dfa47c6a952'){throw 'FROZEN_DOD_CHANGED'}
          'EXACT_SCOPE_AND_DOD_PASS'
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001/Invoke-047B-NotebookOfflineBootstrap.ps1'
          $tok=$null
          $errs=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tok,[ref]$errs)
          if(@($errs).Count -gt 0){throw 'PWSH_AST_FAILED'}
          $bytes=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if($bytes -notmatch '^[0-9A-F]{64}$'){throw 'SOURCE_SHA256_FAILED'}
          'PWSH_AST_PASS'
          'SOURCE_SHA256='+$bytes
      - name: Behavioral OS-only fixture negatives
        shell: pwsh
        run: |
          python -m unittest discover -s 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/NOTEBOOK-OFFLINE-BOOTSTRAP-20261103-001' -p 'test_source_contract.py' -v
          if($LASTEXITCODE -ne 0){throw 'BEHAVIORAL_TESTS_FAILED'}
          'NON_EFFECTFUL_TESTS_PASS'
          'SQL_EXECUTED=FALSE'
          'DPAPI_SECRET_CREATED=FALSE'
          'NATIVE_HOST_MUTATED=FALSE'
          'PRODUCT_WRITES=ZERO'
