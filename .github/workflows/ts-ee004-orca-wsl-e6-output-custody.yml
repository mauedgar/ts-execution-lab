name: TS EE 004 Orca WSL E7 isolated station and protected output (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-orca-wsl-e6-output-custody-20261124
permissions:
  contents: read
concurrency:
  group: ts-ee004-orca-wsl-e6-output-custody
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source blob and pinned candidate checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'SOURCE_HEAD_MISMATCH' }
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          $blob=(git rev-parse "HEAD:$src").Trim()
          if ($blob -ne 'd91acc2cbf5e5aba55c2ef3463f96b24a1722c9d') { throw "SOURCE_BLOB_MISMATCH_$blob" }
          if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw 'MISSING_SOURCE' }
          Write-Output "GIT_BLOB=$blob"
      - name: SelfTest isolated anchor/protected reservation and strict receipt, source only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $src -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "SELFTEST_FAILED_$LASTEXITCODE" }
      - name: Exact native source-only evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path source-evidence -ErrorAction Stop | Out-Null
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          $hash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          $result=@{schema='ts-ee/orca-wsl-e7-source-only/v0.1';head=$env:GITHUB_SHA
            tree=(git rev-parse 'HEAD^{tree}').Trim()
            source_blob='d91acc2cbf5e5aba55c2ef3463f96b24a1722c9d'
            runner_windows_sha256=$hash;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT
            findings_targeted=@('IR006-F01','IR006-F02','E6-G1-UNTRUSTED-ANCESTOR-ACL','IR007-A02','IR008-F01','IR009-F01')
            tests='SOURCE_ONLY_E7_ISOLATED_ANCHOR_PROTECTED_OUTPUT_AND_ORDINAL_IDENTITY';Native_Provision='NOT_RUN';Native_WSL='NOT_RUN';Orca='NOT_RUN'
            Product_effect='NONE';method_accepted=$false;source_review='PENDING'}
          $json=ConvertTo-Json -InputObject $result -Compress -Depth 5
          [IO.File]::WriteAllText('source-evidence/SOURCE_ONLY.json',$json,[Text.UTF8Encoding]::new($false))
      - name: Preserve CI original source-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-orca-wsl-e6-source-only
          path: source-evidence/
          retention-days: 5
          if-no-files-found: warn
