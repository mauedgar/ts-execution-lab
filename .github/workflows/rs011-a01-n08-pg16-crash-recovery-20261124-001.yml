name: RS011 N08 CI003 externally admitted disposable crash recovery
on:
  push:
    branches:
      - rs011/execute/n08-ci003-20261124-001
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: ${{ github.event.created == true && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent Git admission and single native run before any service
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show refs/remotes/origin/rs011/admissions/n08-ci003-20261124-001:admissions/RS011-N08-CI003-20261124-001.json > "$RUNNER_TEMP/admission.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/admission.json" "$RUNNER_TEMP/runs.json" <<'PY'
          import json, os, subprocess, sys
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def require(x, why):
              if not x:
                  raise SystemExit(why)
          a=json.load(open(sys.argv[1]))
          e=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          r=json.load(open(sys.argv[2]))
          path=".github/workflows/rs011-a01-n08-pg16-crash-recovery-20261124-001.yml"
          source="experiments/TS-RS011-A01-N08-PG16-CRASH-20261124-001/probe.py"
          require(a["attempt"]=="TS-RS011-N08-PG16-CI003-A001", "ATTEMPT_ID")
          require(a["ref"]==os.environ["GITHUB_REF"]=="refs/heads/rs011/execute/n08-ci003-20261124-001","REF")
          require(e["created"] is True and e["before"]=="0"*40 and e["after"]==a["head"],"NOT_CREATE_ONLY")
          require(os.environ["GITHUB_RUN_ATTEMPT"]=="1" and os.environ["GITHUB_EVENT_NAME"]=="push","RUN_ATTEMPT")
          require(a["head"]==os.environ["GITHUB_SHA"]==git("rev-parse","HEAD"),"HEAD")
          require(a["tree"]==git("rev-parse","HEAD^{tree}"),"TREE")
          require(a["parent"]==git("rev-parse","HEAD^"),"PARENT")
          require(a["workflow_blob"]==git("rev-parse","HEAD:"+path),"WORKFLOW")
          require(a["probe_blob"]==git("rev-parse","HEAD:"+source),"PROBE")
          require(a["schema_blob"]=="1a5027709214092a4cabb21c63a53ca4f262c09c","SCHEMA")
          require(a["base"]=="700f0c68e0ce09baa3dc84f3ae245734ddd702bf","BASE")
          actual=git("diff","--name-status",a["base"],"HEAD").splitlines()
          require(sorted(actual)==sorted(["A\t"+source,"A\t"+path]),"WRITESET")
          require(r["total_count"]==len(r["workflow_runs"]) and r["total_count"]<=100,"RUN_INVENTORY")
          matches=[x for x in r["workflow_runs"] if x["head_branch"]=="rs011/execute/n08-ci003-20261124-001"]
          require(len(matches)==1 and str(matches[0]["id"])==os.environ["GITHUB_RUN_ID"] and matches[0]["run_attempt"]==1,"DUPLICATE_OR_UNKNOWN_RUN")
          print("N08_CI003_ADMISSION_CONFIRMED_BEFORE_SERVICE")
          PY
  n08-crash-recovery:
    needs: admission
    if: ${{ needs.admission.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_CONFIG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TS_RS011_N08_DISPOSABLE: 'yes'
    services:
      pg16:
        image: postgres@sha256:5983db9a9c6ad225a48a46cfe2e03e6680b1826662befd0465eb05b34cb1c64e
        env:
          POSTGRES_PASSWORD: 'a01-disposable-admin'
          POSTGRES_DB: postgres
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and inherited immutable schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:experiments/TS-RS011-A01-N08-PG16-CRASH-20261124-001/probe.py)" = 416d39ad3b280300b9a1abe207ef98efe8b4f782
          schema_commit=e805c0bba7e32a6092a4d5155a95d664f8ee37ed
          schema_path=experiments/TS-RS011-A01-OPTION-A-PG16-20261124-001/schema.sql
          test "$(git rev-parse "$schema_commit:$schema_path")" = 1a5027709214092a4cabb21c63a53ca4f262c09c
          mkdir -m 700 "$RUNNER_TEMP/rs011-n08"
          git show "$schema_commit:$schema_path" > "$RUNNER_TEMP/rs011-n08/schema.sql"
          test "$(git hash-object "$RUNNER_TEMP/rs011-n08/schema.sql")" = 1a5027709214092a4cabb21c63a53ca4f262c09c
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'
      - name: Prepare standalone Python and psql
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          /usr/bin/psql --version
          uv python install 3.15.2
      - name: Execute admitted fresh disposable fixture once
        env:
          TS_RS011_N08_SERVICE_ID: ${{ job.services.pg16.id }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.15.2 python -B experiments/TS-RS011-A01-N08-PG16-CRASH-20261124-001/probe.py "$RUNNER_TEMP/rs011-n08/schema.sql"
          echo N08_CI003_CRASH_RECOVERY_PASS_LIMITED
