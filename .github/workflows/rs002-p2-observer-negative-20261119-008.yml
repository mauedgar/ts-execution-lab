name: RS002 P2 IR004 repairs source-only CI008
on:
  push:
    branches:
      - ee/rs002-p2-ir004-repair-20261119-001
    paths:
      - .github/workflows/rs002-p2-observer-negative-20261119-008.yml
permissions:
  contents: read
jobs:
  source-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UV_NO_CONFIG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen IR004 repair subject and strict three-file write-set
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-RS002-PG16-P2-OBSERVER-NEGATIVE-20261118-001
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/ee/rs002-p2-ir004-repair-20261119-001
          test "$(git rev-parse HEAD^)" = 81dfda24a297fa7261e34abc609c328d29bb7ee5
          git merge-base --is-ancestor 935ba9ff1dd2d06a39fb4b454125a51cfc4bbaa9 HEAD
          test "$(git rev-parse "HEAD:$root/p2_observer.py")" = 3d9bfb23f15938a437028358f1f431e7c9c538be
          test "$(git rev-parse "HEAD:$root/test_p2_observer.py")" = 4f20b53627bde942c74819b7ea2195ca94e0dfa2
          test "$(git diff --name-only 935ba9ff1dd2d06a39fb4b454125a51cfc4bbaa9 HEAD | wc -l)" -eq 3
          while IFS= read -r item; do
            case "$item" in
              "$root/p2_observer.py"|"$root/test_p2_observer.py"|".github/workflows/rs002-p2-observer-negative-20261119-008.yml") ;;
              *) echo UNEXPECTED_WRITESET >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 935ba9ff1dd2d06a39fb4b454125a51cfc4bbaa9 HEAD)
          echo RS002_P2_CI008_PINNED_SOURCE_PASS
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'
      - name: Python3.15.2 adversarial synthetic tests no native P0 or P2
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 python -B experiments/TS-RS002-PG16-P2-OBSERVER-NEGATIVE-20261118-001/test_p2_observer.py -v
          echo RS002_P2_CI008_SOURCE_ONLY_NO_PHYSICAL_EFFECT
