name: TS R3 D6 native PG16 19 Product JS exact generation byte parity
on:
  push:
    branches:
      - ee/ts-r3-d6-product-pg19-20261107-001
permissions:
  contents: read
concurrency:
  group: ts-r3-d6-product-pg19-20261107-001
  cancel-in-progress: false
jobs:
  product-pg16-19-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsr3_d6_synthetic
          POSTGRES_PASSWORD: d6_local_test_only
          POSTGRES_DB: tsr3_d6_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsr3_d6_synthetic -d tsr3_d6_synthetic"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
      TS_R3_LOCAL_SYNTHETIC_PG_URI: "postgresql://tsr3_d6_synthetic:d6_local_test_only@127.0.0.1:5432/tsr3_d6_synthetic?sslmode=disable"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Guard frozen Product source and exact two files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c2ff778e195f13551dffe20e90813c6b935c018f"
          test "$(git show -s --format=%T HEAD^)" = "515ea45c56d89f9b6f677901e1cb7e75b19d5c31"
          expected="$(printf '%s\n' '.github/workflows/ts-r3-d6-product-pg19-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_postgres.py')"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected"
          expected_status="$(printf 'A\t%s\nA\t%s\n' '.github/workflows/ts-r3-d6-product-pg19-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_postgres.py')"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = "$expected_status"
          frozen() {
            local p="$1" h="$2"
            test "$(git rev-parse "HEAD:$p")" = "$h"
            test "$(git hash-object "$p")" = "$h"
            test "$(git ls-tree HEAD -- "$p")" = "$(printf '100644 blob %s\t%s' "$h" "$p")"
          }
          test "$(git ls-tree HEAD -- '.github/workflows/ts-r3-d6-product-pg19-20261107-001.yml' | cut -d' ' -f1)" = "100644"
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_postgres.py' 'ff7a19aa79d0a18283b61e78d6c007d04d20a2e7'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/capture.cjs' 'a476c8f0ca39793494bc0551ca53dae05e241a62'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' '5d2d3a8a24ebc17339675e0c801595956e0cd353'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' '0219b92e5f546407a6060a6dc449865c14c7f144'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' 'f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/bridge.py' '61be5ce70662a31118f9ffe442d1a03a5e9f195d'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/legacy_v0.py' '1e39566fdd8cfb0a8de2726c613fb99fd1faa808'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/schema.sql' '3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/pyproject.toml' '2fe9ee1733e71107eac5eb3c915642a3801e210f'
          frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' 'ecf387f8f425598187f3a68b8eac5388376129ce'
          test -z "$(git status --porcelain)"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_NEON_SECRET_NOT_ALLOWED; exit 41; }
          echo D6_FROZEN_PRODUCT_SOURCE_AND_NO_NEON_PASS
      - name: Setup pinned Node22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Setup pinned uv0.13.7 Python3.15.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Capture Product JS and persist 19 source mutations on real local PostgreSQL16
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "22.16.0"
          test "$(uv --version | cut -d' ' -f1-2)" = "uv 0.13.7"
          uv python install 3.15.2
          (cd 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/' && uv lock --no-config --python 3.15.2 && test "$(sha256sum uv.lock | cut -d' ' -f1)" = "5f9d50047f5f55da1002c951e1f8f0da0d30f89bd7fdbd7359f7164d933b157d" && uv sync --no-config --locked --python 3.15.2 --no-install-project)
          ./'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/'.venv/bin/python -I -B -c 'import sys,psycopg,psycopg.pq; assert sys.version_info[:3] == (3,15,2) and psycopg.__version__ == "3.3.8" and psycopg.pq.__impl__ == "binary"'
          t="$(mktemp -d)"
          trap 'rm -rf "$t"' EXIT
          mkdir "$t/isolated-home"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' "$t/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' "$t/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/capture.cjs' "$t/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' "$t/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' "$t/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' "$t/"
          env -i PATH="$PATH" HOME="$t/isolated-home" npm_config_cache="$t/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null npm ci --prefix "$t" --ignore-scripts --no-audit --no-fund
          test "$(env -i PATH="$PATH" HOME="$t/isolated-home" node -p "require('$t/node_modules/zod/package.json').version")" = "4.6.7"
          env -i PATH="$PATH" HOME="$t/isolated-home" node "$t/capture.cjs" "$t" "$t/generations.json"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_NEON_SECRET_NOT_ALLOWED; exit 41; }
          PYTHONPATH="$PWD/experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/" ./'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/'.venv/bin/python -B 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/compare_postgres.py' "$t/generations.json" | tee "$t/result.json"
          ./'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/'.venv/bin/python -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["status"]=="PRODUCT_JS_NATIVE_19_EVENTS_POSTGRESQL16_BYTE_PARITY_PASS" and x["bridge_receipts"]==19 and x["fresh_session_receipts"]==19 and x["product_events"]==19 and x["postgresql_transactionality"]=="CONFIRMED" and x["neon_remote"]=="NOT_RUN" and x["product_effect"]=="NONE"' "$t/result.json"
          echo D6_REAL_PG16_PRODUCT_JS_19_EXACT_EVENT_BYTES_FRESH_READER_PASS
