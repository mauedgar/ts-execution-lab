name: TS EE A03 local Git metadata original A003 independent qualification

on:
  push:
    branches:
      - ee/ts-ee-actions-git-guard-a03-20261111-003
    paths:
      - .github/ts-ee-original-dispatch/TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A003.json

permissions:
  contents: read

concurrency:
  group: ts-ee-a03-metadata-original-20261111-003
  cancel-in-progress: false

jobs:
  one-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
    steps:
      - name: Checkout exact original frozen source and marker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify Python original source AST BEFORE guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast
          for path in ("tools/ts_ee_original_actions_binding.py",
                       "tools/selftest_ts_ee_original_actions_binding.py"):
              with open(path, encoding="utf-8") as source:
                  ast.parse(source.read(), filename=path)
          print("TS_EE_A03_A003_SOURCE_SYNTAX_PASS")
          PY

      - name: Verify newly hardened local Git metadata original guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ts_ee_original_actions_binding.py \
            --root . \
            --marker .github/ts-ee-original-dispatch/TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A003.json \
            --attempt TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A003 \
            | tee "$RUNNER_TEMP/ts-ee-a03-original-a003.json"
          python3 - "$RUNNER_TEMP/ts-ee-a03-original-a003.json" <<'PY'
          import json,sys
          lines=open(sys.argv[1], encoding="utf-8").read().splitlines()
          assert len(lines)==1
          output=json.loads(lines[0])
          assert output["status"]=="TS_EE_ORIGINAL_GIT_TRANSITION_PASS"
          assert output["execution_attempt"]=="TS-EE-A03-GIT-GUARD-QUAL-20261111-001-A003"
          assert output["run_attempt"]==1 and output["product_effect"]=="NONE"
          print("TS_EE_A03_A003_NATIVE_GIT_METADATA_IDENTITY_PASS")
          PY

      - name: Pin uv for Python3.15.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: Run old and metadata adversarial positives and exact negative tests
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 \
            python -B tools/selftest_ts_ee_original_actions_binding.py
          echo "TS_EE_A03_A003_SYNTHETIC_NONPRODUCT_LOCAL_ONLY"

      - name: Original result effect boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "TS_EE_A03_A003_NO_SQL_NO_NEON_NO_HOST_NO_PRODUCT"
