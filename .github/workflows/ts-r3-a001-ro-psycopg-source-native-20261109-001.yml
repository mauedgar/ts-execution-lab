name: TS R3 A001 IR002 credentialless psycopg3.3.8 binary runtime smoke
on:
  push:
    branches:
      - ee/ts-r3-a001-ir002-runtime-smoke-20261109-001
    paths:
      - .github/workflows/ts-r3-a001-ro-psycopg-source-native-20261109-001.yml
permissions:
  contents: read
concurrency:
  group: ts-r3-a001-ir002-ro-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-native-psycopg:
    if: ${{ github.repository == 'mauedgar/ts-execution-lab' && github.ref == 'refs/heads/ee/ts-r3-a001-ir002-runtime-smoke-20261109-001' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
    steps:
      - name: Checkout frozen source without token persistence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify Python blob and reject credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/runners/neon_readonly_preflight.py)" = "10cc5128363e1e2f4b0c31093849c30793a30ec7"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || exit 41
          test -z "${TS_R3_NEON_CHILD_RO_DSN-}" || exit 42
          test -z "${DATABASE_URL-}" || exit 43
          test -z "${PGPASSWORD-}" || exit 44
          echo A001_IR002_SOURCE_IDENTITY_NO_SECRETS_PASS
      - name: Pin uv from previously qualified source-only profile
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Python 3.15.2 and psycopg 3.3.8 binary smoke without network database
        id: native_smoke
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 --with 'psycopg[binary]==3.3.8' python -B - <<'PY' > "$RUNNER_TEMP/a001-ir002-psycopg-smoke.json"
          import importlib.util, json, sys
          from pathlib import Path
          import psycopg, psycopg.pq
          from psycopg.conninfo import make_conninfo, conninfo_to_dict
          assert sys.version_info[:3] == (3,15,2)
          assert psycopg.__version__ == '3.3.8'
          assert psycopg.pq.__impl__ == 'binary'
          source = Path('experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/runners/neon_readonly_preflight.py')
          spec = importlib.util.spec_from_file_location('ts_r3_ro_probe', source)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.SECRET_ENV == 'TS_R3_NEON_CHILD_RO_DSN'
          assert mod.EXPECTED_ROLE == 'tsr3_a001_neon_ro_20261109'
          assert mod.self_test() == 29
          fake = 'postgresql://fake_user:fake-only-placeholder@localhost/fake_db?sslmode=require&channel_binding=require'
          secure = mod.secure_connection_kwargs()
          conninfo = make_conninfo(fake, **secure)
          opts = conninfo_to_dict(conninfo)
          assert all(opts.get(k) == v for k,v in secure.items())
          assert opts.get('host') == 'localhost'
          assert opts.get('user') == 'fake_user'
          print(json.dumps({'status':'PASS_SOURCE_NATIVE_PSYCOG_BINARY','python':'3.15.2','psycopg':'3.3.8','pq_impl':'binary','negative_dsn_cases':29,'secure_libpq_kwargs':'PASS','credential':'NOT_USED','neon_sql':'NOT_RUN','network_database':'NOT_RUN','product_effect':'NONE'},sort_keys=True))
          PY
          python3 - "$RUNNER_TEMP/a001-ir002-psycopg-smoke.json" <<'PY'
          import json,sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload['status']=='PASS_SOURCE_NATIVE_PSYCOG_BINARY'
          assert payload['negative_dsn_cases']==29 and payload['pq_impl']=='binary'
          assert payload['secure_libpq_kwargs']=='PASS' and payload['network_database']=='NOT_RUN'
          PY
          echo A001_IR002_NATIVE_PY3152_PSYCOPG338_BINARY_29_PASS
      - name: Safe original attempt receipt with bound step outcome
        if: ${{ always() }}
        shell: bash
        env:
          NATIVE_TEST_OUTCOME: ${{ steps.native_smoke.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          outcome=os.environ.get('NATIVE_TEST_OUTCOME','')
          assert outcome in ('success','failure','skipped','cancelled','')
          result={
            'operation':'TS-R3-A001-IR002-RUNTIME-SOURCE-20261109-001',
            'execution_attempt':'TS-R3-A001-IR002-RUNTIME-SOURCE-20261109-001-A001',
            'provider':'github-actions',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'head_sha':os.environ['GITHUB_SHA'],
            'source_blob':'10cc5128363e1e2f4b0c31093849c30793a30ec7',
            'test_step_id':'native_smoke',
            'test_step_outcome':outcome if outcome else 'UNAVAILABLE',
            'test_result':'SOURCE_NATIVE_PASS_PENDING_CONTROLLER_JOIN' if outcome=='success' else 'SOURCE_NATIVE_NOT_PASS_PENDING_CONTROLLER_JOIN',
            'secret':'NOT_USED',
            'neon_sql':'NOT_RUN',
            'product_effect':'NONE',
          }
          Path(os.environ['RUNNER_TEMP'],'a001-ir002-native-receipt.json').write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
          print('A001_IR002_RECEIPT_WITH_REAL_STEP_OUTCOME_WRITTEN')
          PY
      - name: Upload safe source-only receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ts-r3-a001-ir002-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a001-ir002-psycopg-smoke.json
            ${{ runner.temp }}/a001-ir002-native-receipt.json
          if-no-files-found: error
          retention-days: 7
