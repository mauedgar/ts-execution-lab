name: TS EE 004 historical Q5B original native strict-consumer join (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-pr75-native-consumer-20261123
permissions:
  contents: read
  actions: read
concurrency:
  group: ts-ee004-pr75-original-consumer
  cancel-in-progress: false
jobs:
  original_join:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact source and inherited stable v0 guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py)" = "36c207326fff0da2231b731422323af186511a49"
          python -m py_compile experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py
          python -m py_compile experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/original_q5b_native_consumer.py
          python -m unittest discover -s experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests -p 'test_*.py' -v
      - name: Acquire historical ORIGINAL provider readbacks (no rerun)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 prior-native
          gh api /repos/mauedgar/ts-execution-lab/actions/runs/45229561752 > prior-native/run.json
          gh api /repos/mauedgar/ts-execution-lab/actions/artifacts/14847471289 > prior-native/artifact.json
          gh api /repos/mauedgar/ts-execution-lab/actions/artifacts/14847471289/zip > prior-native/original.zip
          test "$(wc -c < prior-native/original.zip)" = 107550
          echo "Native provider metadata and bytes acquired without browser dispatch"
      - name: Pin original HEAD/tree/run, 16 files and caller contract
        shell: bash
        run: |
          set -euo pipefail
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/original_q5b_native_consumer.py \
            --zip prior-native/original.zip \
            --run-meta prior-native/run.json \
            --artifact-meta prior-native/artifact.json \
            --out prior-native/join
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py \
            prior-native/join/COMMON_RECEIPT_V01.json \
            --artifact-root prior-native/join \
            --expected-commit 8eb4e4d16b8ca0aea956c1e8d8e15be012470b01 \
            --expected-tree 2e7adb5f424f055a52f869e7e0d0ca8423060808 \
            --expected-run-id 45229561752 \
            --expected-engine CHROMEDRIVER_NODE \
            --expected-subject-kind SYNTHETIC \
            --expected-evidence-profile Q5B_SYNTHETIC_LOCAL_V01 \
            > prior-native/join/VALIDATION_PR75.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("prior-native/join/VALIDATION_PR75.json").read_text("utf8"))
          assert d["status"]=="VALID_SHAPE_UNATTESTED", d
          assert d["artifact_bytes_verified_locally"] is True, d
          assert d["functional_browser_status"]=="PASS",d
          assert d["network_assurance_status"]=="OBSERVE_ONLY_UNATTESTED",d
          assert not d["Product_accepted"] and not d["provider_native_verified"],d
          print("PR75_STRICT_ORIGINAL_CONSUMER=PASS_BOUNDED_UNATTESTED")
          PY
      - name: Upload bounded original join only (no browser)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-pr75-original-native-strict-consumer
          path: prior-native/join/
          retention-days: 5
          if-no-files-found: warn
