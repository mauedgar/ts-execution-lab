name: TS EE 003 ChromeDriver bounded isolated lifecycle
on:
  push:
    branches:
      - experiment/ts-ee003-chromedriver-b001-20261121
permissions:
  contents: read
concurrency:
  group: ts-ee003-chromedriver-b001
  cancel-in-progress: false
jobs:
  lifecycle:
    name: chrome-session-${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22.23.3
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
      - name: Assert native source identity and Chrome toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "ImageVersion=${ImageVersion:-UNAVAILABLE}"
          node --version
          CHROME_PATH="$(command -v google-chrome)"
          DRIVER_PATH="$(command -v chromedriver)"
          echo "Chrome path: $CHROME_PATH"
          echo "ChromeDriver path: $DRIVER_PATH"
          google-chrome --version
          chromedriver --version
          sha256sum "$(readlink -f "$CHROME_PATH")" "$(readlink -f "$DRIVER_PATH")"
      - name: Execute bounded protocol positive and negative fixtures
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/protocol_stubs.mjs
      - name: Run ONE real ChromeDriver session with cleanup
        env:
          TS_EE_OUTPUT_DIR: chromedriver-evidence
        run: node experiments/TS-EE-CHROMEDRIVER-20261121-001/real_session_probe.mjs
      - name: Upload allowlisted receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee003-chrome-${{ matrix.trial }}
          path: chromedriver-evidence/SESSION_REPORT.json
          retention-days: 5
          if-no-files-found: warn
