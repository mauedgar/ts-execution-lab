name: Tecnotron Python315 aiohttp-yarl wheel qualification
on:
  push:
    branches:
      - experiment/python315-aiohttp-yarl-wheel-20261102-001
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mauedgar/tecnotron-ai
          ref: bc9e60b9cad79037b40c298d5c9a84f17a33d909
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bc9e60b9cad79037b40c298d5c9a84f17a33d909
          test "$(git rev-parse HEAD:python/requirements.txt)" = b1a9f877be8b54618942e295e95bf43bda264e42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Pin uv
        shell: bash
        run: python -m pip install uv==0.13.6
      - name: Isolated coordinated dependency experiment
        shell: bash
        run: |
          python - <<'PY'
          import json,os,sys,pathlib,subprocess,platform
          assert sys.version_info[:3]==(3,15,2)
          original=pathlib.Path('python/requirements.txt').read_text(encoding='utf-8-sig').splitlines()
          assert original.count('aiohttp==3.10.7')==1
          assert original.count('yarl==1.24.5')==1
          out=[]
          for line in original:
              if line=='aiohttp==3.10.7':line='aiohttp==3.14.5'
              if line=='yarl==1.24.5':line='yarl==1.25.1'
              if line.startswith(('pywin32==','win32_setctime==')):line+=' ; sys_platform == "win32"'
              out.append(line)
          pathlib.Path('derived-only.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          result={'schema':'TEC-PY315-QUALIFICATION-COORDINATED-001','Product_effect':'NONE',
          'source':'bc9e60b9cad79037b40c298d5c9a84f17a33d909',
          'manifest_blob':'b1a9f877be8b54618942e295e95bf43bda264e42','python':sys.version,
          'platform':platform.platform(),'run_id':os.environ.get('GITHUB_RUN_ID'),
          'deltas':['aiohttp==3.14.5','yarl==1.25.1','win-only platform markers']}
          p=subprocess.run(['uv','venv','.venv-probe','--python',sys.executable],capture_output=True,text=True,timeout=90)
          if p.returncode:
              result.update(status='BLOCKED_VENV',exit=p.returncode,tail=p.stderr[-9000:])
          else:
              try:
                  q=subprocess.run(['uv','pip','install','--python','.venv-probe','--only-binary',':all:','-r','derived-only.txt'],capture_output=True,text=True,timeout=420)
                  result.update(status='PASS' if q.returncode==0 else 'BLOCKED_DEPENDENCIES',exit=q.returncode,tail=(q.stdout+'\n'+q.stderr)[-11000:])
              except subprocess.TimeoutExpired:
                  result.update(status='TIMEOUT')
          pathlib.Path('qualification.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: py315-aiohttp-yarl-${{ matrix.os }}
          path: qualification.json
          if-no-files-found: warn
