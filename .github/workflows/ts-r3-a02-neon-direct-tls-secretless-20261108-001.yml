name: TS R3 A02 Secretless External Neon TLS Qualification
# Historical terminal one-shot run: 42526787437 at f44611aa5fb4f3768ff80db6cad0ff95829181df.
# This archived workflow is intentionally inert. A new test requires a new
# qualified candidate, ExecutionAttempt and dedicated branch/workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ts-r3-a02-direct-tls-secretless-20261108-001
  cancel-in-progress: false
jobs:
  external-tls-probe:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
    steps:
      - name: Credentialless checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen probe and reject unexpected credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/a02_tls_probe/probe_tls.py)" = "6abc380ee2ed3570898a297940129706de36d54e"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_UNEXPECTED_DSN; exit 41; }
          test -z "${DATABASE_URL-}" || { echo BLOCKED_UNEXPECTED_DATABASE_URL; exit 42; }
          test -z "${PGPASSWORD-}" || { echo BLOCKED_UNEXPECTED_PGPASSWORD; exit 43; }
          test -z "$(git status --porcelain)"
      - name: Pin uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Verify direct external Neon TLS without PostgreSQL authentication
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          py="$(uv python find 3.15.2)"
          "$py" -B experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/a02_tls_probe/probe_tls.py | tee "$RUNNER_TEMP/ts-r3-a02-direct-tls-result.json"
          "$py" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="A02_EXTERNAL_NEON_POSTGRES_TLS_CA_HOSTNAME_PASS" and r["hostname_verified"] and r["ca_chain_verified"] and not r["credentials_used"] and r["neon_data_effect"]=="NONE" and r["product_effect"]=="NONE" and r["postgres_authentication"]=="NOT_RUN"' "$RUNNER_TEMP/ts-r3-a02-direct-tls-result.json"
          echo A02_NEON_EXTERNAL_TLS_SECRETLESS_PASS
