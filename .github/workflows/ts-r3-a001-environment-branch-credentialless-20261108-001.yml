name: TS R3 A001 Secretless Environment Boundary Qualification
# Historical run 42541156860 PASS at b903192a14967a2a58033f71f5e87a49dc6f327a.
# Archived; no future push dispatch. Explicit manual dispatch skips job.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ts-r3-a001-secretless-env-policy-20261108-001
  cancel-in-progress: false
jobs:
  environment-branch-guard:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ts-r3-neon-child-qual-20261107
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify branch admission with no secret use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ee/ts-r3-a001-secure-readonly-20261107-001"
          test "$(git rev-parse HEAD:experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/runners/neon_readonly_preflight.py)" = "d39520d1ff063cdb00edabd20b36a4f5f5ed582d"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_UNEXPECTED_DSN_EXPOSURE; exit 41; }
          test -z "${DATABASE_URL-}" || { echo BLOCKED_UNEXPECTED_DATABASE_URL; exit 42; }
          test -z "${PGPASSWORD-}" || { echo BLOCKED_UNEXPECTED_PGPASSWORD; exit 43; }
          test -z "$(git status --porcelain)"
          echo A001_GITHUB_ENV_BRANCH_POLICY_SECRETLESS_PASS
