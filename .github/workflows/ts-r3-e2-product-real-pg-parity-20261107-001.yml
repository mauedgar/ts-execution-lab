name: TS R3 E2 canonical Product JS19 events real PG16 exact-byte parity
on:
  push:
    branches:
      - ee/ts-r3-e2-product-real-pg-parity-20261107-001
permissions:
  contents: read
concurrency:
  group: ts-r3-e2-product-real-pg-parity-20261107-001
  cancel-in-progress: false
jobs:
  product-real-pg16-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsr3_e2_synthetic
          POSTGRES_PASSWORD: e2_local_disposable_only
          POSTGRES_DB: tsr3_e2_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsr3_e2_synthetic -d tsr3_e2_synthetic"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 12
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
      TS_R3_LOCAL_SYNTHETIC_PG_URI: "postgresql://tsr3_e2_synthetic:e2_local_disposable_only@127.0.0.1:5432/tsr3_e2_synthetic?sslmode=disable"
    steps:
      - name: Checkout exact immutable experiment no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact parent, path delta, Product blobs, and no Neon DSN
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c2ff778e195f13551dffe20e90813c6b935c018f"
          test "$(git show -s --format=%T HEAD^)" = "515ea45c56d89f9b6f677901e1cb7e75b19d5c31"
          expected="$(printf '%s\n' '.github/workflows/ts-r3-e2-product-real-pg-parity-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e2/compare_pg16.py')"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected"
          expected_status="$(printf 'A\t%s\nA\t%s\n' '.github/workflows/ts-r3-e2-product-real-pg-parity-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e2/compare_pg16.py')"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = "$expected_status"
          check_frozen() {
            local file="$1" sha="$2"
            test "$(git rev-parse "HEAD:$file")" = "$sha"
            test "$(git ls-tree HEAD -- "$file")" = "$(printf '100644 blob %s\t%s' "$sha" "$file")"
            test "$(git hash-object "$file")" = "$sha"
          }
          test "$(git ls-tree HEAD -- '.github/workflows/ts-r3-e2-product-real-pg-parity-20261107-001.yml' | cut -d' ' -f1)" = "100644"
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e2/compare_pg16.py' '5a2319fc2d68caa280930b9c59b526e06466a852'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/capture.cjs' 'a476c8f0ca39793494bc0551ca53dae05e241a62'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' '67b246532b4573af1477af8b11244c157151d371'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' 'ecf387f8f425598187f3a68b8eac5388376129ce'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' '5d2d3a8a24ebc17339675e0c801595956e0cd353'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' '0219b92e5f546407a6060a6dc449865c14c7f144'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' 'f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/bridge.py' '61be5ce70662a31118f9ffe442d1a03a5e9f195d'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/ts_global/legacy_v0.py' '1e39566fdd8cfb0a8de2726c613fb99fd1faa808'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/schema.sql' '3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/pyproject.toml' '2fe9ee1733e71107eac5eb3c915642a3801e210f'
          test -z "$(git status --porcelain)"
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_UNEXPECTED_NEON_DSN; exit 40; }
          echo E2_PRODUCT_V0_BYTES_REAL_PG16_SOURCE_FROZEN_PASS
      - name: Install pinned Node22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Install pinned uv0.13.7
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Real Product 19-event capture and exact PG16 native bridge replay
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "22.16.0"
          uv python install 3.15.2
          cd 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001'
          uv lock --no-config --python 3.15.2
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = "5f9d50047f5f55da1002c951e1f8f0da0d30f89bd7fdbd7359f7164d933b157d"
          uv sync --no-config --locked --python 3.15.2 --no-install-project
          .venv/bin/python -I -B -c 'import sys,psycopg,psycopg.pq; assert sys.version_info[:3] == (3,15,2) and psycopg.__version__ == "3.3.8" and psycopg.pq.__impl__ == "binary"'
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_UNEXPECTED_NEON_DSN; exit 40; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir "$workdir/clean-home"
          cp differential/e1/package.json "$workdir/"
          cp differential/e1/package-lock.json "$workdir/"
          cp differential/e1/capture.cjs "$workdir/"
          cp fixtures/product-kernel-v0/contracts.js "$workdir/"
          cp fixtures/product-kernel-v0/index.js "$workdir/"
          cp fixtures/product-kernel-v0/store.js "$workdir/"
          env -i PATH="$PATH" HOME="$workdir/clean-home" npm_config_cache="$workdir/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null npm ci --prefix "$workdir" --ignore-scripts --no-audit --no-fund
          test "$(env -i PATH="$PATH" HOME="$workdir/clean-home" node -p "require('$workdir/node_modules/zod/package.json').version")" = "4.6.7"
          env -i PATH="$PATH" HOME="$workdir/clean-home" node "$workdir/capture.cjs" "$workdir" "$workdir/product-generations.json"
          PYTHONPATH="$PWD" .venv/bin/python -B differential/e2/compare_pg16.py "$workdir/product-generations.json" | tee "$workdir/e2-result.json"
          .venv/bin/python -c 'import json,sys; o=json.load(open(sys.argv[1])); assert o["status"] == "PRODUCT_JS_NATIVE_19_EVENTS_REAL_PG16_BRIDGE_BYTE_PARITY_PASS" and o["product_events"] == 19 and o["db_events"] == 19 and o["db_receipts"] == 19 and o["backend"] == "DISPOSABLE_REAL_POSTGRESQL16" and o["product_effect"] == "NONE" and o["remote_neon"] == "NOT_RUN"' "$workdir/e2-result.json"
          echo E2_NATIVE_PRODUCT_19_SOURCE_EVENTS_REAL_PG16_EXACT_BYTES_PASS_NO_NEON
