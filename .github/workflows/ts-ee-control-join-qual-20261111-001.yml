name: TS EE nonProduct external Control join synthetic qualification

on:
  push:
    branches:
      - ee/ts-ee-actions-original-binding-20261111-002
    paths:
      - .github/ts-ee-original-dispatch/TS-EE-CONTROL-JOIN-QUAL-20261111-001-A001.json

permissions:
  contents: read

concurrency:
  group: ts-ee-control-join-qual-20261111-001
  cancel-in-progress: false

jobs:
  original-external-join-qualification:
    name: Original Git identity and external Control join synthetic proof
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_CONFIG: '1'
    steps:
      - name: Checkout exact original Git subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify original marker-only Git transition before tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts_ee_original_actions_binding.py \
            --root . \
            --marker .github/ts-ee-original-dispatch/TS-EE-CONTROL-JOIN-QUAL-20261111-001-A001.json \
            --attempt TS-EE-CONTROL-JOIN-QUAL-20261111-001-A001 \
            | tee "$RUNNER_TEMP/ts-ee-control-join-original-guard.json"
          python3 - "$RUNNER_TEMP/ts-ee-control-join-original-guard.json" <<'PY'
          import json,sys
          rows=open(sys.argv[1], encoding="utf-8").read().splitlines()
          assert len(rows)==1
          q=json.loads(rows[0])
          assert q["status"]=="TS_EE_ORIGINAL_GIT_TRANSITION_PASS"
          assert q["execution_attempt"]=="TS-EE-CONTROL-JOIN-QUAL-20261111-001-A001"
          assert q["run_attempt"]==1 and q["product_effect"]=="NONE"
          print("TS_EE_CONTROL_JOIN_ORIGINAL_NATIVE_IDENTITY_PASS")
          PY

      - name: Pin uv tool version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: One positive and eleven exact-code negative Control join tests
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 \
            python -B tools/selftest_ts_ee_original_actions_control_join.py
          echo "TS_EE_CONTROL_JOIN_SYNTHETIC_NONPRODUCT_NO_EXTERNAL_GIT_FETCH_NO_SQL_NO_HOST"

      - name: No Product or physical effect
        run: |
          set -euo pipefail
          echo "TS_EE_CONTROL_JOIN_ONLY_NATIVE_ORIGINAL_RECEIPT_NO_PRODUCT_EFFECT"
