name: TS Beads 039 original Product Recipe UNKNOWN conservative join
on:
  push:
    branches:
      - experiment/beads-039-unknown-race-conservative-20261031-001
    paths:
      - .github/workflows/ts-beads039-semantic-parity.yml
permissions:
  contents: read
jobs:
  original-recipe-native-beads-conservative-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Original Kernel A vs scoped native Beads B with conservative postread
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/TS-BEADS-039-UNKNOWN-RACE-20261031-001
          test "${GITHUB_REF_NAME}" = experiment/beads-039-unknown-race-conservative-20261031-001
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git hash-object "$root/consumer039-A.mjs")" = eea40f792940cd0143a67cde7a2cfa98d52a50b5
          test "$(git hash-object "$root/consumer039-B.mjs")" = 3aa4fc146f1d5e42271682b801049358adca06dc
          test "$(git hash-object "$root/compare039.py")" = 784d400732fb1be556089e6a95f2cad90a526a90
          node --check "$root/consumer039-A.mjs"
          node --check "$root/consumer039-B.mjs"
          python3 -m py_compile "$root/compare039.py"
          scratch="/tmp/ts-beads039-${GITHUB_RUN_ID}"
          test ! -e "$scratch"
          mkdir -p "$scratch/bin" "$scratch/dolt" "$scratch/native-git" "$scratch/sql"
          curl --fail --location --silent --show-error --output "$scratch/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $scratch/beads.tar.gz" | sha256sum -c -
          curl --fail --location --silent --show-error --output "$scratch/dolt.tar.gz" https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-linux-amd64.tar.gz
          echo "1f7ad8c2622995789420a3fb0f2d16b4aa7430000a825dd91d5938f36480cbf6  $scratch/dolt.tar.gz" | sha256sum -c -
          tar -xzf "$scratch/beads.tar.gz" -C "$scratch/bin"
          tar -xzf "$scratch/dolt.tar.gz" -C "$scratch/dolt"
          export BD_BIN="$(find "$scratch/bin" -type f -name bd -print -quit)"
          export DOLT_BIN="$(find "$scratch/dolt" -type f -name dolt -print -quit)"
          test -n "$BD_BIN" && test -n "$DOLT_BIN"
          chmod +x "$BD_BIN" "$DOLT_BIN"
          export PATH="$(dirname "$DOLT_BIN"):$PATH"
          export BEADS_DOLT_SERVER_MODE=1
          export BEADS_DOLT_SERVER_HOST=127.0.0.1
          export BEADS_DOLT_SERVER_PORT="$((31000 + GITHUB_RUN_ID % 20000))"
          ( cd "$scratch/sql" && "$DOLT_BIN" sql-server --host 127.0.0.1 --port "$BEADS_DOLT_SERVER_PORT" ) > "$scratch/dolt-original.log" 2>&1 &
          sql_pid=$!
          trap 'kill "$sql_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if ! kill -0 "$sql_pid" 2>/dev/null; then echo SQL_SERVER_EXIT; tail -n 10 "$scratch/dolt-original.log"; exit 1; fi
            if python3 - "$BEADS_DOLT_SERVER_PORT" <<'PY'
          import socket,sys
          try:
            s=socket.create_connection(("127.0.0.1",int(sys.argv[1])),.4);s.close()
          except OSError:sys.exit(1)
          PY
            then break; fi
            sleep .2
          done
          git -C "$scratch/native-git" init -q
          test -z "$(git -C "$scratch/native-git" remote)"
          export PRODUCT_ROOT="$scratch/product"
          git clone -q --no-checkout https://github.com/mauedgar/tecnotron-ai.git "$PRODUCT_ROOT"
          git -C "$PRODUCT_ROOT" checkout -q --detach d4154bd43f26515c39a41be974e462a0c7406a2d
          test "$(git -C "$PRODUCT_ROOT" rev-parse HEAD)" = d4154bd43f26515c39a41be974e462a0c7406a2d
          test "$(git -C "$PRODUCT_ROOT" rev-parse 'HEAD^{tree}')" = cbfb71ad8632047e8e64fe2665d8614d835a2c8b
          test "$(git -C "$PRODUCT_ROOT" rev-parse HEAD:src/operational-spine-v0/recipes/reconcile-and-close-taskcycle.js)" = 1e89df1a1885e3d0d24576338f0ffbd9b79890bc
          git -C "$PRODUCT_ROOT" fetch -q origin tools:refs/remotes/origin/tools
          test "$(git -C "$PRODUCT_ROOT" rev-parse origin/tools:src/operational-spine-v0/recipes/reconcile-and-close-taskcycle.js)" = 1e89df1a1885e3d0d24576338f0ffbd9b79890bc
          npm --prefix "$PRODUCT_ROOT" ci --ignore-scripts --no-audit --no-fund --silent
          export LAB_ROOT="$scratch/native-git"
          export A_RESULT="$scratch/A-original.json"
          export B_RESULT="$scratch/B-original.json"
          export A_KERNEL_ROOT="$scratch/Kernel-A"
          export RESULT_PATH="$B_RESULT"
          node "$root/consumer039-A.mjs" 2>&1 | tee "$scratch/A-original.log"
          node "$root/consumer039-B.mjs" 2>&1 | tee "$scratch/B-original.log"
          export RESULT_PATH="$scratch/COMPARE039.json"
          python3 "$root/compare039.py" 2>&1 | tee "$scratch/COMPARE039-original.log"
          python3 - "$RESULT_PATH" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1],encoding="utf8"))
          assert z["status"]=="PASS_BOUNDED_CONSERVATIVE_UNKNOWN_PARITY_OVER_NATIVE_BEADS_WITH_GLOBAL_GAPS",z
          assert z["checks_passed"]==z["checks_total"] and z["checks_total"]>=12
          assert z["product_effect"]=="NONE"
          assert z["original_race"]["B_original"]["effect_state"]=="NONE"
          assert z["original_race"]["B_conservative_join"]["effect_state"]=="UNKNOWN"
          PY
          cp "$root/DOD.md" "$scratch/DOD.md"
          (cd "$scratch" && sha256sum A-original.json B-original.json COMPARE039.json A-original.log B-original.log DOD.md > ORIGINAL_SHA256.txt)
          echo "TS_BEADS039=PASS_NATIVE_B_POSTREAD_CONSERVATIVE_RACE;Product=NONE;OriginalRecipe=UNCHANGED"
          echo "TS_BEADS039_RESULT_SHA256=$(sha256sum "$RESULT_PATH" | cut -d' ' -f1)"
      - name: Preserve original A/B and independent comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-beads039-original-${{ github.run_id }}
          path: |
            /tmp/ts-beads039-${{ github.run_id }}/*-original.json
            /tmp/ts-beads039-${{ github.run_id }}/COMPARE039.json
            /tmp/ts-beads039-${{ github.run_id }}/*-original.log
            /tmp/ts-beads039-${{ github.run_id }}/DOD.md
            /tmp/ts-beads039-${{ github.run_id }}/ORIGINAL_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
