name: TS EE 004 Orca WSL E5 strict complete receipt and ACL (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-orca-wsl-e5-source-repair-20261123
permissions:
  contents: read
concurrency:
  group: ts-ee004-orca-wsl-e5-strict-receipt
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact parent source blob and pinned candidate checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'SOURCE_HEAD_MISMATCH' }
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          $blob=(git rev-parse "HEAD:$src").Trim()
          if ($blob -ne '12dba1ff16743441806a1c9528f30b6eaebba438') { throw "SOURCE_BLOB_MISMATCH_$blob" }
          if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw 'MISSING_SOURCE' }
          Write-Output "GIT_BLOB=$blob"
      - name: SelfTest strict original bytes, typed ACL and independent deadline, source only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $src -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "SELFTEST_FAILED_$LASTEXITCODE" }
      - name: Exact native source-only evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path source-evidence -ErrorAction Stop | Out-Null
          $src='experiments/TS-EE-ORCA-WSL-CHILD-BINDING-20261123-001/Invoke-OrcaWslReadOnlyLeaf.ps1'
          $hash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          $result=@{schema='ts-ee/orca-wsl-e5-source-only/v0.1';head=$env:GITHUB_SHA
            tree=(git rev-parse 'HEAD^{tree}').Trim()
            source_blob='12dba1ff16743441806a1c9528f30b6eaebba438'
            runner_windows_sha256=$hash;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT
            findings_targeted=@('IR002-F01','IR002-F02','IR002-F03','IR002-F04','IR002-F05')
            tests='SOURCE_ONLY_NEGATIVE_AND_ATOMIC';Native_WSL='NOT_RUN';Orca='NOT_RUN'
            Product_effect='NONE';method_accepted=$false;source_review='PENDING'}
          $json=ConvertTo-Json -InputObject $result -Compress -Depth 5
          [IO.File]::WriteAllText('source-evidence/SOURCE_ONLY.json',$json,[Text.UTF8Encoding]::new($false))
      - name: Preserve CI original source-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-orca-wsl-e5-source-only
          path: source-evidence/
          retention-days: 5
          if-no-files-found: warn
