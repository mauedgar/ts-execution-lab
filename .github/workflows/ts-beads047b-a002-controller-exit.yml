name: TS-BEADS 047B A002 local controller loss no SQL
on:
  push:
    branches:
      - experiment/ts-beads-047b-a002-controller-exit-20261102-001
    paths:
      - .github/workflows/ts-beads047b-a002-controller-exit.yml
permissions:
  contents: read
jobs:
  a002_hosted_source_only:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Set LF before immutable checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: c7845af599d0b9152d71c3e363cedeb8b6646371
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source subject and no unauthorized dependency
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne 'c7845af599d0b9152d71c3e363cedeb8b6646371') {throw 'A002_SUBJECT_IDENTITY_MISMATCH'}
          $source='experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/A002-CONTROLLER-LOSS-20261102-001/Test-A002-ControllerLoss.ps1'
          if ((git hash-object $source).Trim() -cne '54ee953e99470df1e89b871c471718d17ab09799') {throw 'A002_SOURCE_BLOB_MISMATCH'}
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) {throw 'A002_SOURCE_PARSE_FAIL'}
          'TS047B_A002_PIN=PASS_READONLY_SOURCE'
      - name: Observe independent child witness after controller abrupt exit
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File 'experiments/TS-BEADS-047B-NATIVE-TWO-WINDOWS-20261031-001/A002-CONTROLLER-LOSS-20261102-001/Test-A002-ControllerLoss.ps1' -Role Run
          if ($LASTEXITCODE -ne 0) {throw 'A002_CONTROLLER_EXIT_REGRESSION_FAILED'}
          'TS047B_A002=PASS_LOCAL_RECEIPT_RECOVERY_NO_SQL'
