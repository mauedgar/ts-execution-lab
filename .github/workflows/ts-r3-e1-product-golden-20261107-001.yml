name: TS R3 E1 Product V0 four-kind lifecycle golden oracle nonproduct
on:
  push:
    branches:
      - ee/ts-r3-e1-product-golden-20261107-001
permissions:
  contents: read
concurrency:
  group: ts-r3-e1-product-golden-20261107-001
  cancel-in-progress: false
jobs:
  product-js-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout isolated frozen Product fixtures without stored token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate seven-path addition manifest and Product source blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "52284caf4ee6e721dd4995ada6ec03a53e798284"
          test "$(git show -s --format=%T HEAD^)" = "298ca2b61d8ea39130fb457612422eb079349287"
          expected_paths="$(printf '%s\n' '.github/workflows/ts-r3-e1-product-golden-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/oracle.cjs' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js')"
          expected_status="$(printf 'A\t%s\n' '.github/workflows/ts-r3-e1-product-golden-20261107-001.yml' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/oracle.cjs' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js')"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected_paths"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = "$expected_status"
          check_frozen() {
            local path="$1" oid="$2"
            test "$(git rev-parse "HEAD:$path")" = "$oid"
            test "$(git ls-tree HEAD -- "$path")" = "$(printf '100644 blob %s\t%s' "$oid" "$path")"
            test "$(git hash-object "$path")" = "$oid"
          }
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/oracle.cjs' 'c1f15a9706eb050a265377930ba74a9950f6c823'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' 'ecf387f8f425598187f3a68b8eac5388376129ce'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' '67b246532b4573af1477af8b11244c157151d371'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' '5d2d3a8a24ebc17339675e0c801595956e0cd353'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' '0219b92e5f546407a6060a6dc449865c14c7f144'
          check_frozen 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' 'f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a'
          test "$(git ls-tree HEAD -- '.github/workflows/ts-r3-e1-product-golden-20261107-001.yml' | cut -d' ' -f1)" = "100644"
          test -z "$(git status --porcelain)"
          echo E1_PRODUCT_JS_EXACT_FROZEN_FIXTURES_PASS
      - name: Setup pinned disposable Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Run real Product JS state machine on disposable filesystem only
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "22.16.0"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir "$workdir/clean-home"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package.json' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/package-lock.json' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/differential/e1/oracle.cjs' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/contracts.js' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/index.js' "$workdir/"
          cp 'experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001/fixtures/product-kernel-v0/store.js' "$workdir/"
          env -i PATH="$PATH" HOME="$workdir/clean-home" npm_config_cache="$workdir/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null npm ci --prefix "$workdir" --ignore-scripts --no-audit --no-fund
          test "$(env -i PATH="$PATH" HOME="$workdir/clean-home" node -p "require('$workdir/node_modules/zod/package.json').version")" = "4.6.7"
          env -i PATH="$PATH" HOME="$workdir/clean-home" node "$workdir/oracle.cjs" "$workdir" | tee "$workdir/e1-result.json"
          node -e 'const fs=require("node:fs");const obj=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(obj.status!=="PRODUCT_JS_V0_FOUR_KIND_GOLDEN_PASS"||obj.events<17||obj.product_effect!=="NONE"||obj.remote_pg_equivalence!=="NOT_RUN")process.exit(9)' "$workdir/e1-result.json"
          echo E1_NATIVE_PRODUCT_JS_FOUR_KIND_ORACLE_PASS_NO_REMOTE_PG
