name: TS EE 003 Browser QA Common v0.1 schema nonProduct
on:
  push:
    branches:
      - experiment/ts-ee003-feqa-v01-20261121
permissions:
  contents: read
concurrency:
  group: ts-ee003-feqa-v01-b001
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Native Git source and unchanged strict v0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py)" = "36c207326fff0da2231b731422323af186511a49"
          python --version
          python -m py_compile experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py
          python -m json.tool experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/fixtures/qa_report_v01_observe_only.example.json > /dev/null
      - name: Run original v0 and independent versioned v0.1 negative tests
        run: |
          python -m unittest discover -s experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests -p 'test_*.py' -v
      - name: Default consumer refuses a diagnostic-only v0.1 vector
        shell: bash
        run: |
          set -euo pipefail
          V=experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator_v01.py
          R=experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/fixtures/qa_report_v01_observe_only.example.json
          mkdir -p q5a-evidence
          if python "$V" "$R" > q5a-evidence/STRICT_REJECT.json; then
            echo "ERROR: strict consumer accepted TEST_VECTOR" >&2
            exit 1
          fi
          python "$V" "$R" --diagnostic-only > q5a-evidence/DIAGNOSTIC_ONLY.json
          sha256sum "$V" "$R" > q5a-evidence/SOURCE_SHA256.txt
      - name: Preserve limited synthetic source validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee003-q5a-schema-vector
          path: q5a-evidence/
          retention-days: 5
          if-no-files-found: error
