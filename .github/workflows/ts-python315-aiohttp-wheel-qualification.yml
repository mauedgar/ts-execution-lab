name: Python315 aiohttp wheel refresh qualification (isolated)
on:
  push:
    branches:
      - experiment/python315-aiohttp-wheel-qualification-20261102-001
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mauedgar/tecnotron-ai
          ref: bc9e60b9cad79037b40c298d5c9a84f17a33d909
          persist-credentials: false
      - name: Verify frozen original manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bc9e60b9cad79037b40c298d5c9a84f17a33d909'
          test "$(git rev-parse HEAD:python/requirements.txt)" = 'b1a9f877be8b54618942e295e95bf43bda264e42'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Install pinned uv
        shell: bash
        run: python -m pip install uv==0.13.6
      - name: Derive only aiohttp refresh and platform markers, attempt wheel-only install
        shell: bash
        run: |
          python - <<'PY'
          import sys,os,json,pathlib,subprocess,time,platform
          assert sys.version_info[:3] == (3,15,2)
          p=pathlib.Path("python/requirements.txt")
          lines=p.read_text(encoding="utf-8-sig").splitlines()
          assert sum(x=="aiohttp==3.10.7" for x in lines)==1
          out=[]
          for line in lines:
              if line=="aiohttp==3.10.7": line="aiohttp==3.14.5"
              if line.startswith(("pywin32==","win32_setctime==")): line+=' ; sys_platform == "win32"'
              out.append(line)
          pathlib.Path("experiment-derived-requirements.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          z={"class":"EXPERIMENTAL_PROBE_ONLY","Product_effect":"NONE","original_manifest_blob":"b1a9f877be8b54618942e295e95bf43bda264e42","candidate_delta":["aiohttp==3.10.7 -> aiohttp==3.14.5","windows-only requirements marked with sys_platform"],"python":sys.version,"os":platform.platform(),"run_id":os.getenv("GITHUB_RUN_ID"),"result":{}}
          p1=subprocess.run(["uv","venv",".venv-probe","--python",sys.executable],capture_output=True,text=True,timeout=90)
          if p1.returncode:
              z["result"]={"status":"BLOCKED_VENV","exit":p1.returncode,"tail":p1.stderr[-4000:]}
          else:
              try:
                  p2=subprocess.run(["uv","pip","install","--python",".venv-probe","--only-binary",":all:","-r","experiment-derived-requirements.txt"],capture_output=True,text=True,timeout=420)
                  z["result"]={"status":"PASS" if p2.returncode==0 else "BLOCKED_DEPENDENCIES","exit":p2.returncode,"tail":(p2.stdout+"\n"+p2.stderr)[-11000:]}
              except subprocess.TimeoutExpired:
                  z["result"]={"status":"TIMEOUT"}
          pathlib.Path("qualification.json").write_text(json.dumps(z,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(z,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python315-aiohttp-refresh-${{ matrix.os }}
          path: qualification.json
          if-no-files-found: warn
