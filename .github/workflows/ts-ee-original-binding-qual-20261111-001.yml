name: TS EE nonProduct original Actions identity binding synthetic qualification

on:
  push:
    branches:
      - ee/ts-ee-actions-original-binding-20261111-001
    paths:
      - .github/ts-ee-original-dispatch/TS-EE-ACTIONS-IDENTITY-QUAL-20261111-001-A001.json

permissions:
  contents: read

concurrency:
  group: ts-ee-actions-identity-qual-20261111-001
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only original head and source parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fail closed BEFORE any privileged or runtime effect
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts_ee_original_actions_binding.py \
            --root . \
            --marker .github/ts-ee-original-dispatch/TS-EE-ACTIONS-IDENTITY-QUAL-20261111-001-A001.json \
            --attempt TS-EE-ACTIONS-IDENTITY-QUAL-20261111-001-A001 \
            | tee "$RUNNER_TEMP/ts-ee-original-binding-receipt.json"
          python3 - "$RUNNER_TEMP/ts-ee-original-binding-receipt.json" <<'PY'
          import json,sys
          lines=open(sys.argv[1], encoding="utf-8").read().splitlines()
          assert len(lines)==1
          val=json.loads(lines[0])
          assert val["status"]=="TS_EE_ORIGINAL_GIT_TRANSITION_PASS"
          assert val["execution_attempt"]=="TS-EE-ACTIONS-IDENTITY-QUAL-20261111-001-A001"
          assert val["product_effect"]=="NONE"
          assert val["run_attempt"]==1
          print("TS_EE_ORIGINAL_NATIVE_GIT_IDENTITY_PASS")
          PY

      - name: Pin uv tool and CPython3.15.2 AFTER original guard
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'

      - name: Native CPython3.15.2 nine-negative synthetic proof
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.15.2
          uv run --no-project --python 3.15.2 \
            python -B tools/selftest_ts_ee_original_actions_binding.py

      - name: NonProduct effect boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "TS_EE_IDENTITY_EXPERIMENT_NONPRODUCT_NO_SQL_NO_HOST_NO_PRODUCT"
