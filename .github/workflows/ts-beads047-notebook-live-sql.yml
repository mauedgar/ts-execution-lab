      - name: Native role join (real notebook SQL server)
        env:
          TS047_ROLE: join
          TS047_ROOT: ${{ runner.temp }}/ts047-${{ github.run_id }}-join/work
          TS047_ORIGINAL: ${{ runner.temp }}/ts047-${{ github.run_id }}-join/original
          TS047_META_SOURCE: ${{ runner.temp }}/ts047-coordinator-original/META047.tar.gz
          TS047_WORKER_RECEIPTS: ${{ runner.temp }}/ts047-worker-originals
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/TS-BEADS-047-NOTEBOOK-REMOTE-SQL-20261031-001/native047.py
          test "$(jq -r .attempt "$TS047_ORIGINAL/RESULT047_JOIN.json")" = TS-BEADS-047-JOIN-ATTEMPT-001
          echo "TS047_ORIGINAL_JOIN_RECEIPT_PRESENT;Product=NONE"
