name: TS Beads 009 reconcile native GitHub remote loser
on:
  push:
    branches: [experiment/beads-github-native-remote-20261013-009]
    paths: [.github/workflows/ts-beads-009-native-github-reconcile.yml]
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      new_ref: ${{ steps.repair.outputs.new_ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: repair
        name: Verify original A/B receipts, bootstrap winner, and reconcile exact missing A
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(('x-access-token:'+$env:GITHUB_TOKEN)))
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$auth
          $remote='https://github.com/mauedgar/ts-execution-lab.git'
          $ref='refs/dolt/data'
          $winner='3c1e82c5cca379d38eeca5f88567ae96354230b2'
          $orig='cb56a7b2dba9086c8797d69eaffba58155ad9b82'
          $observed=(& git ls-remote $remote $ref|Out-String).Trim().Split([char]9)[0]
          if($LASTEXITCODE -ne 0 -or $observed -cne $winner){throw ('REMOTE_WINNER_DRIFT='+$observed)}
          $meta=(& gh api repos/mauedgar/ts-execution-lab/actions/artifacts/11860642668|Out-String).Trim()|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.name -cne 'ts-beads-native-gh009-race-receipts' -or $meta.digest -cne 'sha256:22f0696c046f96256911b0744c0c429fdbedd3f69322a60136456375adf33125' -or $meta.workflow_run.id -ne 38489101257 -or $meta.expired){throw 'ORIGINAL_RACE_ARTIFACT_IDENTITY_FAILED'}
          $root=Join-Path $env:RUNNER_TEMP 'ts-beads-gh009-reconciler'
          if(Test-Path $root){throw 'RECONCILER_DIR_ALREADY_EXISTS'}
          New-Item -ItemType Directory $root|Out-Null
          $original=Join-Path $root 'original'
          New-Item -ItemType Directory $original|Out-Null
          & gh run download 38489101257 --name ts-beads-native-gh009-race-receipts --repo mauedgar/ts-execution-lab --dir $original
          if($LASTEXITCODE -ne 0){throw 'ORIGINAL_RECEIPTS_DOWNLOAD_FAILED'}
          $a=Get-Content -Raw (Join-Path $original 'writer-A.json')|ConvertFrom-Json
          $b=Get-Content -Raw (Join-Path $original 'writer-B.json')|ConvertFrom-Json
          if($a.authority -cne 'NONE_PRODUCT' -or $b.authority -cne 'NONE_PRODUCT' -or $a.slot -cne 'A' -or $b.slot -cne 'B' -or $a.push_exit -ne 1 -or $b.push_exit -ne 0 -or $a.base_ref -cne $orig -or $b.base_ref -cne $orig -or $a.issue_id -cne 'producer-9a71a001' -or $b.issue_id -cne 'producer-9a71b002' -or $a.source_ref -cne 'test://TS-BEADS-GITHUB-NATIVE-RACE-009/WRITER-A' -or $b.source_ref -cne 'test://TS-BEADS-GITHUB-NATIVE-RACE-009/WRITER-B'){throw 'EXACT_ORIGINAL_RACE_IDENTITY_FAILED'}
          Write-Output ('TS_NATIVE_GH_RECON_ORIGINAL=VERIFIED;loser='+$a.issue_id+';winner='+$b.issue_id)
          $archive=Join-Path $root 'beads.zip'
          Invoke-WebRequest -Uri 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' -OutFile $archive
          if(((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()) -cne '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76'){throw 'BEADS_BINARY_PIN_FAILED'}
          $bin=Join-Path $root 'bin'
          Expand-Archive -LiteralPath $archive -DestinationPath $bin
          $bd=Get-ChildItem -LiteralPath $bin -Recurse -File -Filter bd.exe|Select-Object -First 1 -ExpandProperty FullName
          if(-not $bd){throw 'BEADS_EXE_NOT_FOUND'}
          $work=Join-Path $root 'fresh-state'
          & git clone --quiet --single-branch --branch experiment/beads-github-native-remote-20261013-009 $remote $work
          if($LASTEXITCODE -ne 0){throw 'GITHUB_FRESH_CLONE_FAILED'}
          Push-Location $work
          try{
            $env:BEADS_DIR=Join-Path $work '.beads'
            & $bd bootstrap
            if($LASTEXITCODE -ne 0){throw 'WINNING_DOLT_BOOTSTRAP_FAILED'}
            $all=(& $bd list --all --json|Out-String).Trim()|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or @($all).Count -ne 2){throw ('WINNER_READBACK_COUNT_NOT_TWO='+@($all).Count)}
            $ids=@($all|ForEach-Object {[string]$_.id})
            if($ids -notcontains 'producer-1qa' -or $ids -notcontains 'producer-9a71b002' -or $ids -contains 'producer-9a71a001'){throw 'EXACT_WINNER_UNQUALIFIED_OR_LOSER_ALREADY_PRESENT'}
            $shown=(& $bd show producer-9a71b002 --json|Out-String).Trim()
            $sb=@($shown|ConvertFrom-Json)[0]
            if(-not ([string]$sb.description).Contains('SOURCE_REF='+$b.source_ref)){throw 'WINNER_B_SOURCE_MISMATCH'}
            Write-Output 'TS_NATIVE_GH_RECON_PREWRITE=PASS;original=1;winner_B=1;loser_A=0'
            & $bd create 'Reconciled missing native writer A obligation' --id ([string]$a.issue_id) --type task --description ('SOURCE_REF='+$a.source_ref) --json
            if($LASTEXITCODE -ne 0){throw 'NEW_RECONCILIATION_CREATE_FAILED'}
            $after=(& $bd list --all --json|Out-String).Trim()|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or @($after).Count -ne 3){throw 'RECONCILED_LOCAL_COUNT_NOT_THREE'}
            $remoteNow=(& git ls-remote $remote $ref|Out-String).Trim().Split([char]9)[0]
            if($LASTEXITCODE -ne 0 -or $remoteNow -cne $winner){throw 'REMOTE_DRIFT_BEFORE_RECONCILED_PUSH'}
            & $bd dolt push
            $pushExit=$LASTEXITCODE
            $published=(& git ls-remote $remote $ref|Out-String).Trim().Split([char]9)[0]
            if($LASTEXITCODE -ne 0){throw 'POST_RECONCILE_REMOTE_LOOKUP_FAILED_UNKNOWN'}
            if($pushExit -ne 0 -or $published -ceq $winner){throw ('NEW_PUSH_NOT_CONFIRMED_RECONCILE_ONLY;remote='+$published+';push_exit='+$pushExit)}
            Write-Output ('TS_NATIVE_GH_RECONCILIATION=PASS;old_ref='+$winner+';new_ref='+$published+';expected_record_count=3')
            "new_ref=$published"|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }finally{Pop-Location}
  independent-audit:
    needs: reconcile
    runs-on: windows-2022
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_REF: ${{ needs.reconcile.outputs.new_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit exactly three independently restored source records from native GitHub remote
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(('x-access-token:'+$env:GITHUB_TOKEN)))
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$auth
          $remote='https://github.com/mauedgar/ts-execution-lab.git'
          $ref='refs/dolt/data'
          $got=(& git ls-remote $remote $ref|Out-String).Trim().Split([char]9)[0]
          if($LASTEXITCODE -ne 0 -or -not $env:EXPECTED_REF -or $got -cne $env:EXPECTED_REF){throw 'RECONCILED_REMOTE_SHA_MISMATCH'}
          $root=Join-Path $env:RUNNER_TEMP 'ts-beads-native-gh009-independent-audit'
          New-Item -ItemType Directory $root|Out-Null
          $f=Join-Path $root 'bd.zip'
          Invoke-WebRequest -Uri 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' -OutFile $f
          if(((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()) -cne '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76'){throw 'BIN_PIN_MISMATCH'}
          $bin=Join-Path $root 'bin'
          Expand-Archive -LiteralPath $f -DestinationPath $bin
          $bd=Get-ChildItem -LiteralPath $bin -File -Recurse -Filter bd.exe|Select-Object -First 1 -ExpandProperty FullName
          $work=Join-Path $root 'fresh-checkout'
          & git clone --quiet --single-branch --branch experiment/beads-github-native-remote-20261013-009 $remote $work
          if($LASTEXITCODE -ne 0){throw 'AUDIT_GITHUB_CLONE_FAILED'}
          Push-Location $work
          try{
            $env:BEADS_DIR=Join-Path $work '.beads'
            & $bd bootstrap
            if($LASTEXITCODE -ne 0){throw 'AUDIT_NATIVE_BOOTSTRAP_FAILED'}
            $all=(& $bd list --all --json|Out-String).Trim()|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or @($all).Count -ne 3){throw 'AUDIT_COUNT_NOT_THREE'}
            $expected=@(
              @{id='producer-1qa';marker='test://TS-BEADS-NATIVE-GITHUB-REMOTE-20261013-009/ORIGIN-A@FROZEN'},
              @{id='producer-9a71b002';marker='test://TS-BEADS-GITHUB-NATIVE-RACE-009/WRITER-B'},
              @{id='producer-9a71a001';marker='test://TS-BEADS-GITHUB-NATIVE-RACE-009/WRITER-A'}
            )
            foreach($v in $expected){
              if(@($all|Where-Object {$_.id -ceq $v.id}).Count -ne 1){throw ('AUDIT_ID_DUPLICATE_OR_ABSENT_'+$v.id)}
              $shown=(& $bd show ([string]$v.id) --json|Out-String).Trim()
              if($LASTEXITCODE -ne 0){throw ('AUDIT_SHOW_FAILED_'+$v.id)}
              $issue=@($shown|ConvertFrom-Json)[0]
              if(-not ([string]$issue.description).Contains('SOURCE_REF='+$v.marker)){throw ('AUDIT_ORIGIN_MISMATCH_'+$v.id)}
            }
          }finally{Pop-Location}
          $post=(& git ls-remote $remote $ref|Out-String).Trim().Split([char]9)[0]
          if($LASTEXITCODE -ne 0 -or $post -cne $got){throw 'AUDIT_REMOTE_REF_DRIFT'}
          Write-Output ('TS_NATIVE_GH_RECONCILED_INDEPENDENT_AUDIT=PASS;ref='+$got+';issues=3;A=1;B=1;original=1;reader=NEW_GITHUB_ACTIONS_RUNNER')
