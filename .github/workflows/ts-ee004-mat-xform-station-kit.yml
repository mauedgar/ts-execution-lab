name: TS EE 004 MAT-XFORM guarded Windows kit (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-mat-xform-notebook-binding-20261124
permissions:
  contents: read
concurrency:
  group: ts-ee004-mat-xform-notebook-kit
  cancel-in-progress: false
jobs:
  windows-kit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build exact source kit, no lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {throw 'HEAD_MISMATCH'}
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {throw 'NPM_CI_FAILED'}
          $kit=Join-Path $env:RUNNER_TEMP 'ts-ee-mat-xform-kit'
          node scripts/station/mat-xform-v1/build-kit.mjs $kit
          if ($LASTEXITCODE -ne 0) {throw 'KIT_FAILED'}
          # Artifact packaging before tests: pristine install, empty inbox/runs.
          New-Item -ItemType Directory -Path source-evidence | Out-Null
          Compress-Archive -LiteralPath $kit -DestinationPath source-evidence/STATION_KIT.zip
          $hash=(Get-FileHash -LiteralPath source-evidence/STATION_KIT.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary=@{schema='ts-ee/mat-xform-kit-ci/v1';head=$env:GITHUB_SHA;tree=(git rev-parse 'HEAD^{tree}').Trim();run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;zip_sha256=$hash;manifest_sha256=(Get-FileHash -LiteralPath (Join-Path $kit 'manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant();Native_notebook='NOT_RUN';Product_effect='NONE'}
          $summary | ConvertTo-Json -Compress | Set-Content -LiteralPath source-evidence/SOURCE_ONLY.json -Encoding utf8NoBOM
      - name: New Windows target adapter fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $kit=Join-Path $env:RUNNER_TEMP 'ts-ee-mat-xform-kit'
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl=Get-Acl -LiteralPath $kit
          $acl.SetAccessRuleProtection($true,$false)
          foreach($identity in @($sid.Value,'S-1-5-18','S-1-5-32-544')){
            $rule=[Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($identity),'FullControl','ContainerInherit,ObjectInherit','None','Allow')
            $acl.SetAccessRule($rule)
          }
          Set-Acl -LiteralPath $kit -AclObject $acl
          $actual=Get-Acl -LiteralPath $kit
          $sddl=$actual.GetSecurityDescriptorSddlForm([Security.AccessControl.AccessControlSections]::Owner -bor [Security.AccessControl.AccessControlSections]::Group -bor [Security.AccessControl.AccessControlSections]::Access)
          $env:TEST_ROOT_ACL_SHA256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($sddl))).ToLowerInvariant()
          node scripts/station/mat-xform-v1/test-station.mjs $kit | Tee-Object -FilePath source-evidence/TESTS.txt
          if ($LASTEXITCODE -ne 0) {throw 'FIXTURES_FAILED'}
      - name: Preserve original kit and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-mat-xform-station-kit
          path: source-evidence/
          retention-days: 5
          if-no-files-found: warn
