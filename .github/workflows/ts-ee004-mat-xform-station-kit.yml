name: TS EE 004 MAT-XFORM guarded Windows kit (NONPRODUCT)
on:
  push:
    branches:
      - experiment/ts-ee004-mat-xform-notebook-binding-20261124
permissions:
  contents: read
concurrency:
  group: ts-ee004-mat-xform-notebook-kit
  cancel-in-progress: false
jobs:
  windows-kit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build exact source kit, no lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {throw 'HEAD_MISMATCH'}
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {throw 'NPM_CI_FAILED'}
          $kit=Join-Path $env:RUNNER_TEMP 'ts-ee-mat-xform-kit'
          New-Item -ItemType Directory -Path source-evidence | Out-Null
          node scripts/station/mat-xform-v1/build-kit.mjs $kit | Tee-Object -FilePath source-evidence/BUILD.json
          if ($LASTEXITCODE -ne 0) {throw 'KIT_FAILED'}
          # Artifact packaging before tests: pristine install, empty runtime/inbox/runs.
          Compress-Archive -LiteralPath $kit -DestinationPath source-evidence/STATION_KIT.zip
          $hash=(Get-FileHash -LiteralPath source-evidence/STATION_KIT.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary=@{schema='ts-ee/mat-xform-kit-ci/v1';head=$env:GITHUB_SHA;tree=(git rev-parse 'HEAD^{tree}').Trim();run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;zip_sha256=$hash;manifest_sha256=(Get-FileHash -LiteralPath (Join-Path $kit 'manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant();Native_notebook='NOT_RUN';Product_effect='NONE'}
          $summary | ConvertTo-Json -Compress | Set-Content -LiteralPath source-evidence/SOURCE_ONLY.json -Encoding utf8NoBOM
      - name: New Windows target adapter fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installParent=Join-Path $env:RUNNER_TEMP 'ts-ee-mat-xform-install-parent'
          New-Item -ItemType Directory -Path $installParent | Out-Null
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl=Get-Acl -LiteralPath $installParent
          $acl.SetAccessRuleProtection($true,$false)
          foreach($identity in @($sid.Value,'S-1-5-18','S-1-5-32-544')){
            $rule=[Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($identity),'FullControl','ContainerInherit,ObjectInherit','None','Allow')
            $acl.SetAccessRule($rule)
          }
          Set-Acl -LiteralPath $installParent -AclObject $acl
          $kit=Join-Path $installParent 'station'
          $badRoot=Join-Path $installParent 'wrong-hash'
          $zip=[IO.Path]::GetFullPath('source-evidence/STATION_KIT.zip')
          $e=Get-Content -Raw -LiteralPath source-evidence/SOURCE_ONLY.json | ConvertFrom-Json
          $resolved=@(node -p "process.execPath")
          if($LASTEXITCODE -ne 0 -or $resolved.Count -ne 1 -or -not [IO.Path]::IsPathFullyQualified([string]$resolved[0])){throw 'RUNTIME_SOURCE_AMBIGUOUS'}
          $sourceNode=[IO.Path]::GetFullPath([string]$resolved[0])
          $sourceHash=(Get-FileHash -LiteralPath $sourceNode -Algorithm SHA256).Hash.ToLowerInvariant()
          $installer='scripts/station/mat-xform-v1/Install-Kit.ps1'
          $installerHash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $bad=@(pwsh.exe -NoLogo -NoProfile -NonInteractive -File $installer -Root $badRoot -KitZip $zip -ZipSha256 ('0'*64) -ManifestSha256 $e.manifest_sha256 -SourceNode $sourceNode -NodeSha256 $sourceHash)
          if($LASTEXITCODE -ne 1 -or $bad.Count -ne 1 -or (Test-Path -LiteralPath $badRoot)){throw 'INSTALL_NEGATIVE_HASH_FAILED'}
          $br=$bad[0] | ConvertFrom-Json
          if($br.effect -ne 'NONE' -or $br.reason -ne 'ZIP_HASH'){throw 'INSTALL_NEGATIVE_HASH_REASON'}
          Write-Output 'PASS install-wrong-hash ZIP_HASH'
          $native=@(pwsh.exe -NoLogo -NoProfile -NonInteractive -File $installer -Root $kit -KitZip $zip -ZipSha256 $e.zip_sha256 -ManifestSha256 $e.manifest_sha256 -SourceNode $sourceNode -NodeSha256 $sourceHash)
          if($LASTEXITCODE -ne 0 -or $native.Count -ne 1){throw 'INSTALL_NATIVE_FAILED'}
          $ir=$native[0] | ConvertFrom-Json
          if($ir.status -ne 'INSTALLED_NOT_ADMITTED' -or $ir.effect -ne 'CONFIRMED' -or $ir.root -cne $kit -or $ir.node_sha256 -cne $sourceHash){throw 'INSTALL_RECEIPT_MISMATCH'}
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('source-evidence/INSTALL.json'),$native[0],[Text.UTF8Encoding]::new($false))
          $existingFiles=@(Get-ChildItem -LiteralPath $kit -Recurse -File -Force).Count
          $collision=@(pwsh.exe -NoLogo -NoProfile -NonInteractive -File $installer -Root $kit -KitZip $zip -ZipSha256 $e.zip_sha256 -ManifestSha256 $e.manifest_sha256 -SourceNode $sourceNode -NodeSha256 $sourceHash)
          if($LASTEXITCODE -ne 1 -or $collision.Count -ne 1){throw 'INSTALL_COLLISION_FAILED'}
          $cr=$collision[0] | ConvertFrom-Json
          if($cr.effect -ne 'NONE' -or $cr.reason -notmatch 'INSTALL_ROOT_RESERVATION_FAILED' -or @(Get-ChildItem -LiteralPath $kit -Recurse -File -Force).Count -ne $existingFiles){throw 'INSTALL_COLLISION_EFFECT'}
          Write-Output 'PASS install-collision no new effect'
          Write-Output "INSTALLER_SHA256=$installerHash"
          Write-Output "PASS installed-pristine-kit files=$($ir.file_count)"
          $env:TEST_ROOT_ACL_SHA256=$ir.root_acl_sha256
          node scripts/station/mat-xform-v1/test-station.mjs $kit | Tee-Object -FilePath source-evidence/TESTS.txt
          if ($LASTEXITCODE -ne 0) {throw 'FIXTURES_FAILED'}
      - name: Preserve original kit and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee004-mat-xform-station-kit
          path: source-evidence/
          retention-days: 5
          if-no-files-found: warn
