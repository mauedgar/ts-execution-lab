name: TS EE Frontend QA common-contract qualification
on:
  push:
    branches:
      - experiment/ts-ee-frontend-qa-common-20261119-001
      - experiment/ts-ee-feqa-ir002-repair-20261119-001
      - experiment/ts-ee-feqa-ir003-repair-20261119-001
permissions:
  contents: read
concurrency:
  group: ts-ee-feqa-common-20261119-001
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Native checkout identity
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse 'HEAD^{tree}'
      - name: Run deterministic contract negative-case tests
        run: python -m unittest discover -s experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests -p 'test_*.py' -v
      - name: Validate synthetic reference vector
        run: python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/fixtures/qa_report_v0.example.json

      - name: Pin Node 22.23.3
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Qualify bounded pure-TypeScript test loader
        run: node --test experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/tests/test_pure_typescript_transform.mjs
      - name: Install isolated Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Execute full synthetic four-viewport QA with preventive service worker policy
        run: python experiments/TS-EE-E2-BROWSER-QA-20261119-001/e2_browser_qa.py --output e2-common-evidence
      - name: Convert ACTUAL E2 browser receipt into common QA schema
        run: |
          set -eu
          TREE="$(git rev-parse 'HEAD^{tree}')"
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/adapters/e2_to_common.py \
            --e2 e2-common-evidence/RESULT.json \
            --source-script experiments/TS-EE-E2-BROWSER-QA-20261119-001/e2_browser_qa.py \
            --output e2-common-evidence/COMMON_RECEIPT.json \
            --repository mauedgar/ts-execution-lab \
            --commit "$GITHUB_SHA" --tree "$TREE" --run-id "$GITHUB_RUN_ID" \
            --attempt TS-EE-FEQA-COMMON-METHOD-IR001-REPAIR-B001
          python experiments/TS-EE-FRONTEND-QA-COMMON-20261119-001/receipt_validator.py \
            e2-common-evidence/COMMON_RECEIPT.json \
            --artifact-root e2-common-evidence \
            --expected-commit "$GITHUB_SHA" --expected-tree "$TREE" --expected-run-id "$GITHUB_RUN_ID"
      - name: Preserve exact browser screenshot and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-ee-feqa-browser-evidence
          path: e2-common-evidence/
          retention-days: 5
          if-no-files-found: warn
