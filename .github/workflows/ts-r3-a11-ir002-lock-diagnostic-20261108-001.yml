name: TS R3 A11 IR002 Lock Stage Diagnostic Qualification
# Historical attempt 42553999371 terminal FAILURE; preserve original native result.
# Archived: no push trigger, manual dispatch always skips this job.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ts-r3-a11-ir002-lock-diagnostic-one-shot-20261108-001
  cancel-in-progress: false
jobs:
  original-js-async-pg16:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsr3_a11_synthetic
          POSTGRES_PASSWORD: a11_disposable_only
          POSTGRES_DB: tsr3_a11_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsr3_a11_synthetic -d tsr3_a11_synthetic"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 12
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CONFIG: "1"
      TS_R3_LOCAL_SYNTHETIC_PG_URI: "postgresql://tsr3_a11_synthetic:a11_disposable_only@127.0.0.1:5432/tsr3_a11_synthetic?sslmode=disable"
    steps:
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen Product and exact A11 write-set
        run: |
          set -euo pipefail
          root='experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001'
          frozen() { test "$(git rev-parse "HEAD:$root/$1")" = "$2"; }
          frozen a11_real_pg16_port/worker.py e02f2f9bff36071b26851a19234948224de3b26a
          frozen a11_real_pg16_port/port.cjs 7578e43af38cf9ad087cb78ecf4693a0822b13d0
          frozen a11_real_pg16_port/qualify.cjs de0ccfed069f7c6e7ea6c9fd2981f75a2724d2d3
          frozen a11_real_pg16_port/schema_guard.py 161cf9c0065946a4ff3164e819a7aaf97eaa012f
          frozen a11_real_pg16_port/QUALIFICATION_CONTRACT.md fadb99fbc39897d889f8f245049c68642b349fd7
          frozen a11_real_pg16_port/fault_worker.py 804e9d26f160ae464b78f95b23de026e395a5134
          frozen a11_real_pg16_port/qualify_negatives.cjs 1d0be794bf45b5ccf007f8dd42ae84fadc0af610
          frozen a11_real_pg16_port/IR001_REPAIRS.md 71e1a0e8e4567a9218c263d9db3cc7c8e3074dbd
          frozen a11_real_pg16_port/lock_race.py 29bb05921f90ecb7c73d59f1062c12dd5fb0d76c
          frozen a11_real_pg16_port/qualify_lock.cjs 0a80ff965eaaa8f19fc67d2bb8c2b7170bd1071a
          frozen a11_real_pg16_port/IR002_LOCK_CONTRACT.md 81a635b313f68095883e7d07ac8accdd0fc31d9f
          frozen a10_lc_core_semantics/shadow_async_adapter.cjs 4a9ee4f454dd28eddf8f863064e973f28e43341c
          frozen ts_global/bridge.py 61be5ce70662a31118f9ffe442d1a03a5e9f195d
          frozen ts_global/legacy_v0.py 1e39566fdd8cfb0a8de2726c613fb99fd1faa808
          frozen schema.sql 3b1604bd7aca0f7cf6c8db84fa615913fa39e9f0
          frozen pyproject.toml 2fe9ee1733e71107eac5eb3c915642a3801e210f
          frozen fixtures/product-kernel-v0/contracts.js 5d2d3a8a24ebc17339675e0c801595956e0cd353
          frozen fixtures/product-kernel-v0/index.js 0219b92e5f546407a6060a6dc449865c14c7f144
          frozen fixtures/product-kernel-v0/store.js f80d7cfe2bc9cd228cb6e3ca817c2e8802e74c8a
          frozen differential/e1/package.json 67b246532b4573af1477af8b11244c157151d371
          frozen differential/e1/package-lock.json ecf387f8f425598187f3a68b8eac5388376129ce
          test -z "${TS_R3_NEON_CHILD_DSN-}" || { echo BLOCKED_NEON_DSN; exit 41; }
          test -z "${DATABASE_URL-}" || { echo BLOCKED_DB_URL; exit 42; }
          test -z "${PGPASSWORD-}" || { echo BLOCKED_DB_PASSWORD_ENV; exit 43; }
          test -z "$(git status --porcelain)"
      - name: Pin Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Pin uv 0.13.7
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Run isolated original JS to actual PG16, reconcile and guard schema cleanup
        run: |
          set -euo pipefail
          root='experiments/TS-R3-KERNEL-GLOBAL-HEAD-20261107-001'
          test "$(node -p 'process.versions.node')" = "22.16.0"
          uv python install 3.15.2
          cd "$root"
          uv lock --no-config --python 3.15.2
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = "5f9d50047f5f55da1002c951e1f8f0da0d30f89bd7fdbd7359f7164d933b157d"
          uv sync --no-config --locked --python 3.15.2 --no-install-project
          py="$PWD/.venv/bin/python"
          "$py" -I -B -c 'import sys,psycopg,psycopg.pq; assert sys.version_info[:3]==(3,15,2) and psycopg.__version__=="3.3.8" and psycopg.pq.__impl__=="binary"'
          scratch="$(mktemp -d -p /tmp ts-r3-a11-XXXXXX)"
          test "$scratch" != "/tmp"
          work="$scratch/product-v0"
          mkdir "$work" "$scratch/clean-home"
          trap 'rm -rf "$scratch"' EXIT
          cp fixtures/product-kernel-v0/{contracts,index,store}.js "$work/"
          cp differential/e1/{package.json,package-lock.json} "$work/"
          env -i PATH="$PATH" HOME="$scratch/clean-home" npm_config_cache="$scratch/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null npm ci --prefix "$work" --ignore-scripts --no-audit --no-fund
          test "$(env -i PATH="$PATH" HOME="$scratch/clean-home" node -p "require('$work/node_modules/zod/package.json').version")" = "4.6.7"
          "$py" -B a11_real_pg16_port/schema_guard.py prepare
          node a11_real_pg16_port/qualify.cjs "$work" "$scratch" "$py" | tee "$scratch/a11-result.json"
          "$py" -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r["status"]=="A11_ORIGINAL_JS_ASYNC_REAL_POSTGRES16_BRIDGE_PASS" and r["revision"]==4 and r["heads"]==1 and r["events"]==4 and r["receipts"]==4 and r["real_backend"]=="DISPOSABLE_REAL_POSTGRESQL16" and r["synthetic_ipc_loss"]=="YES" and r["real_tcp_ack_loss"]=="NOT_RUN" and r["product_effect"]=="NONE" and r["remote_neon"]=="NOT_RUN"' "$scratch/a11-result.json"
          node a11_real_pg16_port/qualify_negatives.cjs "$work" "$scratch" "$py" | tee "$scratch/a11-negative-result.json"
          "$py" -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r["status"]=="A11_REAL_PG16_NEGATIVE_BOUNDARIES_PASS" and len(r["cases"])==7 and r["heads"]==1 and r["events"]==5 and r["receipts"]==5 and r["revision"]==5 and not r["proven_server_lock_overlap"] and r["no_product_effect"] and r["neon"]=="NOT_RUN"' "$scratch/a11-negative-result.json"
          node a11_real_pg16_port/qualify_lock.cjs "$work" "$scratch" "$py" | tee "$scratch/a11-lock-result.json"
          "$py" -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r["status"]=="A11_REAL_PG16_JS_CAS_WITH_LOCK_OVERLAP_PASS" and r["server_lock_overlap_positive"] and r["backend_sessions"]==2 and r["physical_hosts"]==1 and r["heads"]==1 and r["events"]==6 and r["receipts"]==6 and r["revision"]==6 and r["original_js_proposal"] and r["neon"]=="NOT_RUN" and r["product_effect"]=="NONE"' "$scratch/a11-lock-result.json"
          "$py" -B a11_real_pg16_port/schema_guard.py cleanup
          echo A11_IR002_EXACT_COLLISION_REAL_PG16_POSITIVE_LOCK_PASS
