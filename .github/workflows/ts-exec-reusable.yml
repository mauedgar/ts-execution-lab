name: ts-exec-reusable

on:
  workflow_call:
    inputs:
      lab_ref:
        description: Exact ts-execution-lab commit or ref containing the runner
        required: true
        type: string
      request_json:
        description: Bounded ExecutionRequest JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private caller
        uses: actions/checkout@v4
        with:
          path: product
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          repository: mauedgar/ts-execution-lab
          ref: ${{ inputs.lab_ref }}
          path: runner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runner dependencies
        working-directory: runner
        run: npm ci
      - name: Materialize request
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: node -e "const fs=require('fs'); fs.mkdirSync('runner/remote',{recursive:true}); fs.writeFileSync('runner/remote/request.json', process.env.REQUEST_JSON + '\\n')"
      - name: Execute request
        working-directory: runner
        run: node src/cli.ts run remote/request.json --out remote/out --binding github-actions
      - name: Emit compact execution summary
        working-directory: runner
        run: node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('remote/out/result.json','utf8')); const c=JSON.parse(fs.readFileSync('remote/out/receipt.json','utf8')); console.log('TS_EXEC_SUMMARY='+JSON.stringify({request_identity:r.request_identity,ExecutionAttempt_ref:r.ExecutionAttempt_ref,result_status:r.result_status,effect_state:r.effect_state,semantic_digest:r.semantic_digest,exact_subject_ref:c.exact_subject_ref,selected_binding_ref:c.selected_binding_ref,subprocess_count:r.observation.subprocess_count,timings:r.observation.timings}))"
      - uses: actions/upload-artifact@v4
        with:
          name: ts-exec-reusable-${{ github.run_id }}
          path: |
            runner/remote/out/result.json
            runner/remote/out/receipt.json
