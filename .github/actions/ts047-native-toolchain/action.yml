name: TS047 pinned native Beads/Dolt toolchain
description: Isolated user-space native Beads v1.3.1 and Dolt v2.2.0 for remote SQL
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/ts047-native-tools"
        test ! -e "$root"
        mkdir -p "$root/bd" "$root/dolt"
        curl --fail --location --silent --show-error --output "$root/beads.tar.gz" https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz
        echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  $root/beads.tar.gz" | sha256sum -c -
        curl --fail --location --silent --show-error --output "$root/dolt.tar.gz" https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-linux-amd64.tar.gz
        echo "1f7ad8c2622995789420a3fb0f2d16b4aa7430000a825dd91d5938f36480cbf6  $root/dolt.tar.gz" | sha256sum -c -
        tar -xzf "$root/beads.tar.gz" -C "$root/bd"
        tar -xzf "$root/dolt.tar.gz" -C "$root/dolt"
        bd_bin="$(find "$root/bd" -type f -name bd -print -quit)"
        dolt_bin="$(find "$root/dolt" -type f -name dolt -print -quit)"
        test -n "$bd_bin" && test -n "$dolt_bin"
        chmod +x "$bd_bin" "$dolt_bin"
        "$bd_bin" --version | grep -F 1.3.1
        "$dolt_bin" version | grep -F 2.2.0
        echo "BD_BIN=$bd_bin" >> "$GITHUB_ENV"
        echo "$(dirname "$dolt_bin")" >> "$GITHUB_PATH"
        python3 -m pip install --quiet --disable-pip-version-check pymysql==1.1.1
        echo "TS047_TOOLCHAIN=VERIFIED_NATIVE_BINARY_PINS"
